<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 760" width="1200" height="760">
  <title id="title">交易/金融 Agent：时效、执行隔离与能力沙箱</title>
  <desc id="desc">高风险示例展示实时数据和不可逆动作如何改变测试责任；它不是所有 Agent 的通用阈值。 本图不构成交易授权、合规意见或生产安全证明；所有资金系统均 NOT_RUN。</desc>
  
    <linearGradient id="ds-header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e3026"/>
      <stop offset="1" stop-color="#174a3a"/>
    </linearGradient>
  
  <defs>
    <filter id="ds-soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0e3026" flood-opacity="0.08"/>
    </filter>
    <filter id="ds-strong" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0e3026" flood-opacity="0.13"/>
    </filter>
    <marker id="ds-arw-forest" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#174a3a"/>
    </marker>
    <marker id="ds-arw-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a96a18"/>
    </marker>
    <marker id="ds-arw-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b2402f"/>
    </marker>
    <marker id="ds-arw-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#85908a"/>
    </marker>
  </defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0e3026" flood-opacity=".10"/></filter>
  <style>
    .bg{fill:#fbfaf6}.header{fill:url(#ds-header-grad)}.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;fill:#93bd2c}.title{font:800 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:white}.subtitle{font:450 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#d9e8e0}.source{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9db7ab}.node-index{font:800 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#85908a}.node-title{font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#1c2924}.node-detail{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#5f6c66}.edge path{fill:none;stroke:#174a3a;stroke-width:2}.edge text{font:600 9px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#5f6c66;paint-order:stroke;stroke:#fbfaf6;stroke-width:4px}.callout{fill:#fdf1d8;stroke:#e3c07b;stroke-width:1.5}.callout-title{font:800 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;fill:#a96a18}.callout-text{font:650 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#1c2924}.footer{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#5f6c66}
  </style>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <rect class="header" width="1200" height="92" rx="24"/><rect class="header" y="68" width="1200" height="24"/>
  <text class="eyebrow" x="34" y="30">HIGH-RISK ADAPTER</text>
  <text class="title" x="34" y="62">交易/金融 Agent：时效、执行隔离与能力沙箱</text>
  <text class="subtitle" x="1166" y="30" text-anchor="end">高风险示例展示实时数据和不可逆动作如何改变测试责任；它不是所有 Agent 的通用阈值。</text>
  <text class="source" x="34" y="111">来源：S07 · S50 · S65</text>
  <g class="edge"><path d="M 224 175 C 245 175, 245 175, 258 175" marker-end="url(#ds-arw-forest)"/><text x="245" y="185">时效合格</text></g>
<g class="edge"><path d="M 224 175 C 245 175, 245 572, 258 572" marker-end="url(#ds-arw-forest)"/><text x="245" y="365.5">过期</text></g>
<g class="edge"><path d="M 456 175 C 477 175, 477 175, 490 175" marker-end="url(#ds-arw-forest)"/><text x="477" y="185">不得直接相连</text></g>
<g class="edge"><path d="M 688 175 C 709 175, 709 175, 722 175" marker-end="url(#ds-arw-forest)"/><text x="709" y="167">执行入口</text></g>
<g class="edge"><path d="M 920 175 C 972 464, 446 464, 490 369" marker-end="url(#ds-arw-forest)"/><text x="709" y="282">强制控制</text></g>
<g class="edge"><path d="M 688 369 C 709 369, 709 369, 722 369" marker-end="url(#ds-arw-forest)"/><text x="709" y="361">高危动作</text></g>
<g class="edge"><path d="M 920 369 C 941 369, 941 369, 954 369" marker-end="url(#ds-arw-forest)"/><text x="941" y="379">拒绝/异常</text></g>
<g class="edge"><path d="M 920 175 C 972 670, 214 670, 258 572" marker-end="url(#ds-arw-forest)"/><text x="593" y="365.5">越权</text></g>
<g class="edge"><path d="M 526 572 C 744 572, 744 369, 954 369" marker-end="url(#ds-arw-forest)"/><text x="744" y="480.5">保持无副作用</text></g>
  
    <g class="node fresh">
      <rect x="34" y="132" width="190" height="86" rx="15" fill="#fdf1d8" stroke="#e0b76a" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="34" y="132" width="5" height="86" rx="2.5" fill="#e0b76a"/>
      <text class="node-index" x="54" y="155">01</text>
      <text class="node-title" x="54" y="180">数据时效</text>
      <text class="node-detail" x="54" y="202">Timestamp / Freshness Oracle</text>
    </g>
    <g class="node advice">
      <rect x="266" y="132" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="266" y="132" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="286" y="155">02</text>
      <text class="node-title" x="286" y="180">建议任务</text>
      <text class="node-detail" x="286" y="202">只读 / UNKNOWN / 转人工</text>
    </g>
    <g class="node execute">
      <rect x="498" y="132" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="498" y="132" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="518" y="155">03</text>
      <text class="node-title" x="518" y="180">执行任务</text>
      <text class="node-detail" x="518" y="202">独立数据集 / 独立 Owner</text>
    </g>
    <g class="node sandbox">
      <rect x="730" y="132" width="190" height="86" rx="15" fill="#fdf1d8" stroke="#e0b76a" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="730" y="132" width="5" height="86" rx="2.5" fill="#e0b76a"/>
      <text class="node-index" x="750" y="155">04</text>
      <text class="node-title" x="750" y="180">能力沙箱</text>
      <text class="node-detail" x="750" y="202">工具白名单 / Scope</text>
    </g>
    <g class="node limit">
      <rect x="498" y="326" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="498" y="326" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="518" y="349">05</text>
      <text class="node-title" x="518" y="374">硬额度</text>
      <text class="node-detail" x="518" y="396">工具层限额 / 频率</text>
    </g>
    <g class="node approval">
      <rect x="730" y="326" width="190" height="86" rx="15" fill="#fdf1d8" stroke="#e0b76a" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="730" y="326" width="5" height="86" rx="2.5" fill="#e0b76a"/>
      <text class="node-index" x="750" y="349">06</text>
      <text class="node-title" x="750" y="374">人工审批</text>
      <text class="node-detail" x="750" y="396">双人确认 / 有效授权</text>
    </g>
    <g class="node rollback">
      <rect x="962" y="326" width="200" height="86" rx="15" fill="#fdf1d8" stroke="#e0b76a" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="962" y="326" width="5" height="86" rx="2.5" fill="#e0b76a"/>
      <text class="node-index" x="982" y="349">07</text>
      <text class="node-title" x="982" y="374">回滚 / Kill Switch</text>
      <text class="node-detail" x="982" y="396">分钟级停止与恢复</text>
    </g>
    <g class="node blocked">
      <rect x="266" y="526" width="260" height="92" rx="15" fill="#fbe9e5" stroke="#e3a89f" stroke-width="2" filter="url(#shadow)"/>
      <rect x="266" y="526" width="5" height="92" rx="2.5" fill="#e3a89f"/>
      <text class="node-index" x="286" y="549">08</text>
      <text class="node-title" x="286" y="574">BLOCKED</text>
      <text class="node-detail" x="286" y="596">陈旧数据或未授权执行</text>
    </g>
  <rect class="callout" x="34" y="658" width="1132" height="48" rx="12"/>
  <text class="callout-title" x="52" y="679">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">建议与执行必须物理隔离；Prompt 中的‘不要超额’不能替代工具硬限额。</text>
  <text class="footer" x="34" y="735">本图不构成交易授权、合规意见或生产安全证明；所有资金系统均 NOT_RUN。</text>
</svg>
