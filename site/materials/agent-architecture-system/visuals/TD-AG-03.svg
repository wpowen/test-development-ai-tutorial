<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 760" width="1200" height="760">
  <title id="title">D2 Handoff、上下文隔离与级联熔断</title>
  <desc id="desc">每次 Agent A → Agent B 的交接都必须传递事实、责任、权限与停止条件。 本图只证明编排合同可教学与 fixture 可重放，不证明真实多 Agent 平台已验证。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#0b3b32"/><stop offset="1" stop-color="#176b5b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#176b5b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#12372f" flood-opacity=".12"/></filter>
  </defs>
  <style>
    .bg{fill:#f7faf8}.header{fill:url(#header)}.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;fill:#bfe9dc}.title{font:800 28px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:white}.subtitle{font:450 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#d7eee7}.source{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6c7c76}.node rect{fill:white;stroke:#b7d0c7;stroke-width:1.5;filter:url(#shadow)}.node:nth-of-type(3n+1) rect{fill:#eef8f4;stroke:#86b9a8}.node:nth-of-type(3n+2) rect{fill:#f6f8e9;stroke:#c4ce87}.node-index{font:700 10px ui-monospace,monospace;fill:#7c8b85}.node-title{font:800 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#123f34}.node-detail{font:500 11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#5a6b64}.edge path{fill:none;stroke:#176b5b;stroke-width:2}.edge text{font:600 9px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#557168;paint-order:stroke;stroke:#f7faf8;stroke-width:4px}.callout{fill:#fff3db;stroke:#e2b260;stroke-width:1.5}.callout-title{font:800 11px ui-monospace,monospace;fill:#8a5610}.callout-text{font:650 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#62430f}.footer{font:500 11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#62716b}
  </style>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <rect class="header" width="1200" height="92" rx="24"/><rect class="header" y="68" width="1200" height="24"/>
  <text class="eyebrow" x="34" y="29">D2 · ORCHESTRATION</text>
  <text class="title" x="34" y="61">D2 Handoff、上下文隔离与级联熔断</text>
  <text class="subtitle" x="600" y="31">每次 Agent A → Agent B 的交接都必须传递事实、责任、权限与停止条件。</text>
  <text class="source" x="34" y="111">来源：S35 · S48 · S74</text>
  <g class="edge"><path d="M 222 175 C 242 175, 242 175, 254 175" marker-end="url(#arrow)"/><text x="242" y="185">结构化交接</text></g>
<g class="edge"><path d="M 472 175 C 492 175, 492 175, 504 175" marker-end="url(#arrow)"/><text x="492" y="167">最小上下文</text></g>
<g class="edge"><path d="M 722 175 C 742 175, 742 175, 754 175" marker-end="url(#arrow)"/><text x="742" y="185">授权执行</text></g>
<g class="edge"><path d="M 950 175 C 970 175, 970 175, 982 175" marker-end="url(#arrow)"/><text x="970" y="167">返回</text></g>
<g class="edge"><path d="M 1166 175 C 1218 270, -18 270, 26 175" marker-end="url(#arrow)"/><text x="600" y="185">受控反馈</text></g>
<g class="edge"><path d="M 722 369 C 742 369, 742 175, 754 175" marker-end="url(#arrow)"/><text x="742" y="264">注入异常</text></g>
<g class="edge"><path d="M 950 175 C 1002 464, 710 464, 754 369" marker-end="url(#arrow)"/><text x="856" y="282">超时/循环</text></g>
<g class="edge"><path d="M 972 369 C 981 369, 981 369, 982 369" marker-end="url(#arrow)"/><text x="981" y="361">告警与责任</text></g>
<g class="edge"><path d="M 972 369 C 1024 670, 584 670, 628 572" marker-end="url(#arrow)"/><text x="804" y="480.5">预算耗尽</text></g>
<g class="edge"><path d="M 1166 369 C 1218 670, 584 670, 628 572" marker-end="url(#arrow)"/><text x="901" y="462.5">决定停止</text></g>
  
    <g class="node a">
      <rect x="34" y="132" width="188" height="86" rx="15"/>
      <text class="node-index" x="50" y="155">01</text>
      <text class="node-title" x="50" y="180">Agent A</text>
      <text class="node-detail" x="50" y="202">来源、事实、owner</text>
    </g>
    <g class="node handoff">
      <rect x="262" y="132" width="210" height="86" rx="15"/>
      <text class="node-index" x="278" y="155">02</text>
      <text class="node-title" x="278" y="180">Handoff Schema</text>
      <text class="node-detail" x="278" y="202">必传字段 / 语义约束</text>
    </g>
    <g class="node isolate">
      <rect x="512" y="132" width="210" height="86" rx="15"/>
      <text class="node-index" x="528" y="155">03</text>
      <text class="node-title" x="528" y="180">上下文隔离</text>
      <text class="node-detail" x="528" y="202">最小可见 / 秘密隔离</text>
    </g>
    <g class="node b">
      <rect x="762" y="132" width="188" height="86" rx="15"/>
      <text class="node-index" x="778" y="155">04</text>
      <text class="node-title" x="778" y="180">Agent B</text>
      <text class="node-detail" x="778" y="202">受限任务 / 工具</text>
    </g>
    <g class="node result">
      <rect x="990" y="132" width="176" height="86" rx="15"/>
      <text class="node-index" x="1006" y="155">05</text>
      <text class="node-title" x="1006" y="180">返回合同</text>
      <text class="node-detail" x="1006" y="202">结果 / Unknown / Error</text>
    </g>
    <g class="node fault">
      <rect x="512" y="326" width="210" height="86" rx="15"/>
      <text class="node-index" x="528" y="349">06</text>
      <text class="node-title" x="528" y="374">故障注入</text>
      <text class="node-detail" x="528" y="396">超时 / 空结果 / 污染</text>
    </g>
    <g class="node breaker">
      <rect x="762" y="326" width="210" height="86" rx="15"/>
      <text class="node-index" x="778" y="349">07</text>
      <text class="node-title" x="778" y="374">三重熔断</text>
      <text class="node-detail" x="778" y="396">步数 / 时间 / 成本</text>
    </g>
    <g class="node owner">
      <rect x="990" y="326" width="176" height="86" rx="15"/>
      <text class="node-index" x="1006" y="349">08</text>
      <text class="node-title" x="1006" y="374">Owner</text>
      <text class="node-detail" x="1006" y="396">停止 / 降级 / 修复</text>
    </g>
    <g class="node blocked">
      <rect x="636" y="526" width="260" height="92" rx="15"/>
      <text class="node-index" x="652" y="549">09</text>
      <text class="node-title" x="652" y="574">BLOCKED 安全终态</text>
      <text class="node-detail" x="652" y="596">不无限重试，不带病交接</text>
    </g>
  <rect class="callout" x="34" y="658" width="1132" height="48" rx="12"/>
  <text class="callout-title" x="52" y="678">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">增加重试次数不是可靠性修复；字段丢失、权限扩张和重复副作用都要有独立 Oracle。</text>
  <text class="footer" x="34" y="735">本图只证明编排合同可教学与 fixture 可重放，不证明真实多 Agent 平台已验证。</text>
</svg>
