<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 760" width="1200" height="760">
  <title id="title">D2 Handoff、上下文隔离与级联熔断</title>
  <desc id="desc">每次 Agent A → Agent B 的交接都必须传递事实、责任、权限与停止条件。 本图只证明编排合同可教学与 fixture 可重放，不证明真实多 Agent 平台已验证。</desc>
  
    <linearGradient id="ds-header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e3026"/>
      <stop offset="1" stop-color="#174a3a"/>
    </linearGradient>
  
  <defs>
    <filter id="ds-soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0e3026" flood-opacity="0.08"/>
    </filter>
    <filter id="ds-strong" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0e3026" flood-opacity="0.13"/>
    </filter>
    <marker id="ds-arw-forest" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#174a3a"/>
    </marker>
    <marker id="ds-arw-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a96a18"/>
    </marker>
    <marker id="ds-arw-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b2402f"/>
    </marker>
    <marker id="ds-arw-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#85908a"/>
    </marker>
  </defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0e3026" flood-opacity=".10"/></filter>
  <style>
    .bg{fill:#fbfaf6}.header{fill:url(#ds-header-grad)}.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;fill:#93bd2c}.title{font:800 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:white}.subtitle{font:450 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#d9e8e0}.source{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9db7ab}.node-index{font:800 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#85908a}.node-title{font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#1c2924}.node-detail{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#5f6c66}.edge path{fill:none;stroke:#174a3a;stroke-width:2}.edge text{font:600 9px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#5f6c66;paint-order:stroke;stroke:#fbfaf6;stroke-width:4px}.callout{fill:#fdf1d8;stroke:#e3c07b;stroke-width:1.5}.callout-title{font:800 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;fill:#a96a18}.callout-text{font:650 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#1c2924}.footer{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#5f6c66}
  </style>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <rect class="header" width="1200" height="92" rx="24"/><rect class="header" y="68" width="1200" height="24"/>
  <text class="eyebrow" x="34" y="30">D2 · ORCHESTRATION</text>
  <text class="title" x="34" y="62">D2 Handoff、上下文隔离与级联熔断</text>
  <text class="subtitle" x="1166" y="30" text-anchor="end">每次 Agent A → Agent B 的交接都必须传递事实、责任、权限与停止条件。</text>
  <text class="source" x="34" y="111">来源：S35 · S48 · S74</text>
  <g class="edge"><path d="M 222 175 C 242 175, 242 175, 254 175" marker-end="url(#ds-arw-forest)"/><text x="242" y="185">结构化交接</text></g>
<g class="edge"><path d="M 472 175 C 492 175, 492 175, 504 175" marker-end="url(#ds-arw-forest)"/><text x="492" y="167">最小上下文</text></g>
<g class="edge"><path d="M 722 175 C 742 175, 742 175, 754 175" marker-end="url(#ds-arw-forest)"/><text x="742" y="185">授权执行</text></g>
<g class="edge"><path d="M 950 175 C 970 175, 970 175, 982 175" marker-end="url(#ds-arw-forest)"/><text x="970" y="167">返回</text></g>
<g class="edge"><path d="M 1166 175 C 1218 270, -18 270, 26 175" marker-end="url(#ds-arw-forest)"/><text x="600" y="185">受控反馈</text></g>
<g class="edge"><path d="M 722 369 C 742 369, 742 175, 754 175" marker-end="url(#ds-arw-forest)"/><text x="742" y="264">注入异常</text></g>
<g class="edge"><path d="M 950 175 C 1002 464, 710 464, 754 369" marker-end="url(#ds-arw-forest)"/><text x="856" y="282">超时/循环</text></g>
<g class="edge"><path d="M 972 369 C 981 369, 981 369, 982 369" marker-end="url(#ds-arw-forest)"/><text x="981" y="361">告警与责任</text></g>
<g class="edge"><path d="M 972 369 C 1024 670, 584 670, 628 572" marker-end="url(#ds-arw-forest)"/><text x="804" y="480.5">预算耗尽</text></g>
<g class="edge"><path d="M 1166 369 C 1218 670, 584 670, 628 572" marker-end="url(#ds-arw-forest)"/><text x="901" y="462.5">决定停止</text></g>
  
    <g class="node a">
      <rect x="34" y="132" width="188" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="34" y="132" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="54" y="155">01</text>
      <text class="node-title" x="54" y="180">Agent A</text>
      <text class="node-detail" x="54" y="202">来源、事实、owner</text>
    </g>
    <g class="node handoff">
      <rect x="262" y="132" width="210" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="262" y="132" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="282" y="155">02</text>
      <text class="node-title" x="282" y="180">Handoff Schema</text>
      <text class="node-detail" x="282" y="202">必传字段 / 语义约束</text>
    </g>
    <g class="node isolate">
      <rect x="512" y="132" width="210" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="512" y="132" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="532" y="155">03</text>
      <text class="node-title" x="532" y="180">上下文隔离</text>
      <text class="node-detail" x="532" y="202">最小可见 / 秘密隔离</text>
    </g>
    <g class="node b">
      <rect x="762" y="132" width="188" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="762" y="132" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="782" y="155">04</text>
      <text class="node-title" x="782" y="180">Agent B</text>
      <text class="node-detail" x="782" y="202">受限任务 / 工具</text>
    </g>
    <g class="node result">
      <rect x="990" y="132" width="176" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="990" y="132" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="1010" y="155">05</text>
      <text class="node-title" x="1010" y="180">返回合同</text>
      <text class="node-detail" x="1010" y="202">结果 / Unknown / Error</text>
    </g>
    <g class="node fault">
      <rect x="512" y="326" width="210" height="86" rx="15" fill="#fbe9e5" stroke="#e3a89f" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="512" y="326" width="5" height="86" rx="2.5" fill="#e3a89f"/>
      <text class="node-index" x="532" y="349">06</text>
      <text class="node-title" x="532" y="374">故障注入</text>
      <text class="node-detail" x="532" y="396">超时 / 空结果 / 污染</text>
    </g>
    <g class="node breaker">
      <rect x="762" y="326" width="210" height="86" rx="15" fill="#fbe9e5" stroke="#e3a89f" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="762" y="326" width="5" height="86" rx="2.5" fill="#e3a89f"/>
      <text class="node-index" x="782" y="349">07</text>
      <text class="node-title" x="782" y="374">三重熔断</text>
      <text class="node-detail" x="782" y="396">步数 / 时间 / 成本</text>
    </g>
    <g class="node owner">
      <rect x="990" y="326" width="176" height="86" rx="15" fill="#fdf1d8" stroke="#e0b76a" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="990" y="326" width="5" height="86" rx="2.5" fill="#e0b76a"/>
      <text class="node-index" x="1010" y="349">08</text>
      <text class="node-title" x="1010" y="374">Owner</text>
      <text class="node-detail" x="1010" y="396">停止 / 降级 / 修复</text>
    </g>
    <g class="node blocked">
      <rect x="636" y="526" width="260" height="92" rx="15" fill="#fbe9e5" stroke="#e3a89f" stroke-width="2" filter="url(#shadow)"/>
      <rect x="636" y="526" width="5" height="92" rx="2.5" fill="#e3a89f"/>
      <text class="node-index" x="656" y="549">09</text>
      <text class="node-title" x="656" y="574">BLOCKED 安全终态</text>
      <text class="node-detail" x="656" y="596">不无限重试，不带病交接</text>
    </g>
  <rect class="callout" x="34" y="658" width="1132" height="48" rx="12"/>
  <text class="callout-title" x="52" y="679">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">增加重试次数不是可靠性修复；字段丢失、权限扩张和重复副作用都要有独立 Oracle。</text>
  <text class="footer" x="34" y="735">本图只证明编排合同可教学与 fixture 可重放，不证明真实多 Agent 平台已验证。</text>
</svg>
