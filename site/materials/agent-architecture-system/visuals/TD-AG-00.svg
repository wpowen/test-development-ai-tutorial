    <g class="node rings">
      <rect x="806" y="392" width="330" height="86" rx="15"/>
      <text class="node-index" x="822" y="415">10</text>
      <text class="node-title" x="822" y="440">四证据环</text>
      <text class="node-detail" x="822" y="462">离线 CI → 沙箱回放 → 影子 → 在线持续</text>
    </g>
    <g class="node guard">
      <rect x="34" y="530" width="330" height="92" rx="15"/>
      <text class="node-index" x="50" y="553">11</text>
      <text class="node-title" x="50" y="578">运行时护栏</text>
      <text class="node-detail" x="50" y="600">最小权限 · 预算 · 幂等 · Kill Switch</text>
    </g>
    <g class="node decision">
      <rect x="432" y="530" width="330" height="92" rx="15"/>
      <text class="node-index" x="448" y="553">12</text>
      <text class="node-title" x="448" y="578">决策与反馈</text>
      <text class="node-detail" x="448" y="600">BLOCKED / 证据不足 / 风险接受 / 回滚</text>
    </g>
    <g class="node feedback">
      <rect x="830" y="530" width="306" height="92" rx="15"/>
      <text class="node-index" x="846" y="553">13</text>
      <text class="node-title" x="846" y="578">生产反馈回流</text>
      <text class="node-detail" x="846" y="600">事故、漂移与新样例回到 D0–D7</text>
    </g>
  <rect class="callout" x="34" y="658" width="1132" height="48" rx="12"/>
  <text class="callout-title" x="52" y="678">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">高危 blocker 不得用总分抵消；任何一环未运行都必须保持 NOT_RUN。</text>
  <text class="footer" x="34" y="735">本图是测试边界与证据升级地图，不代表真实 Agent、企业集成或生产效果已验证。</text>
