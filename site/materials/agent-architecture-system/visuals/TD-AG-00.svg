  <text class="callout-title" x="52" y="679">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">高危 blocker 不得用总分抵消；任何一环未运行都必须保持 NOT_RUN。</text>
  <text class="footer" x="34" y="735">本图是测试边界与证据升级地图，不代表真实 Agent、企业集成或生产效果已验证。</text>
