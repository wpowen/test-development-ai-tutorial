      <text class="node-title" x="822" y="164">D2 编排协作</text>
      <text class="node-detail" x="822" y="186">Handoff / 隔离 / 熔断</text>
    </g>
    <g class="node d3">
      <rect x="298" y="254" width="210" height="86" rx="15"/>
      <text class="node-index" x="314" y="277">05</text>
      <text class="node-title" x="314" y="302">D3 人机协同</text>
      <text class="node-detail" x="314" y="324">中断 / 接管 / 确认疲劳</text>
    </g>
    <g class="node d4">
      <rect x="552" y="254" width="210" height="86" rx="15"/>
      <text class="node-index" x="568" y="277">06</text>
      <text class="node-title" x="568" y="302">D4 鲁棒可靠</text>
      <text class="node-detail" x="568" y="324">pass^k / Horizon / Recovery</text>
    </g>
    <g class="node d5">
      <rect x="806" y="254" width="210" height="86" rx="15"/>
      <text class="node-index" x="822" y="277">07</text>
      <text class="node-title" x="822" y="302">D5 安全对抗</text>
      <text class="node-detail" x="822" y="324">Injection / MCP / Sandbox</text>
    </g>
    <g class="node d6">
      <rect x="298" y="392" width="210" height="86" rx="15"/>
      <text class="node-index" x="314" y="415">08</text>
      <text class="node-title" x="314" y="440">D6 效率经济</text>
      <text class="node-detail" x="314" y="462">Latency / Goodput / Cost</text>
    </g>
    <g class="node d7">
      <rect x="552" y="392" width="210" height="86" rx="15"/>
      <text class="node-index" x="568" y="415">09</text>
      <text class="node-title" x="568" y="440">D7 业务治理</text>
