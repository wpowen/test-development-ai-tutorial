<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 760" width="1200" height="760">
  <title id="title">D0–D7 Agent 测试架构总览</title>
  <desc id="desc">先校准评估系统，再检查能力、协作、可靠性、安全、经济性与治理；最后按四证据环升级。 本图是测试边界与证据升级地图，不代表真实 Agent、企业集成或生产效果已验证。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#0b3b32"/><stop offset="1" stop-color="#176b5b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#176b5b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#12372f" flood-opacity=".12"/></filter>
  </defs>
  <style>
    .bg{fill:#f7faf8}.header{fill:url(#header)}.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;fill:#bfe9dc}.title{font:800 28px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:white}.subtitle{font:450 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#d7eee7}.source{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6c7c76}.node rect{fill:white;stroke:#b7d0c7;stroke-width:1.5;filter:url(#shadow)}.node:nth-of-type(3n+1) rect{fill:#eef8f4;stroke:#86b9a8}.node:nth-of-type(3n+2) rect{fill:#f6f8e9;stroke:#c4ce87}.node-index{font:700 10px ui-monospace,monospace;fill:#7c8b85}.node-title{font:800 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#123f34}.node-detail{font:500 11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#5a6b64}.edge path{fill:none;stroke:#176b5b;stroke-width:2}.edge text{font:600 9px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#557168;paint-order:stroke;stroke:#f7faf8;stroke-width:4px}.callout{fill:#fff3db;stroke:#e2b260;stroke-width:1.5}.callout-title{font:800 11px ui-monospace,monospace;fill:#8a5610}.callout-text{font:650 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#62430f}.footer{font:500 11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#62716b}
  </style>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <rect class="header" width="1200" height="92" rx="24"/><rect class="header" y="68" width="1200" height="24"/>
  <text class="eyebrow" x="34" y="29">AGENT TEST ARCHITECTURE · OVERVIEW</text>
  <text class="title" x="34" y="61">D0–D7 Agent 测试架构总览</text>
  <text class="subtitle" x="600" y="31">先校准评估系统，再检查能力、协作、可靠性、安全、经济性与治理；最后按四证据环升级。</text>
  <text class="source" x="34" y="111">来源：用户 Agent 架构材料（经审议）· S24 · S39 · S65</text>
  <g class="edge"><path d="M 254 159 C 276 159, 276 159, 290 159" marker-end="url(#arrow)"/><text x="276" y="169">先验证评估系统</text></g>
<g class="edge"><path d="M 508 159 C 530 159, 530 159, 544 159" marker-end="url(#arrow)"/><text x="530" y="151">可信 Oracle</text></g>
<g class="edge"><path d="M 762 159 C 784 159, 784 159, 798 159" marker-end="url(#arrow)"/><text x="784" y="169">能力进入协作</text></g>
<g class="edge"><path d="M 508 159 C 560 392, 246 392, 290 297" marker-end="url(#arrow)"/><text x="403" y="220">人审与升级</text></g>
<g class="edge"><path d="M 762 159 C 814 392, 500 392, 544 297" marker-end="url(#arrow)"/><text x="657" y="238">重复运行</text></g>
<g class="edge"><path d="M 1016 159 C 1068 392, 754 392, 798 297" marker-end="url(#arrow)"/><text x="911" y="220">跨边界攻击面</text></g>
<g class="edge"><path d="M 508 297 C 560 530, 246 530, 290 435" marker-end="url(#arrow)"/><text x="403" y="376">人工与时延成本</text></g>
<g class="edge"><path d="M 762 297 C 814 530, 500 530, 544 435" marker-end="url(#arrow)"/><text x="657" y="358">可靠性进入治理</text></g>
<g class="edge"><path d="M 1016 297 C 1068 530, 754 530, 798 435" marker-end="url(#arrow)"/><text x="911" y="376">安全硬门禁</text></g>
<g class="edge"><path d="M 508 435 C 657 435, 657 435, 798 435" marker-end="url(#arrow)"/><text x="657" y="427">预算门禁</text></g>
<g class="edge"><path d="M 762 435 C 784 435, 784 435, 798 435" marker-end="url(#arrow)"/><text x="784" y="445">责任与风险</text></g>
<g class="edge"><path d="M 364 576 C 398 576, 398 576, 424 576" marker-end="url(#arrow)"/><text x="398" y="568">运行时强制</text></g>
<g class="edge"><path d="M 1136 435 C 1188 674, 380 674, 424 576" marker-end="url(#arrow)"/><text x="784" y="515.5">逐环证据</text></g>
<g class="edge"><path d="M 762 576 C 796 576, 796 576, 822 576" marker-end="url(#arrow)"/><text x="796" y="568">发布/回滚</text></g>
<g class="edge"><path d="M 1136 576 C 1188 674, 246 674, 290 159" marker-end="url(#arrow)"/><text x="717" y="377.5">重新校准</text></g>
  
    <g class="node input">
      <rect x="34" y="116" width="220" height="86" rx="15"/>
      <text class="node-index" x="50" y="139">01</text>
      <text class="node-title" x="50" y="164">输入与风险</text>
      <text class="node-detail" x="50" y="186">任务、数据、权限、失败成本</text>
    </g>
    <g class="node d0">
      <rect x="298" y="116" width="210" height="86" rx="15"/>
      <text class="node-index" x="314" y="139">02</text>
      <text class="node-title" x="314" y="164">D0 评估可信</text>
      <text class="node-detail" x="314" y="186">Gold / Rubric / Judge Card</text>
    </g>
    <g class="node d1">
      <rect x="552" y="116" width="210" height="86" rx="15"/>
      <text class="node-index" x="568" y="139">03</text>
      <text class="node-title" x="568" y="164">D1 单体能力</text>
      <text class="node-detail" x="568" y="186">Intent / Tool / Span / Memory</text>
    </g>
    <g class="node d2">
      <rect x="806" y="116" width="210" height="86" rx="15"/>
