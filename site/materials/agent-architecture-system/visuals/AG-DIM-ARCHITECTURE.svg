<text x="64" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">边界 → 风险 → Observable → Method → 独立 Oracle → Case / Fault → Evidence → Decision</text>
<text x="64" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">能力边界：任务与工具能做什么　│　信任边界：什么输入与记忆不可信　│　副作用边界：什么动作不可逆</text>
<text x="64" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">每个 D0–D7 域都必须沿这条链留下证据；只有风险清单、没有 Oracle 和 failure action 的架构不可测试。</text>
<text x="64" y="431" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#a96a18">固定阈值进入 Metric Card（task / population / slice / uncertainty / owner / failure action），不得从来源直接复制</text>
