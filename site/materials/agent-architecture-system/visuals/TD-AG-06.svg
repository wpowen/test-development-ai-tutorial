<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 760" width="1200" height="760">
  <title id="title">D5 Agent 攻击面、策略沙箱与爆炸半径</title>
  <desc id="desc">攻击可以来自用户、检索、MCP 工具、记忆和委托链；强制控制必须位于模型之外。 本图与套件使用合成租户和无真实副作用数据；真实 MCP、密钥和生产权限均 NOT_RUN。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#0b3b32"/><stop offset="1" stop-color="#176b5b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#176b5b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#12372f" flood-opacity=".12"/></filter>
  </defs>
  <style>
    .bg{fill:#f7faf8}.header{fill:url(#header)}.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;fill:#bfe9dc}.title{font:800 28px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:white}.subtitle{font:450 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#d7eee7}.source{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6c7c76}.node rect{fill:white;stroke:#b7d0c7;stroke-width:1.5;filter:url(#shadow)}.node:nth-of-type(3n+1) rect{fill:#eef8f4;stroke:#86b9a8}.node:nth-of-type(3n+2) rect{fill:#f6f8e9;stroke:#c4ce87}.node-index{font:700 10px ui-monospace,monospace;fill:#7c8b85}.node-title{font:800 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#123f34}.node-detail{font:500 11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#5a6b64}.edge path{fill:none;stroke:#176b5b;stroke-width:2}.edge text{font:600 9px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#557168;paint-order:stroke;stroke:#f7faf8;stroke-width:4px}.callout{fill:#fff3db;stroke:#e2b260;stroke-width:1.5}.callout-title{font:800 11px ui-monospace,monospace;fill:#8a5610}.callout-text{font:650 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#62430f}.footer{font:500 11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#62716b}
  </style>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <rect class="header" width="1200" height="92" rx="24"/><rect class="header" y="68" width="1200" height="24"/>
  <text class="eyebrow" x="34" y="29">D5 · CONTINUOUS SECURITY</text>
  <text class="title" x="34" y="61">D5 Agent 攻击面、策略沙箱与爆炸半径</text>
  <text class="subtitle" x="600" y="31">攻击可以来自用户、检索、MCP 工具、记忆和委托链；强制控制必须位于模型之外。</text>
  <text class="source" x="34" y="111">来源：S07 · S08 · S50</text>
  <g class="edge"><path d="M 224 163 C 361 163, 361 368, 490 368" marker-end="url(#arrow)"/><text x="361" y="275.5">内容策略</text></g>
<g class="edge"><path d="M 456 163 C 477 163, 477 368, 490 368" marker-end="url(#arrow)"/><text x="477" y="257.5">签名与实际权限</text></g>
<g class="edge"><path d="M 688 163 C 740 466, 446 466, 490 368" marker-end="url(#arrow)"/><text x="593" y="275.5">写前验证</text></g>
<g class="edge"><path d="M 920 163 C 972 466, 446 466, 490 368" marker-end="url(#arrow)"/><text x="709" y="257.5">能力 token</text></g>
<g class="edge"><path d="M 708 368 C 733 368, 733 368, 750 368" marker-end="url(#arrow)"/><text x="733" y="378">允许的最小能力</text></g>
<g class="edge"><path d="M 968 368 C 990 368, 990 368, 1004 368" marker-end="url(#arrow)"/><text x="990" y="360">高危升级</text></g>
<g class="edge"><path d="M 708 368 C 760 670, 318 670, 362 572" marker-end="url(#arrow)"/><text x="539" y="480">越权 / 变更 / 超限</text></g>
<g class="edge"><path d="M 968 368 C 1020 670, 318 670, 362 572" marker-end="url(#arrow)"/><text x="669" y="462">异常副作用</text></g>
<g class="edge"><path d="M 630 572 C 821 572, 821 368, 1004 368" marker-end="url(#arrow)"/><text x="821" y="480">事故证据</text></g>
  
    <g class="node input">
      <rect x="34" y="120" width="190" height="86" rx="15"/>
      <text class="node-index" x="50" y="143">01</text>
      <text class="node-title" x="50" y="168">不可信输入</text>
      <text class="node-detail" x="50" y="190">直接 / 间接 / 延迟注入</text>
    </g>
    <g class="node mcp">
      <rect x="266" y="120" width="190" height="86" rx="15"/>
      <text class="node-index" x="282" y="143">02</text>
      <text class="node-title" x="282" y="168">MCP / Tool Manifest</text>
      <text class="node-detail" x="282" y="190">描述、版本、rug-pull</text>
    </g>
    <g class="node memory">
      <rect x="498" y="120" width="190" height="86" rx="15"/>
      <text class="node-index" x="514" y="143">03</text>
      <text class="node-title" x="514" y="168">记忆污染</text>
      <text class="node-detail" x="514" y="190">跨轮 / 跨会话</text>
    </g>
    <g class="node delegation">
      <rect x="730" y="120" width="190" height="86" rx="15"/>
      <text class="node-index" x="746" y="143">04</text>
      <text class="node-title" x="746" y="168">委托链</text>
      <text class="node-detail" x="746" y="190">用户 → Agent → 工具</text>
    </g>
    <g class="node sandbox">
      <rect x="498" y="322" width="210" height="92" rx="15"/>
      <text class="node-index" x="514" y="345">05</text>
      <text class="node-title" x="514" y="370">策略沙箱</text>
      <text class="node-detail" x="514" y="392">Tenant / Scope / Schema / 额度</text>
    </g>
    <g class="node action">
      <rect x="758" y="322" width="210" height="92" rx="15"/>
      <text class="node-index" x="774" y="345">06</text>
      <text class="node-title" x="774" y="370">不可逆动作</text>
      <text class="node-detail" x="774" y="392">写入 / 转账 / 删除 / 外发</text>
    </g>
    <g class="node owner">
      <rect x="1012" y="322" width="154" height="92" rx="15"/>
      <text class="node-index" x="1028" y="345">07</text>
      <text class="node-title" x="1028" y="370">安全 Owner</text>
      <text class="node-detail" x="1028" y="392">升级与处置</text>
    </g>
    <g class="node kill">
      <rect x="370" y="526" width="260" height="92" rx="15"/>
      <text class="node-index" x="386" y="549">08</text>
      <text class="node-title" x="386" y="574">Kill Switch / BLOCKED</text>
      <text class="node-detail" x="386" y="596">立即停止并保留 Trace</text>
    </g>
  <rect class="callout" x="34" y="658" width="1132" height="48" rx="12"/>
  <text class="callout-title" x="52" y="678">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">模型说“不”不是安全证明；0 次成功攻击也不等于真实风险为 0。</text>
  <text class="footer" x="34" y="735">本图与套件使用合成租户和无真实副作用数据；真实 MCP、密钥和生产权限均 NOT_RUN。</text>
</svg>
