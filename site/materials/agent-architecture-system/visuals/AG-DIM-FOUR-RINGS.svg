<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 820" width="1200" height="820">
<title id="title">四证据环：从离线 fixture 到在线持续评估</title>
<desc id="desc">四个独立证据环分别说明离线 fixture、受控沙箱、影子或灰度、在线持续评估的输入、entry、exit、硬阻断、owner 和 rollback。时间、比例和阈值全部参数化；当前课程只证明 fixture，后三环不代表已运行。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0f766e"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b91c1c"/></marker></defs>
<style>.bg{fill:#f7f8fb}.ring rect{stroke-width:2}.r1 rect{fill:#ecfdf5;stroke:#0f766e}.r2 rect{fill:#eef2ff;stroke:#4f46e5}.r3 rect{fill:#fff7ed;stroke:#c2410c}.r4 rect{fill:#fdf2f8;stroke:#be185d}.stop rect{fill:#fef2f2;stroke:#b91c1c}.h{font:700 15px system-ui,"PingFang SC",sans-serif;fill:#0f172a}.m{font:11.5px system-ui,"PingFang SC",sans-serif;fill:#334155}.tiny{font:10.5px system-ui,"PingFang SC",sans-serif;fill:#64748b}.badge{font:700 10.5px ui-monospace,monospace;fill:#b91c1c}.edge{fill:none;stroke:#0f766e;stroke-width:2;marker-end:url(#a)}.block{fill:none;stroke:#b91c1c;stroke-width:2;marker-end:url(#r)}</style>
<rect class="bg" width="1200" height="820"/><g data-source-ref="AI agent测试架构.txt:L496-L524"><text class="h" x="36" y="42" style="font-size:26px">四证据环：不同环境提供不同成熟度的证明</text><text class="m" x="36" y="70">每次升级都要新的输入、风险、统计、owner 和回滚；fixture 成功不能自动越级。</text></g>
<g class="ring r1"><rect x="36" y="116" width="250" height="430" rx="18"/></g><text class="h" x="58" y="150">环 1 · 离线 fixture</text><text class="m" x="58" y="184">输入：冻结 case / schema / mutation</text><text class="m" x="58" y="214">entry：版本与 Oracle 可追</text><text class="m" x="58" y="244">方法：确定性规则与红绿循环</text><text class="m" x="58" y="274">exit：预期退出码 + hash receipt</text><text class="badge" x="58" y="310">hard block：Oracle / lineage 缺失</text><text class="m" x="58" y="346">owner：课程 / 测试资产 owner</text><text class="m" x="58" y="376">rollback：撤销候选资产</text><rect x="58" y="414" width="206" height="92" rx="12" fill="#fff" stroke="#0f766e"/><text class="h" x="76" y="446">当前课程成熟度</text><text class="badge" x="76" y="476">PASS-FIXTURE only</text>
<g class="ring r2"><rect x="326" y="116" width="250" height="430" rx="18"/></g><text class="h" x="348" y="150">环 2 · 受控沙箱</text><text class="m" x="348" y="184">输入：真实接口的隔离副本</text><text class="m" x="348" y="214">entry：权限、复位、脱敏、预算</text><text class="m" x="348" y="244">方法：轨迹回放与故障注入</text><text class="m" x="348" y="274">exit：可重复集成结果与归因</text><text class="badge" x="348" y="310">hard block：副作用不可控</text><text class="m" x="348" y="346">owner：集成环境 owner</text><text class="m" x="348" y="376">rollback：恢复沙箱快照</text><rect x="348" y="414" width="206" height="92" rx="12" fill="#fff" stroke="#4f46e5"/><text class="h" x="366" y="446">当前状态</text><text class="badge" x="366" y="476">NOT_RUN</text>
<g class="ring r3"><rect x="616" y="116" width="250" height="430" rx="18"/></g><text class="h" x="638" y="150">环 3 · 影子 / 灰度</text><text class="m" x="638" y="184">输入：真实 workload，不生效动作</text><text class="m" x="638" y="214">entry：配对版本与流量策略</text><text class="m" x="638" y="244">方法：切片对比、人工抽检</text><text class="m" x="638" y="274">exit：统计区间与已知失败</text><text class="badge" x="638" y="310">hard block：真实动作未隔离</text><text class="m" x="638" y="346">owner：发布 / 业务 owner</text><text class="m" x="638" y="376">rollback：停止灰度并回旧版</text><rect x="638" y="414" width="206" height="92" rx="12" fill="#fff" stroke="#c2410c"/><text class="h" x="656" y="446">当前状态</text><text class="badge" x="656" y="476">NOT_RUN</text>
<g class="ring r4"><rect x="906" y="116" width="250" height="430" rx="18"/></g><text class="h" x="928" y="150">环 4 · 在线持续</text><text class="m" x="928" y="184">输入：线上 Trace 与高危事件</text><text class="m" x="928" y="214">entry：SLO / 采样 / 隐私 policy</text><text class="m" x="928" y="244">方法：漂移、回归、事故回灌</text><text class="m" x="928" y="274">exit：持续，不是一次性通过</text><text class="badge" x="928" y="310">hard block：护栏或审计失效</text><text class="m" x="928" y="346">owner：运行 / 风险 owner</text><text class="m" x="928" y="376">rollback：Kill Switch + 回滚</text><rect x="928" y="414" width="206" height="92" rx="12" fill="#fff" stroke="#be185d"/><text class="h" x="946" y="446">当前状态</text><text class="badge" x="946" y="476">NOT_RUN</text>
<path class="edge" d="M286 330 L320 330"/><path class="edge" d="M576 330 L610 330"/><path class="edge" d="M866 330 L900 330"/>
<g class="stop"><rect x="110" y="610" width="980" height="142" rx="16"/></g><text class="h" x="136" y="644">参数化门禁与失败回路</text><text class="m" x="136" y="674">每环的时长、样本量、流量比例和阈值必须来自 Metric Card parameter + population + uncertainty + owner。</text><text class="m" x="136" y="702">任一 exit 不满足：保持本环 FAIL / BLOCKED / EVIDENCE-INSUFFICIENT，不得升级；执行 rollback 并把失败样例回灌环 1。</text><text class="badge" x="136" y="730">本图明确移除来源中的固定分钟、天数和采样比例；它们只是来源示例，不是通用 policy。</text>
<path class="block" d="M980 546 C980 590 200 590 200 552"/>
<text class="tiny" x="36" y="794">证据边界：四环是测试与成熟度模型，不代表后三环已经接入真实系统；真实模型、集成、practitioner 与 production 均 NOT_RUN。</text></svg>
