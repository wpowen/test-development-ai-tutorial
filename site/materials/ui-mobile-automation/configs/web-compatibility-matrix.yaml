    channel: pinned-project-version
    viewport: 1440x900
    locale: zh-CN
    timezone: Asia/Shanghai
    required_checks: [semantic-locator, business-oracle, trace-on-first-retry]
  - browser: firefox
    channel: pinned-project-version
    viewport: 1440x900
    locale: zh-CN
    timezone: Asia/Shanghai
    required_checks: [semantic-locator, business-oracle]
  - browser: webkit
    channel: pinned-project-version
    viewport: 1440x900
    locale: zh-CN
    timezone: Asia/Shanghai
    required_checks: [semantic-locator, business-oracle]
environment_contract:
