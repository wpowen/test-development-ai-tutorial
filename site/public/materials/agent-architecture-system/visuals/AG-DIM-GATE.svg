<text x="573" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#174a3a">红线全部满足</text>
<text x="573" y="597" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#174a3a">PASS 或证据不足</text>
<text x="766" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#b2402f">任一破线</text>
<path d="M955 734 L955 830 L190 830 L190 339" fill="none" stroke="#b2402f" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ds-arw-red)"/>
<text x="572" y="818" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#b2402f">证据回灌与修复：阻断 / 回滚 → 重新提交证据包</text>
</g>

  <rect x="28" y="866" width="1184" height="46" rx="12" fill="#fdf1d8" stroke="#e3c07b" stroke-width="1.2"/>
  <text class="ds-footbadge" x="46" y="892">证据边界</text>
  <text class="ds-foot" x="46" y="914">阈值由 Metric Card 的 parameter + population + uncertainty + owner 配置；本图为教学结构图，不代表真实门禁已验证，结论 NOT_RUN。</text>
</svg>
