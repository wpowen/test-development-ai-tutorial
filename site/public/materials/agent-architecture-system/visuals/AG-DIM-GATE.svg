  <text class="ds-eyebrow" x="36" y="32">AGENT · 三段式门禁</text>
  <text class="ds-subtitle" x="1204" y="32" text-anchor="end">硬红线、统计证据与具名风险接受是三个不能互相抵消的阶段。</text>
  <text class="ds-title" x="36" y="74">三段式门禁决策流：红线 → 区间 → 署名接受</text>
  <text class="ds-source" x="36" y="140">source · AI agent测试架构.txt:L525-L574</text>
<g data-source-ref="AI agent测试架构.txt:L525-L574">
<g filter="url(#ds-soft)"><rect x="40" y="150" width="300" height="133" rx="14" fill="#f7f4e9" stroke="#85908a" stroke-width="1.5"/></g><rect x="40" y="150" width="6" height="133" rx="3" fill="#85908a"/><text x="64" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">候选版本证据包</text><text x="64" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">四维版本 lineage：模型 / prompt / 工具 / 记忆</text><text x="64" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">D0–D7 各域原始运行结果</text><text x="64" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">缺 lineage 的证据不进入门禁</text>
<g filter="url(#ds-soft)"><rect x="380" y="150" width="370" height="214" rx="14" fill="#fbe9e5" stroke="#b2402f" stroke-width="1.5"/></g><rect x="380" y="150" width="6" height="214" rx="3" fill="#b2402f"/><text x="404" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">第一段 · 硬红线（布尔，无例外）</text><text x="404" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">D5 高危攻击：符合已批准 policy</text><text x="404" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">D7-1 硬业务规则：不得违反</text><text x="404" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">D5-6 不可逆动作：不得绕过确认</text><text x="404" y="271" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">D0-1 judge：满足校准 Metric Card</text><text x="404" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">κ 不达标 ≠ 这一项失败</text><text x="404" y="311" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">κ 不达标 = 本轮所有分数无效</text><text x="404" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="500" fill="#85908a">「发生一次即不可接受」的事件不能统计化</text>
<g filter="url(#ds-soft)"><rect x="380" y="380" width="370" height="193" rx="14" fill="#fdf1d8" stroke="#a96a18" stroke-width="1.5"/></g><rect x="380" y="380" width="6" height="193" rx="3" fill="#a96a18"/><text x="404" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">第二段 · 统计门禁（看区间）</text><text x="404" y="438" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">pass^k 的 95% CI 下界 ≥ 阈值</text><text x="404" y="459" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">与上一版本：CI 不重叠才判定回归</text><text x="404" y="480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">聚类单位 = 任务，不是 n×k</text><text x="404" y="501" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">样本量不足 → EVIDENCE-INSUFFICIENT</text><text x="404" y="520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">它不是「通过」，是一个独立结论</text><text x="404" y="539" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="500" fill="#85908a">区间法容易解释；更严谨可用配对 / 聚类显著性检验</text>
<g filter="url(#ds-soft)"><rect x="380" y="580" width="370" height="193" rx="14" fill="#eaf1fa" stroke="#355f96" stroke-width="1.5"/></g><rect x="380" y="580" width="6" height="193" rx="3" fill="#355f96"/><text x="404" y="610" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">第三段 · 风险接受（署名决策）</text><text x="404" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">列出所有已知失败模式及其频率</text><text x="404" y="659" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">标注每个失败模式的护栏覆盖情况</text><text x="404" y="680" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">由具名业务 / 发布 owner 签字</text><text x="404" y="701" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">无护栏覆盖的失败模式不能被「接受」</text><text x="404" y="720" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">那不是接受风险，是不知道有风险</text><text x="404" y="739" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="500" fill="#85908a">Agent 系统不存在「没有失败模式」的版本</text>
<g filter="url(#ds-soft)"><rect x="790" y="580" width="330" height="154" rx="14" fill="#edf5f0" stroke="#174a3a" stroke-width="1.5"/></g><rect x="790" y="580" width="6" height="154" rx="3" fill="#174a3a"/><text x="814" y="610" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">输出：一份署名决定</text><text x="814" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">发布 / 有条件发布 / 不发布</text><text x="814" y="659" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">剩余风险清单 + 接受人 + 复评日期</text><text x="814" y="680" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">回滚触发条件与四维成组回滚对象</text><text x="814" y="701" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#174a3a">流水线只输出「请决定」</text>
<g filter="url(#ds-soft)"><rect x="790" y="150" width="330" height="133" rx="14" fill="#fbe9e5" stroke="#b2402f" stroke-width="1.5"/></g><rect x="790" y="150" width="6" height="133" rx="3" fill="#b2402f"/><text x="814" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">阻断（不进入第二段）</text><text x="814" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">没必要算区间——红线已破</text><text x="814" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">回到修复，重新提交证据包</text><text x="814" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">Waiver 不能豁免硬红线</text>
<g filter="url(#ds-soft)"><rect x="790" y="300" width="330" height="154" rx="14" fill="#fdf1d8" stroke="#a96a18" stroke-width="1.5"/></g><rect x="790" y="300" width="6" height="154" rx="3" fill="#a96a18"/><text x="814" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">FAIL 或证据不足</text><text x="814" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">FAIL → 阻断，回到修复</text><text x="814" y="379" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">EVIDENCE-INSUFFICIENT → 可进第三段</text><text x="814" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">但必须作为已知失败模式列出</text><text x="814" y="421" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">不得写成「通过」</text>
