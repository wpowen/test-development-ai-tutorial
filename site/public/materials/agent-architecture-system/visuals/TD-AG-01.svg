<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 760" width="1200" height="760">
  <title id="title">D0 Judge 校准与停用闭环</title>
  <desc id="desc">评估器也是被测系统：先建立金标和人工分歧，再决定 Judge 能自动评什么。 Fixture 只验证合同和故障检测；真实模型 Judge、标注员和业务金标仍需独立运行。</desc>
  
    <linearGradient id="ds-header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e3026"/>
      <stop offset="1" stop-color="#174a3a"/>
    </linearGradient>
  
  <defs>
    <filter id="ds-soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0e3026" flood-opacity="0.08"/>
    </filter>
    <filter id="ds-strong" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0e3026" flood-opacity="0.13"/>
    </filter>
    <marker id="ds-arw-forest" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#174a3a"/>
    </marker>
    <marker id="ds-arw-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a96a18"/>
    </marker>
    <marker id="ds-arw-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b2402f"/>
    </marker>
    <marker id="ds-arw-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#85908a"/>
    </marker>
  </defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0e3026" flood-opacity=".10"/></filter>
  <style>
    .bg{fill:#fbfaf6}.header{fill:url(#ds-header-grad)}.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;fill:#93bd2c}.title{font:800 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:white}.subtitle{font:450 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#d9e8e0}.source{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9db7ab}.node-index{font:800 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#85908a}.node-title{font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#1c2924}.node-detail{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#5f6c66}.edge path{fill:none;stroke:#174a3a;stroke-width:2}.edge text{font:600 9px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#5f6c66;paint-order:stroke;stroke:#fbfaf6;stroke-width:4px}.callout{fill:#fdf1d8;stroke:#e3c07b;stroke-width:1.5}.callout-title{font:800 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;fill:#a96a18}.callout-text{font:650 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#1c2924}.footer{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#5f6c66}
  </style>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <rect class="header" width="1200" height="92" rx="24"/><rect class="header" y="68" width="1200" height="24"/>
  <text class="eyebrow" x="34" y="30">D0 · EVALUATOR TRUST</text>
  <text class="title" x="34" y="62">D0 Judge 校准与停用闭环</text>
  <text class="subtitle" x="1166" y="30" text-anchor="end">评估器也是被测系统：先建立金标和人工分歧，再决定 Judge 能自动评什么。</text>
  <text class="source" x="34" y="111">来源：S05 · S23 · S40</text>
  <g class="edge"><path d="M 234 174 C 258 174, 258 174, 274 174" marker-end="url(#ds-arw-forest)"/><text x="258" y="184">独立标注</text></g>
<g class="edge"><path d="M 482 174 C 506 174, 506 174, 522 174" marker-end="url(#ds-arw-forest)"/><text x="506" y="166">争议塑造规则</text></g>
<g class="edge"><path d="M 730 174 C 754 174, 754 174, 770 174" marker-end="url(#ds-arw-forest)"/><text x="754" y="184">版本化执行</text></g>
<g class="edge"><path d="M 978 174 C 1030 466, 230 466, 274 370" marker-end="url(#ds-arw-forest)"/><text x="630" y="264">反偏差测试</text></g>
<g class="edge"><path d="M 482 370 C 506 370, 506 370, 522 370" marker-end="url(#ds-arw-forest)"/><text x="506" y="380">保留不一致</text></g>
<g class="edge"><path d="M 730 370 C 754 370, 754 370, 770 370" marker-end="url(#ds-arw-forest)"/><text x="754" y="362">按风险分流</text></g>
<g class="edge"><path d="M 730 370 C 782 670, 478 670, 522 572" marker-end="url(#ds-arw-forest)"/><text x="630" y="481">超出适用域</text></g>
<g class="edge"><path d="M 778 572 C 830 670, 478 670, 522 174" marker-end="url(#ds-arw-forest)"/><text x="654" y="365">修订后重跑</text></g>
<g class="edge"><path d="M 778 572 C 778 572, 778 174, 770 174" marker-end="url(#ds-arw-forest)"/><text x="778" y="383">换版桥接</text></g>
  
    <g class="node gold">
      <rect x="34" y="130" width="200" height="88" rx="15" fill="#f0ecfb" stroke="#c9b8ea" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="34" y="130" width="5" height="88" rx="2.5" fill="#c9b8ea"/>
      <text class="node-index" x="54" y="153">01</text>
      <text class="node-title" x="54" y="178">金标样本</text>
      <text class="node-detail" x="54" y="200">版本、切片、来源</text>
    </g>
    <g class="node human">
      <rect x="282" y="130" width="200" height="88" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="282" y="130" width="5" height="88" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="302" y="153">02</text>
      <text class="node-title" x="302" y="178">人工标注</text>
      <text class="node-detail" x="302" y="200">盲法双标 / 仲裁</text>
    </g>
    <g class="node rubric">
      <rect x="530" y="130" width="200" height="88" rx="15" fill="#f0ecfb" stroke="#c9b8ea" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="530" y="130" width="5" height="88" rx="2.5" fill="#c9b8ea"/>
      <text class="node-index" x="550" y="153">03</text>
      <text class="node-title" x="550" y="178">Rubric</text>
      <text class="node-detail" x="550" y="200">构念、尺度、拒判</text>
    </g>
    <g class="node judge">
      <rect x="778" y="130" width="200" height="88" rx="15" fill="#f0ecfb" stroke="#c9b8ea" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="778" y="130" width="5" height="88" rx="2.5" fill="#c9b8ea"/>
      <text class="node-index" x="798" y="153">04</text>
      <text class="node-title" x="798" y="178">Judge</text>
      <text class="node-detail" x="798" y="200">版本、Prompt、输出</text>
    </g>
    <g class="node probe">
      <rect x="282" y="326" width="200" height="88" rx="15" fill="#f0ecfb" stroke="#c9b8ea" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="282" y="326" width="5" height="88" rx="2.5" fill="#c9b8ea"/>
      <text class="node-index" x="302" y="349">05</text>
      <text class="node-title" x="302" y="374">偏差探针</text>
      <text class="node-detail" x="302" y="396">顺序 / 长度 / 自偏好</text>
    </g>
    <g class="node disagree">
      <rect x="530" y="326" width="200" height="88" rx="15" fill="#f0ecfb" stroke="#c9b8ea" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="530" y="326" width="5" height="88" rx="2.5" fill="#c9b8ea"/>
      <text class="node-index" x="550" y="349">06</text>
      <text class="node-title" x="550" y="374">分歧矩阵</text>
      <text class="node-detail" x="550" y="396">人人 / 人机 / Slice</text>
    </g>
    <g class="node route">
      <rect x="778" y="326" width="200" height="88" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="778" y="326" width="5" height="88" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="798" y="349">07</text>
      <text class="node-title" x="798" y="374">自动 / 抽检 / 人审</text>
      <text class="node-detail" x="798" y="396">按风险选择路径</text>
    </g>
    <g class="node stop">
      <rect x="530" y="526" width="248" height="92" rx="15" fill="#fbe9e5" stroke="#e3a89f" stroke-width="2" filter="url(#shadow)"/>
      <rect x="530" y="526" width="5" height="92" rx="2.5" fill="#e3a89f"/>
      <text class="node-index" x="550" y="549">08</text>
      <text class="node-title" x="550" y="574">停用与重校准</text>
      <text class="node-detail" x="550" y="596">FAIL → 修 Rubric / 换 Judge</text>
    </g>
  <rect class="callout" x="34" y="658" width="1132" height="48" rx="12"/>
  <text class="callout-title" x="52" y="679">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">Judge 不得审批自己的 Oracle；分歧样本不能被删除来制造一致。</text>
  <text class="footer" x="34" y="735">Fixture 只验证合同和故障检测；真实模型 Judge、标注员和业务金标仍需独立运行。</text>
</svg>
