      <text class="node-title" x="54" y="176">业务规则</text>
      <text class="node-detail" x="54" y="198">硬规则 / 失败成本 / Owner</text>
    </g>
    <g class="node version">
      <rect x="266" y="128" width="210" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="266" y="128" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="286" y="151">02</text>
      <text class="node-title" x="286" y="176">四维版本</text>
      <text class="node-detail" x="286" y="198">Model / Prompt / Tools / Memory</text>
    </g>
    <g class="node delegate">
      <rect x="516" y="128" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="516" y="128" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="536" y="151">03</text>
      <text class="node-title" x="536" y="176">用户委托</text>
      <text class="node-detail" x="536" y="198">身份 / Scope / Expiry</text>
    </g>
    <g class="node action">
      <rect x="746" y="128" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="746" y="128" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="766" y="151">04</text>
      <text class="node-title" x="766" y="176">工具动作</text>
      <text class="node-detail" x="766" y="198">输入 / 输出 / 副作用</text>
    </g>
    <g class="node audit">
      <rect x="516" y="326" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="516" y="326" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
