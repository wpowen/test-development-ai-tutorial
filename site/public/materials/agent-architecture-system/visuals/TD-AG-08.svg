  <rect class="callout" x="34" y="658" width="1132" height="48" rx="12"/>
  <text class="callout-title" x="52" y="679">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">平均质量分不能抵消业务硬规则；AI 不得批准 waiver 或签署风险接受。</text>
  <text class="footer" x="34" y="735">Fixture 只验证 lineage 与门禁字段；真实组织责任、ROI 和审批仍为 Unknown/NOT_RUN。</text>
