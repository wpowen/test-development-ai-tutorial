      <text class="node-title" x="536" y="374">审计证据</text>
      <text class="node-detail" x="536" y="396">人、Agent、依据、时间</text>
    </g>
    <g class="node accept">
      <rect x="746" y="326" width="210" height="86" rx="15" fill="#fdf1d8" stroke="#e0b76a" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="746" y="326" width="5" height="86" rx="2.5" fill="#e0b76a"/>
