<g class="edge"><path d="M 956 369 C 976 369, 976 369, 988 369" marker-end="url(#ds-arw-forest)"/><text x="976" y="361">拒绝或回退</text></g>
<g class="edge"><path d="M 224 171 C 245 171, 245 572, 258 572" marker-end="url(#ds-arw-forest)"/><text x="245" y="381.5">规则冲突</text></g>
<g class="edge"><path d="M 706 369 C 758 670, 214 670, 258 572" marker-end="url(#ds-arw-forest)"/><text x="486" y="462.5">证据缺失</text></g>
<g class="edge"><path d="M 526 572 C 761 572, 761 369, 988 369" marker-end="url(#ds-arw-forest)"/><text x="761" y="480.5">安全终态</text></g>
  
    <g class="node rule">
      <rect x="34" y="128" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
