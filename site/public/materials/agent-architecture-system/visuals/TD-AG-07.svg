    <g class="node budget">
      <rect x="498" y="526" width="260" height="92" rx="15" fill="#fdf1d8" stroke="#e0b76a" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="498" y="526" width="5" height="92" rx="2.5" fill="#e0b76a"/>
      <text class="node-index" x="518" y="549">08</text>
      <text class="node-title" x="518" y="574">预算门禁 / 停止</text>
      <text class="node-detail" x="518" y="596">Token / 时间 / 步数 / 金钱</text>
    </g>
  <rect class="callout" x="34" y="658" width="1132" height="48" rx="12"/>
  <text class="callout-title" x="52" y="679">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">增加预算或重试不能当作默认修复；必须联合看质量、尾延迟、成本与副作用。</text>
  <text class="footer" x="34" y="735">图中的数值字段需绑定 workload、价格时间和版本；不提供通用 P95/P99 门槛。</text>
