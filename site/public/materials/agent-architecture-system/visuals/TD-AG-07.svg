      <text class="node-title" x="634" y="374">延迟尾部</text>
      <text class="node-detail" x="634" y="396">P95 / P99 / Timeout</text>
    </g>
    <g class="node cost">
      <rect x="846" y="326" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="846" y="326" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="866" y="349">07</text>
      <text class="node-title" x="866" y="374">成本尾部</text>
      <text class="node-detail" x="866" y="396">模型 / 工具 / Judge / 人审</text>
