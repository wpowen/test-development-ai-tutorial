<g class="edge"><path d="M 456 177 C 535 177, 535 369, 606 369" marker-end="url(#ds-arw-forest)"/><text x="535" y="283">排队贡献</text></g>
<g class="edge"><path d="M 920 177 C 972 464, 562 464, 606 369" marker-end="url(#ds-arw-forest)"/><text x="767" y="265">工具贡献</text></g>
<g class="edge"><path d="M 688 177 C 767 177, 767 369, 838 369" marker-end="url(#ds-arw-forest)"/><text x="767" y="283">Token 成本</text></g>
<g class="edge"><path d="M 920 177 C 972 464, 794 464, 838 369" marker-end="url(#ds-arw-forest)"/><text x="883" y="265">重试成本</text></g>
<g class="edge"><path d="M 572 369 C 624 670, 446 670, 490 572" marker-end="url(#ds-arw-forest)"/><text x="535" y="480.5">联合决定</text></g>
<g class="edge"><path d="M 804 369 C 856 670, 446 670, 490 572" marker-end="url(#ds-arw-forest)"/><text x="651" y="462.5">超限</text></g>
<g class="edge"><path d="M 1036 369 C 1088 670, 446 670, 490 572" marker-end="url(#ds-arw-forest)"/><text x="767" y="480.5">超预算</text></g>
  
    <g class="node workload">
      <rect x="34" y="134" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="34" y="134" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="54" y="157">01</text>
      <text class="node-title" x="54" y="182">Workload</text>
      <text class="node-detail" x="54" y="204">任务类型 / 风险 / 到达率</text>
    </g>
    <g class="node queue">
      <rect x="266" y="134" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="266" y="134" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="286" y="157">02</text>
      <text class="node-title" x="286" y="182">Queue</text>
      <text class="node-detail" x="286" y="204">等待 / 并发 / 隔离</text>
    </g>
    <g class="node llm">
      <rect x="498" y="134" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="498" y="134" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="518" y="157">03</text>
      <text class="node-title" x="518" y="182">LLM Step</text>
      <text class="node-detail" x="518" y="204">TTFT / TPOT / Token</text>
    </g>
    <g class="node tool">
      <rect x="730" y="134" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="730" y="134" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
