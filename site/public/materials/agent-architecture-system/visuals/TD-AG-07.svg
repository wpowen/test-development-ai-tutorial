      <text class="node-title" x="750" y="182">Tool Attempt</text>
      <text class="node-detail" x="750" y="204">延迟 / Retry / Error</text>
    </g>
    <g class="node quality">
      <rect x="382" y="326" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="382" y="326" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="402" y="349">05</text>
      <text class="node-title" x="402" y="374">Quality / Goodput</text>
      <text class="node-detail" x="402" y="396">满足质量与时限</text>
    </g>
    <g class="node latency">
      <rect x="614" y="326" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="614" y="326" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
