      <text class="node-title" x="554" y="174">影子 / 灰度</text>
      <text class="node-detail" x="554" y="196">真实流量但不生效</text>
    </g>
    <g class="node online">
      <rect x="784" y="126" width="210" height="92" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="784" y="126" width="5" height="92" rx="2.5" fill="#c2d9cc"/>
