      <text class="node-title" x="804" y="174">在线持续</text>
      <text class="node-detail" x="804" y="196">采样 / 高危全量 / 漂移</text>
    </g>
    <g class="node hard">
      <rect x="284" y="338" width="210" height="92" rx="15" fill="#fdf1d8" stroke="#e0b76a" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="284" y="338" width="5" height="92" rx="2.5" fill="#e0b76a"/>
