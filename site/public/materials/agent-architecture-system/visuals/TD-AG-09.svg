      <rect x="484" y="548" width="5" height="92" rx="2.5" fill="#e3a89f"/>
      <text class="node-index" x="504" y="571">08</text>
      <text class="node-title" x="504" y="596">BLOCKED / NOT_RUN</text>
      <text class="node-detail" x="504" y="618">缺一环证据不得升级</text>
