  <rect class="header" width="1200" height="92" rx="24"/><rect class="header" y="68" width="1200" height="24"/>
  <text class="eyebrow" x="34" y="30">FOUR EVIDENCE RINGS</text>
  <text class="title" x="34" y="62">四证据环与三段式质量门禁</text>
  <text class="subtitle" x="1166" y="30" text-anchor="end">证据从离线 CI 升级到沙箱、影子和在线；每一环都需要新的输入、责任和回滚。</text>
  <text class="source" x="34" y="111">来源：S07 · S24 · S65</text>
