  <rect class="callout" x="34" y="658" width="1132" height="48" rx="12"/>
  <text class="callout-title" x="52" y="679">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">离线 0/1/0 不能写成线上 PASS；不得用总分抵消安全 blocker。</text>
  <text class="footer" x="34" y="735">当前课程只运行离线/沙箱式 fixture；影子与在线环保持 NOT_RUN。</text>
