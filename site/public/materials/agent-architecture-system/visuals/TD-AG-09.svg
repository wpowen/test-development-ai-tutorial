    <g class="node ci">
      <rect x="34" y="126" width="210" height="92" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="34" y="126" width="5" height="92" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="54" y="149">01</text>
      <text class="node-title" x="54" y="174">离线 CI</text>
      <text class="node-detail" x="54" y="196">确定性规则 / 小型 Eval</text>
    </g>
    <g class="node sandbox">
      <rect x="284" y="126" width="210" height="92" rx="15" fill="#fdf1d8" stroke="#e0b76a" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="284" y="126" width="5" height="92" rx="2.5" fill="#e0b76a"/>
      <text class="node-index" x="304" y="149">02</text>
      <text class="node-title" x="304" y="174">沙箱回放</text>
      <text class="node-detail" x="304" y="196">轨迹 / 故障注入 / 无副作用</text>
    </g>
    <g class="node shadow">
      <rect x="534" y="126" width="210" height="92" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="534" y="126" width="5" height="92" rx="2.5" fill="#c2d9cc"/>
