<title id="title">能力主张到复评的证据生命周期</title>
<desc id="desc">六步环形生命周期，从能力主张开始，经证据引用、故障或变异、独立评审、工作应用、反馈复评，最后回到下一轮能力主张。 SOURCE-EXAMPLE · 组织职级/年限/权重均为 INTERNAL-UNKNOWN · 本图不证明晋升、就业或真实学习效果</desc>
