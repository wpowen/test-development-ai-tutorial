<text x="500" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#174a3a" text-anchor="start">任务重要性 ↑</text>
<text x="930" y="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#174a3a" text-anchor="start">证据成熟度 →</text>
<g filter="url(#ds-strong)"><rect x="140" y="202" width="400" height="160" rx="14" fill="#fbe9e5" stroke="#e3a89f" stroke-width="1.5"/></g>
<text x="168" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924" text-anchor="start">优先补齐</text>
<text x="168" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#b2402f" text-anchor="start">高重要 · 低证据</text>
<text x="168" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#5f6c66" text-anchor="start">下一步：固定输入 + 故障实验</text>
<text x="168" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" fill="#b2402f" text-anchor="start">owner 确认当前任务优先级</text>
<g filter="url(#ds-strong)"><rect x="660" y="202" width="400" height="160" rx="14" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.5"/></g>
<text x="688" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924" text-anchor="start">保持优势</text>
<text x="688" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#174a3a" text-anchor="start">高重要 · 高证据</text>
<text x="688" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#5f6c66" text-anchor="start">下一步：生产使用与漂移复评</text>
<text x="688" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" fill="#174a3a" text-anchor="start">持续验证，不视为终身结论</text>
<g filter="url(#ds-soft)"><rect x="140" y="442" width="400" height="160" rx="14" fill="#f7f4e9" stroke="#e8dfc5" stroke-width="1.5"/></g>
<text x="168" y="478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924" text-anchor="start">暂缓</text>
<text x="168" y="506" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#5f6c66" text-anchor="start">低重要 · 低证据</text>
<text x="168" y="534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#5f6c66" text-anchor="start">记录触发条件，不制造学习焦虑</text>
<text x="168" y="566" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" fill="#5f6c66" text-anchor="start">时机或任务变化后再评估</text>
<g filter="url(#ds-soft)"><rect x="660" y="442" width="400" height="160" rx="14" fill="#eaf1fa" stroke="#355f96" stroke-width="1.5"/></g>
<text x="688" y="478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924" text-anchor="start">分享与复用</text>
<text x="688" y="506" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#355f96" text-anchor="start">低重要 · 高证据</text>
<text x="688" y="534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#5f6c66" text-anchor="start">模板化、带教或转移维护权</text>
<text x="688" y="566" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" fill="#355f96" text-anchor="start">释放精力，聚焦高优先级</text></g>
<text x="40" y="764" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11px" font-weight="500" fill="#5f6c66">重要性由当前任务 owner 定义，成熟度由证据而非自信定义；象限只决定下一步，不证明职级。</text>

