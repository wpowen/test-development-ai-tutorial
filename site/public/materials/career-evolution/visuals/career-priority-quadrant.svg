  <text class="ds-eyebrow" x="36" y="32">CAREER · 优先级四象限</text>
  <text class="ds-subtitle" x="1204" y="32" text-anchor="end">用任务重要性和当前证据成熟度排序学习投资，并明确每个象限对应的行动而非贴标签。</text>
  <text class="ds-title" x="36" y="74">能力投资优先级四象限</text>
