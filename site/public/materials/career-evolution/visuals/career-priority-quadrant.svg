<title id="title">能力投资优先级四象限</title>
<desc id="desc">二维四象限以任务重要性为纵轴、证据成熟度为横轴，四格分别是优先补齐、保持优势、暂缓、分享与复用。 SOURCE-EXAMPLE · 组织职级 / 年限 / 权重均为 INTERNAL-UNKNOWN · 本图不证明晋升、就业或真实学习效果</desc>

