<rect class="secondary" x="320" y="400" width="230" height="195"/><text class="h" x="342" y="435">2 独立范围负责</text><text class="m" x="342" y="463">工件 · 风险 · Oracle · 交接</text><text class="tiny" x="342" y="490">失败代价可控且可归因</text>
