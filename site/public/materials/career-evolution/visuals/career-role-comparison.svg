<title id="title">传统软件测试、AI 测试与 AI 开发的责任边界</title>
<desc id="desc">三列职责对比图：传统软件测试聚焦确定性行为与系统风险，AI 测试开发增加数据、模型、评测与 Agent 风险，AI 开发负责能力实现；三者共享工程底座，最终发布决定仍由具名责任人作出。 SOURCE-EXAMPLE · 组织职级 / 年限 / 权重均为 INTERNAL-UNKNOWN · 本图不证明晋升、就业或真实学习效果</desc>

