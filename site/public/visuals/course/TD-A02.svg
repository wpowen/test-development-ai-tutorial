  <text x="72" y="132" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="600" fill="#d9e9df">怎样证明streaming、structuredoutput、toolcall和asyncjob的过程与终态都合法，并且取消或重试不会重复副作用？任一</text>
