<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title id="title">AI API 协议：Streaming、Structured、Tool 与 Async｜专业关系图</title>
  <desc id="desc">怎样证明 streaming、structured output、tool call 和 async job 的过程与终态都合法，并且取消或重试不会重复副作用？ 任一关键证据缺失时保持 UNKNOWN/BLOCKED。 图中区分数据流、控制流、证据流与反馈回路，并显示失败路径、系统边界和责任门禁。</desc>
