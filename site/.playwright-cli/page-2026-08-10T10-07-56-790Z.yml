      - generic [ref=e348]:
        - generic [ref=e349]: "01"
        - generic [ref=e350]:
          - heading "先把真实问题说清楚" [level=2] [ref=e351]
          - paragraph [ref=e352]: 目标是一个退款知识助手：既有 RAG 回答，又有查询订单和转人工工具。候选版本可能引用过期政策、越权退款、在并发下变慢，或因 Judge 漂移假绿。
          - paragraph [ref=e353]: 这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 AI Quality Engineering Capstone 仓库与评审包 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。
      - generic [ref=e354]:
        - generic [ref=e355]: "02"
        - generic [ref=e356]:
          - heading "按证据顺序完成工作流" [level=2] [ref=e357]
          - paragraph [ref=e358]: 先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。
          - paragraph [ref=e359]: 工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。
          - list [ref=e360]:
            - listitem [ref=e361]: 从 PRD、架构、数据和历史事故建立风险与追踪矩阵
            - listitem [ref=e362]: 实现 API/契约/性能基线及 LLM、RAG、Agent 分层评测
            - listitem [ref=e363]: 接入版本 manifest、CI、Trace 回归、攻击集和 rollback runbook
            - listitem [ref=e364]: 执行 baseline→故障注入→修复，并由人工按证据清单评审
      - generic [ref=e365]:
        - generic [ref=e366]: "03"
        - generic [ref=e367]:
          - heading "在最小业务场景里亲手做一次" [level=2] [ref=e368]
          - paragraph [ref=e369]: 仓库至少包含 12 条 eval、3 个高风险 blocker、1 个间接注入、1 个工具越权、1 个性能退化和 1 个生产 Trace 脱敏 fixture。先跑通过，再注入两类故障，最后修复并保留三阶段报告。
          - paragraph [ref=e370]: 操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。
          - generic [ref=e371]:
            - button "复制" [ref=e372] [cursor=pointer]
            - generic [ref=e373]: "# TD-T25 最小执行记录 input_version: v1 system_version: candidate-a risk_slice: high expected_gate: FAIL_ON_SEEDED_REGRESSION evidence: artifact/td-t25-report.json"
          - generic [ref=e374]:
            - text: 你应该看到 / 得出
            - paragraph [ref=e375]: 一条命令可复现 baseline、mutation 和 repair；坏版本退出非零并定位到风险、样例和组件；发布报告列明门禁、waiver、回滚、证据边界与未验证事项。
      - generic [ref=e376]:
        - generic [ref=e377]: "04"
        - generic [ref=e378]:
          - heading "诊断失败，而不是把阈值调到通过" [level=2] [ref=e379]
          - paragraph [ref=e380]: 只提交课程文档、模型聊天截图或最终绿色报告不算完成。缺少坏版本证据、版本 lineage、真实 Oracle 或人工责任时，Capstone 必须判为未通过。
          - paragraph [ref=e381]: 定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。
          - generic [ref=e382]:
            - text: 别踩这个坑
            - paragraph [ref=e383]: 降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。
      - generic [ref=e384]:
        - generic [ref=e385]: "05"
        - generic [ref=e386]:
          - heading "迁移到你的项目" [level=2] [ref=e387]
          - paragraph [ref=e388]: 先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 AI Quality Engineering Capstone 仓库与评审包 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。
          - paragraph [ref=e389]: 迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。
          - list [ref=e390]:
            - listitem [ref=e391]: 替换为脱敏的真实输入和当前版本
            - listitem [ref=e392]: 补充历史事故与高风险切片
