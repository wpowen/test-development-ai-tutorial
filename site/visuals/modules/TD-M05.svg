<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title id="title">建设 AI 质量系统｜专业关系图</title>
  <desc id="desc">离线 Eval、CI、Canary、生产 Trace、回归集与回滚如何形成持续质量闭环？ 图中区分数据流、控制流、证据流与反馈回路，并显示失败路径、系统边界和责任门禁。</desc>
