<text x="294" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#5f6c66" text-anchor="start">default example：30 / 60 / 90；actual：由 owner 按工件复杂度、机会和风险配置</text>
