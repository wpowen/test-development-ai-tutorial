<text x="40" y="764" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11px" font-weight="500" fill="#5f6c66">30/60/90 是规划示例，不是晋升期限；每一段必须以可审计工件和 reviewer 决定是否进入下一段。</text>

