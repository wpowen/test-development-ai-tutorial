<title id="title">可参数化的 30/60/90 证据计划</title>
<desc id="desc">三段甘特式计划以窗口 A、B、C 表示基线、故障实验和交付复评，默认可示例为 30/60/90 天，但实际时长由 owner 参数化。 SOURCE-EXAMPLE · 组织职级 / 年限 / 权重均为 INTERNAL-UNKNOWN · 本图不证明晋升、就业或真实学习效果</desc>

