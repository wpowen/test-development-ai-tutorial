<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 820" width="1200" height="820">
<title id="title">AI Agent 测试总架构：边界、D0–D7、证据与反馈</title>
<desc id="desc">从输入与风险进入架构边界，D0 先校准评估系统，D1 到 D7 分别检查能力、编排、人机协同、可靠性、安全、效率和治理；四证据环承载执行，运行时护栏强制停止，决定与反馈回到测试资产。本图不代表真实 Agent、企业集成或生产效果已验证。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0f766e"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b91c1c"/></marker></defs>
<style>.bg{fill:#f7f8fb}.node rect{stroke-width:1.7}.io rect{fill:#f1f5f9;stroke:#475569}.trust rect{fill:#ede9fe;stroke:#6d28d9}.domain rect{fill:#ecfdf5;stroke:#0f766e}.risk rect{fill:#fff7ed;stroke:#c2410c}.guard rect{fill:#fef2f2;stroke:#b91c1c}.h{font:700 14px system-ui,"PingFang SC",sans-serif;fill:#0f172a}.m{font:11.5px system-ui,"PingFang SC",sans-serif;fill:#334155}.tiny{font:10.5px system-ui,"PingFang SC",sans-serif;fill:#64748b}.badge{font:700 10.5px ui-monospace,monospace;fill:#b91c1c}.edge{fill:none;stroke:#0f766e;stroke-width:1.8;marker-end:url(#a)}.stop{fill:none;stroke:#b91c1c;stroke-width:2;marker-end:url(#r)}.dash{stroke-dasharray:6 4}</style>
<rect class="bg" width="1200" height="820"/><g data-source-ref="AI agent测试架构.txt:L73-L238"><text class="h" x="36" y="38" style="font-size:26px">AI Agent 测试总架构</text><text class="m" x="36" y="64">先画系统与信任边界，再选择测试；D0 的可信度决定其他数字的上限。</text></g>
<g class="node io"><rect x="36" y="100" width="220" height="118" rx="12"/></g><text class="h" x="54" y="130">输入与风险</text><text class="m" x="54" y="156">任务 / 数据 / 权限 / 工具</text><text class="m" x="54" y="180">失败成本 / 副作用 / owner</text><text class="badge" x="54" y="204">先定义 system-under-test</text>
<g class="node trust"><rect x="310" y="90" width="250" height="138" rx="12"/></g><text class="h" x="328" y="120">D0 评估可信</text><text class="m" x="328" y="146">Gold / Rubric / Judge / 人审</text><text class="m" x="328" y="170">偏差 / 漂移 / 分歧 / 构念效度</text><text class="badge" x="328" y="198">D0 FAIL → 所有分数无效</text>
<g class="node domain"><rect x="610" y="90" width="250" height="138" rx="12"/></g><text class="h" x="628" y="120">D1–D3 行为与协作</text><text class="m" x="628" y="146">D1 单体能力与轨迹</text><text class="m" x="628" y="170">D2 编排交接与隔离</text><text class="m" x="628" y="194">D3 中断 / 接管 / 人机权威</text>
<g class="node domain"><rect x="910" y="90" width="250" height="138" rx="12"/></g><text class="h" x="928" y="120">D4–D7 系统与治理</text><text class="m" x="928" y="146">D4 可靠性 · D5 安全</text><text class="m" x="928" y="170">D6 效率经济 · D7 业务治理</text><text class="m" x="928" y="194">区间 / 预算 / 规则 / 决定权</text>
<path class="edge" d="M256 158 L304 158"/><path class="edge" d="M560 158 L604 158"/><path class="edge" d="M860 158 L904 158"/>
<g class="node risk"><rect x="90" y="300" width="1020" height="154" rx="16"/></g><text class="h" x="116" y="332">架构边界 → 风险 → Observable → Method → 独立 Oracle → Case/Fault → Evidence → Decision</text><text class="m" x="116" y="364">能力边界：任务与工具能做什么　│　信任边界：什么输入与记忆不可信　│　副作用边界：什么动作不可逆</text><text class="m" x="116" y="394">每个 D0–D7 域都必须沿这条链留下证据；只有风险清单、没有 Oracle 和 failure action 的“架构”不可测试。</text><text class="badge" x="116" y="426">固定阈值进入 Metric Card（task / population / slice / uncertainty / owner / failure action），不得从来源直接复制</text>
<path class="edge dash" d="M435 228 C435 264 260 264 260 294"/><path class="edge dash" d="M735 228 L735 294"/><path class="edge dash" d="M1035 228 C1035 264 940 264 940 294"/>
<g class="node io"><rect x="90" y="524" width="300" height="132" rx="14"/></g><text class="h" x="112" y="556">四证据环</text><text class="m" x="112" y="582">离线 fixture → 受控沙箱</text><text class="m" x="112" y="606">影子 / 灰度 → 在线持续</text><text class="badge" x="112" y="632">未运行的环 = NOT_RUN</text>
<g class="node guard"><rect x="450" y="524" width="300" height="132" rx="14"/></g><text class="h" x="472" y="556">运行时护栏</text><text class="m" x="472" y="582">最小权限 / 策略沙箱 / 预算</text><text class="m" x="472" y="606">幂等 / Kill Switch / 回滚</text><text class="badge" x="472" y="632">模型声明不是强制控制</text>
<g class="node io"><rect x="810" y="524" width="300" height="132" rx="14"/></g><text class="h" x="832" y="556">决策与反馈</text><text class="m" x="832" y="582">PASS / FAIL / BLOCKED / 不足</text><text class="m" x="832" y="606">风险接受 / 回滚 / 新样例</text><text class="badge" x="832" y="632">具名 owner 才能作决定</text>
<path class="edge" d="M390 590 L444 590"/><path class="edge" d="M750 590 L804 590"/><path class="edge" d="M600 454 L600 518"/><path class="edge" d="M600 454 C600 490 240 490 240 518"/><path class="edge" d="M600 454 C600 490 960 490 960 518"/>
<path class="stop" d="M960 656 C960 742 180 742 180 218"/><text class="badge" x="420" y="730">失败回灌：事故 / 漂移 / 新攻击 → 更新输入、D0 校准集、故障库与护栏</text>
<rect class="guard" x="36" y="768" width="1128" height="34" rx="8"/><text class="tiny" x="52" y="790">边界：本图是来源结构的课程适配；真实模型、真实工具、企业权限、从业者评审与生产效果均 NOT_RUN，不证明上线安全。</text></svg>
