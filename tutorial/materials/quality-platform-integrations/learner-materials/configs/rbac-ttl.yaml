apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-job-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "create"]
  # 教学文本夹具：不授予 secrets、RoleBinding 或 cluster-admin
---
apiVersion: batch/v1
kind: Job
spec:
  ttlSecondsAfterFinished: 900
