  <text class="ds-eyebrow" x="36" y="32">AGENT · 可靠性口径</text>
  <text class="ds-subtitle" x="1204" y="32" text-anchor="end">同一份数据，两个口径可以差得极远；口径决定承诺。</text>
  <text class="ds-title" x="36" y="74">pass@k 与 pass^k 的差距及区间口径</text>
  <text class="ds-source" x="36" y="140">source · AI agent测试架构.txt:L438-L494</text>
<g data-source-ref="AI agent测试架构.txt:L438-L494">
<g filter="url(#ds-soft)"><rect x="40" y="150" width="300" height="155" rx="14" fill="#f7f4e9" stroke="#85908a" stroke-width="1.5"/></g><rect x="40" y="150" width="6" height="155" rx="3" fill="#85908a"/><text x="64" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">任务集与重复运行</text><text x="64" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">15 个任务 × 每任务重复 5 次</text><text x="64" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">固定 temperature 与版本并记录</text><text x="64" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">保留全部 raw run（失败不得删除）</text><text x="64" y="271" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="500" fill="#85908a">重置规则：每次 run 前回到同一快照</text>
<g filter="url(#ds-soft)"><rect x="370" y="150" width="320" height="133" rx="14" fill="#edf5f0" stroke="#174a3a" stroke-width="1.5"/></g><rect x="370" y="150" width="6" height="133" rx="3" fill="#174a3a"/><text x="394" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">口径 A · pass@k（至少一次成功）</text><text x="394" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#1c2924">14 / 15 = 93.3%</text><text x="394" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">回答：它「能不能」做对</text><text x="394" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#174a3a">用途：判断能力上限，不能作为承诺</text>
<g filter="url(#ds-soft)"><rect x="370" y="300" width="320" height="153" rx="14" fill="#fbe9e5" stroke="#b2402f" stroke-width="1.5"/></g><rect x="370" y="300" width="6" height="153" rx="3" fill="#b2402f"/><text x="394" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">口径 B · pass^k（每次都成功）</text><text x="394" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#1c2924">7 / 15 = 46.7%</text><text x="394" y="379" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">回答：它「能不能每次都」做对</text><text x="394" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">这才是你对用户的承诺</text><text x="394" y="419" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="500" fill="#85908a">同一份数据，两个口径差 46.6 个百分点</text>
<g filter="url(#ds-soft)"><rect x="370" y="470" width="320" height="153" rx="14" fill="#eaf1fa" stroke="#355f96" stroke-width="1.5"/></g><rect x="370" y="470" width="6" height="153" rx="3" fill="#355f96"/><text x="394" y="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">区间：以任务为聚类单位</text><text x="394" y="528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1c2924">Wilson 95% CI = [0.246, 0.699]</text><text x="394" y="549" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">n = 15（任务数），不是 75</text><text x="394" y="570" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">把 n×k=75 当独立样本会严重低估不确定性</text><text x="394" y="589" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="500" fill="#85908a">同一任务的 5 次运行高度相关</text>
<g filter="url(#ds-soft)"><rect x="720" y="400" width="480" height="153" rx="14" fill="#fbe9e5" stroke="#b2402f" stroke-width="1.5"/></g><rect x="720" y="400" width="6" height="153" rx="3" fill="#b2402f"/><text x="744" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#1c2924">三种统计结论，不是两种</text><text x="744" y="458" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">PASS：CI 下界 ≥ 阈值</text><text x="744" y="479" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#5f6c66">FAIL：CI 上界 &lt; 阈值，或与旧版 CI 不重叠且更差</text><text x="744" y="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b2402f">EVIDENCE-INSUFFICIENT：样本不足 → 不是「通过」</text><text x="744" y="519" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="500" fill="#85908a">非重叠 CI 才算真回归；点估计的涨跌大多是噪声</text>

