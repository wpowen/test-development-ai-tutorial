<g class="edge"><path d="M 688 177 C 740 464, 446 464, 490 369" marker-end="url(#ds-arw-forest)"/><text x="593" y="283">参数或权限错</text></g>
<g class="edge"><path d="M 920 177 C 972 464, 446 464, 490 369" marker-end="url(#ds-arw-forest)"/><text x="709" y="265">曲解观测</text></g>
<g class="edge"><path d="M 688 369 C 825 369, 825 369, 954 369" marker-end="url(#ds-arw-forest)"/><text x="825" y="379">定位根因</text></g>
<g class="edge"><path d="M 920 369 C 941 369, 941 369, 954 369" marker-end="url(#ds-arw-forest)"/><text x="941" y="361">终态证据</text></g>
<g class="edge"><path d="M 688 177 C 740 670, 214 670, 258 572" marker-end="url(#ds-arw-forest)"/><text x="477" y="384.5">禁止副作用</text></g>
<g class="edge"><path d="M 504 572 C 733 572, 733 369, 954 369" marker-end="url(#ds-arw-forest)"/><text x="733" y="462.5">硬失败</text></g>
  
    <g class="node task">
      <rect x="34" y="134" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="34" y="134" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="54" y="157">01</text>
      <text class="node-title" x="54" y="182">Task</text>
      <text class="node-detail" x="54" y="204">业务目标 / 禁止动作</text>
    </g>
    <g class="node span">
      <rect x="266" y="134" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="266" y="134" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="286" y="157">02</text>
      <text class="node-title" x="286" y="182">Span</text>
      <text class="node-detail" x="286" y="204">计划与单步意图</text>
    </g>
    <g class="node tool">
      <rect x="498" y="134" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="498" y="134" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="518" y="157">03</text>
      <text class="node-title" x="518" y="182">Tool / Parameter</text>
      <text class="node-detail" x="518" y="204">工具、参数、权限</text>
    </g>
    <g class="node obs">
      <rect x="730" y="134" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="730" y="134" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="750" y="157">04</text>
      <text class="node-title" x="750" y="182">Observation</text>
      <text class="node-detail" x="750" y="204">返回值是否被正确使用</text>
    </g>
    <g class="node first">
      <rect x="498" y="326" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="498" y="326" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="518" y="349">05</text>
      <text class="node-title" x="518" y="374">首错位置</text>
      <text class="node-detail" x="518" y="396">最早偏离不变量</text>
    </g>
    <g class="node outcome">
      <rect x="730" y="326" width="190" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="730" y="326" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="750" y="349">06</text>
      <text class="node-title" x="750" y="374">Outcome Oracle</text>
      <text class="node-detail" x="750" y="396">终态与业务结果</text>
    </g>
    <g class="node trajectory">
      <rect x="962" y="326" width="200" height="86" rx="15" fill="#edf5f0" stroke="#c2d9cc" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="962" y="326" width="5" height="86" rx="2.5" fill="#c2d9cc"/>
      <text class="node-index" x="982" y="349">07</text>
      <text class="node-title" x="982" y="374">Trajectory Decision</text>
      <text class="node-detail" x="982" y="396">PASS / FAIL / BLOCKED</text>
    </g>
    <g class="node stop">
      <rect x="266" y="526" width="238" height="92" rx="15" fill="#fbe9e5" stroke="#e3a89f" stroke-width="2" filter="url(#shadow)"/>
      <rect x="266" y="526" width="5" height="92" rx="2.5" fill="#e3a89f"/>
      <text class="node-index" x="286" y="549">08</text>
      <text class="node-title" x="286" y="574">副作用阻断</text>
      <text class="node-detail" x="286" y="596">禁止工具调用立即 FAIL</text>
    </g>
  <rect class="callout" x="34" y="658" width="1132" height="48" rx="12"/>
  <text class="callout-title" x="52" y="679">FAIL-CLOSED</text><text class="callout-text" x="170" y="681">Outcome 正确不能抵消中途越权；也不能把唯一黄金路径当作唯一正确轨迹。</text>
  <text class="footer" x="34" y="735">图中轨迹来自合成 fixture，不代表生产调用链已经接入。</text>
</svg>
