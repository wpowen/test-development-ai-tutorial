<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 1174 368" width="1174" height="368">
  <title id="t">AI 帮你做传统测试：模块全景</title>
  <desc id="d">AI 生成的测试要先证明它能发现缺陷，再谈提效。</desc>

  <defs>
    <filter id="ds-soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0e3026" flood-opacity="0.08"/>
    </filter>
    <filter id="ds-strong" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0e3026" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="ds-header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e3026"/>
      <stop offset="1" stop-color="#174a3a"/>
    </linearGradient>
    <marker id="ds-arw-forest" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#174a3a"/></marker>
    <marker id="ds-arw-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a96a18"/></marker>
    <marker id="ds-arw-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b2402f"/></marker>
    <marker id="ds-arw-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#85908a"/></marker>
  </defs>
  <style>
    .ds-bg{fill:#fbfaf6}
    .ds-header{fill:url(#ds-header-grad)}
    .ds-eyebrow{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.16em;fill:#93bd2c}
    .ds-title{font:800 26px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#ffffff}
    .ds-subtitle{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#d9e8e0}
    .ds-source{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9db7ab}
    .ds-section{font:800 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#174a3a}
    .ds-foot{font:500 11px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#5f6c66}
    .ds-footbadge{font:800 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;fill:#a96a18}
    .ds-node rect{stroke-width:1.4}
    .ds-node-title{font:800 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#1c2924}
    .ds-node-detail{font:500 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#5f6c66}
    .ds-node-index{font:800 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#85908a}
    .ds-edge{fill:none;stroke:#174a3a;stroke-width:2}
    .ds-edge-label{font:600 9.5px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#5f6c66;paint-order:stroke;stroke:#fbfaf6;stroke-width:4px}
    .ds-legend{font:500 10px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#5f6c66}
</style>
  <rect class="ds-bg" x="0" y="0" width="1174" height="368" rx="22"/>

  <rect class="ds-header" x="0" y="0" width="1174" height="104" rx="22"/>
  <rect class="ds-header" x="0" y="82" width="1174" height="22"/>
  <text class="ds-eyebrow" x="36" y="32">TD-M02</text>
  <text class="ds-subtitle" x="1138" y="32" text-anchor="end">用 AI 提效，但必须证明生成结果有检测力</text>
  <text class="ds-title" x="36" y="74">AI 帮你做传统测试</text>
  <text class="ds-source" x="36" y="126">AI 生成的测试要先证明它能发现缺陷，再谈提效。</text>

    <g class="ds-node" filter="url(#ds-strong)">
      <rect x="32" y="136" width="258" height="124" rx="14" fill="#edf5f0" stroke="#c2d9cc" stroke-width="2"/>
      <rect x="32" y="136" width="6" height="124" rx="3" fill="#93bd2c"/>
      <circle cx="50" cy="154" r="11" fill="#174a3a" stroke="#c2d9cc" stroke-width="1.4"/>
       <text class="ds-node-index" x="50" y="157" text-anchor="middle" fill="#ffffff">01</text>
      <text class="ds-node-title" x="47" y="184">提取变更风险</text>
      <text class="ds-node-detail" x="47" y="199">→ 带引用的风险候选包</text>
    </g>
<text class="ds-node-detail" x="47" y="234" fill="#5f6c66">这次改动的风险面在哪里？</text>

    <g class="ds-node" filter="url(#ds-soft)">
      <rect x="316" y="136" width="258" height="124" rx="14" fill="#edf5f0" stroke="#c2d9cc"/>
      
      <circle cx="334" cy="154" r="11" fill="#ffffff" stroke="#c2d9cc" stroke-width="1.4"/>
       <text class="ds-node-index" x="334" y="157" text-anchor="middle" fill="#85908a">02</text>
      <text class="ds-node-title" x="331" y="184">生成并验证检测力</text>
      <text class="ds-node-detail" x="331" y="199">→ 候选包与 Mutation 处置报告</text>
    </g>
<text class="ds-node-detail" x="331" y="234" fill="#5f6c66">这批用例杀掉了几个注入缺陷？</text>

    <g class="ds-node" filter="url(#ds-soft)">
      <rect x="600" y="136" width="258" height="124" rx="14" fill="#edf5f0" stroke="#c2d9cc"/>
      
      <circle cx="618" cy="154" r="11" fill="#ffffff" stroke="#c2d9cc" stroke-width="1.4"/>
       <text class="ds-node-index" x="618" y="157" text-anchor="middle" fill="#85908a">03</text>
      <text class="ds-node-title" x="615" y="184">选择测试方法</text>
      <text class="ds-node-detail" x="615" y="199">→ 方法决策矩阵与最小反例</text>
    </g>
<text class="ds-node-detail" x="615" y="234" fill="#5f6c66">边界、组合、属性还是 Fuzz？</text>

    <g class="ds-node" filter="url(#ds-strong)">
      <rect x="884" y="136" width="258" height="124" rx="14" fill="#edf5f0" stroke="#c2d9cc" stroke-width="2"/>
      <rect x="884" y="136" width="6" height="124" rx="3" fill="#93bd2c"/>
      <circle cx="902" cy="154" r="11" fill="#174a3a" stroke="#c2d9cc" stroke-width="1.4"/>
       <text class="ds-node-index" x="902" y="157" text-anchor="middle" fill="#ffffff">04</text>
      <text class="ds-node-title" x="899" y="184">归类失败</text>
      <text class="ds-node-detail" x="899" y="199">→ 失败聚类与假设账本</text>
    </g>
<text class="ds-node-detail" x="899" y="234" fill="#5f6c66">一百个失败是几个原因？</text>

    <path d="M 290 198 L 310 198" fill="none" stroke="#174a3a" stroke-width="2" marker-end="url(#ds-arw-forest)"/>
    

    <path d="M 574 198 L 594 198" fill="none" stroke="#174a3a" stroke-width="2" marker-end="url(#ds-arw-forest)"/>
    

    <path d="M 858 198 L 878 198" fill="none" stroke="#174a3a" stroke-width="2" marker-end="url(#ds-arw-forest)"/>
    
<circle cx="38" cy="272" r="4" fill="#174a3a"/><text class="ds-legend" x="48" y="276">阶段顺序不可交换</text><circle cx="113" cy="272" r="4" fill="#93bd2c"/><text class="ds-legend" x="123" y="276">→ 后为该段出口工件</text>

  <rect x="28" y="294" width="1118" height="46" rx="12" fill="#fdf1d8" stroke="#e3c07b" stroke-width="1.2"/>
  <text class="ds-footbadge" x="46" y="320">模块边界</text>
  <text class="ds-foot" x="46" y="342">不覆盖 AI 系统本身的测试，这里 AI 是工具不是被测对象；不承诺提效数字，提效必须用 baseline 对照实验证明（见 TD-T26）</text>
</svg>
