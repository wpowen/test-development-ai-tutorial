<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title id="title">大模型与 AI 系统基础｜专业关系图</title>
  <desc id="desc">模型层、应用层、评测层与 Oracle 层分别负责什么，错误如何向上归因？ 图中区分数据流、控制流、证据流与反馈回路，并显示失败路径、系统边界和责任门禁。</desc>
