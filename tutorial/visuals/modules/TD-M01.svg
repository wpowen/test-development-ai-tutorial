  <text x="72" y="132" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="600" fill="#d9e9df">模型层、应用层、评测层与Oracle层分别负责什么，错误如何向上归因？</text>
