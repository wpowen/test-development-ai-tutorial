补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 AI 评测版本与 Lineage 账本","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S05","S24","S28"],"evidenceBoundary":"来源支持评测、生产 ML 成熟度与岗位中的 lineage 责任；账本字段是课程设计，需按目标 Provider、数据平台和合规要求扩展。"},{"id":"TD-T22","moduleId":"TD-M05","order":42,"title":"Trace、生产失败和回归集闭环","type":"跟做","status":"outlined","duration":"55 分钟","summary":"把脱敏生产失败从 Trace 转成有来源、有审批、有版本的回归样例，并验证修复不会复发。","why":"线上问题若只留在事故文档里，下一次模型、Prompt 或工具更新仍会重复逃逸。","prerequisites":["TD-T21"],"outcomes":["从 Trace 重建 AI 请求的关键执行路径","安全地脱敏并转成回归样例","建立生产反馈到数据集、修复和发布门禁的闭环"],"artifact":"Trace-to-Regression 流水线与回归样例","blocks":[{"title":"先把真实问题说清楚","body":["生产中 Agent 错误调用 refund_order。Trace 包含用户输入、检索文档、工具参数、重试和最终答复，但也可能含 PII。测试团队需要保留故障机制而不是复制整条生产记录。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Trace-to-Regression 流水线与回归样例 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["按 trace_id 收集模型、检索、工具、状态和最终结果","移除 PII、凭证和无关上下文，保留风险触发条件","由业务与安全负责人确认期望行为和阻断级别","将样例加入回归集，修复后在 CI 与预生产复跑"]},{"title":"在最小业务场景里亲手做一次","body":["从一条错误退款 Trace 提取最小输入：商品已激活、用户要求自动退款、检索到正确政策但 Agent 仍调用工具。脱敏后生成 eval case，先证明当前坏版本失败，再修复权限策略并复跑。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"python3 scripts/trace_to_case.py --trace trace.json --redact --out cases/refund-escaped.json\npython3 scripts/evaluate.py --case cases/refund-escaped.json","expected":"生成的样例不含敏感数据，保留 source_trace_hash、owner、risk_slice 和 expected_tool_policy；坏版本失败，修复版本通过。"},{"title":"诊断失败，而不是把阈值调到通过","body":["直接复制生产日志会泄露数据，过度脱敏又会删掉触发条件。若样例不能稳定重放，检查外部状态、知识库快照和工具副作用；不能复现时保留为调查线索，不算回归资产。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Trace-to-Regression 流水线与回归样例 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Trace-to-Regression 流水线与回归样例","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S10","S27","S28"],"evidenceBoundary":"页面依据应用评测与岗位信号构建闭环；未使用真实生产 Trace，脱敏、保留期限和审批流程必须由目标组织的隐私与安全负责人确认。"},{"id":"TD-T23","moduleId":"TD-M05","order":43,"title":"质量、延迟和成本联合门禁","type":"参考","status":"outlined","duration":"45 分钟","summary":"在固定工作负载上同时比较质量、TTFT/TPOT/端到端延迟、Token 与调用成本，避免单指标优化伤害业务。","why":"更快、更便宜或分数更高都可能以另一个维度恶化为代价；发布决定需要明确的不可突破底线和 Pareto 选择。","prerequisites":["TD-T20"],"outcomes":["定义带分布的 AI 工作负载","建立质量、延迟、成本三类硬门禁","识别 Pareto 候选并给出业务决策"],"artifact":"质量-延迟-成本 Pareto 对比报告","blocks":[{"title":"先把真实问题说清楚","body":["候选 B 把平均延迟降低 20%，但长输入上的正确率下降，p99 TTFT 上升且工具调用翻倍。仅看平均延迟会误判为优化成功。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 质量-延迟-成本 Pareto 对比报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["固定输入长度、输出长度、并发、工具使用和风险切片分布","分别计算 blocker、任务质量、p50/p95/p99 延迟和单位成功成本","先淘汰突破安全/质量/SLO 底线的候选","在剩余候选中展示 Pareto 前沿，由产品和容量负责人选择"]},{"title":"在最小业务场景里亲手做一次","body":["比较两个模型路由：A 质量高但贵，B 便宜但在退款长对话上下降。按普通 FAQ 与高风险退款切片计算；若 B 低风险可接受、高风险不达标，可只在低风险路由而非全量替换。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"gate = safety_blockers==0 and high_risk_pass>=0.98 and p95_ttft_ms\u003c=1200 and cost_per_success\u003c=budget\npareto = nondominated(candidates)","expected":"报告不输出一个模糊综合分，而是列出各底线、切片分布和 Pareto 候选；决策明确写出适用流量、回退条件和负责人。"},{"title":"诊断失败，而不是把阈值调到通过","body":["平均值掩盖尾部、Token 分布不同、缓存命中不一致和失败请求未计成本都会扭曲结果。先验证 workload 与分母，再讨论模型优劣。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 质量-延迟-成本 Pareto 对比报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 质量-延迟-成本 Pareto 对比报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S24","S29","S31"],"evidenceBoundary":"来源支持生产成熟度和 AI 质量岗位需求；示例阈值只是教学数字，必须依据真实 SLO、流量、模型价格与风险承受度重新校准。"},{"id":"TD-T24","moduleId":"TD-M05","order":44,"title":"漂移、告警、Waiver 和回滚","type":"诊断","status":"outlined","duration":"50 分钟","summary":"把质量异常分成数据、行为、Judge、性能和成本漂移，并设计可到期的例外与经过演练的回滚路径。","why":"AI 系统会随输入、知识、模型和依赖变化；没有基线、告警和回滚，团队只能在事故发生后临时猜测。","prerequisites":["TD-T21","TD-T22","TD-T23"],"outcomes":["为关键切片建立基线和漂移信号","区分告警、调查、waiver 与阻断","编写并演练模型/Prompt/知识库/工具回滚 Runbook"],"artifact":"AI 质量事故、Waiver 与回滚 Runbook","blocks":[{"title":"先把真实问题说清楚","body":["退款正确率一周内缓慢下降，同时 Judge 分数却保持稳定。可能是输入分布变化、知识库过期，也可能是 Judge 漂移。需要独立检查数据和评测器，避免把错误归给模型。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 AI 质量事故、Waiver 与回滚 Runbook 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["保存质量、输入、Judge、延迟和成本基线及版本","按风险切片检测变化并设置持续窗口，避免单点噪声","告警后冻结相关版本，执行诊断树和回归集","阻断时回滚；waiver 必须有 owner、补偿控制、到期时间与自动失效"]},{"title":"在最小业务场景里亲手做一次","body":["模拟知识库索引漏掉最新政策。高风险 slice recall 连续三批下降后触发 P1；先回滚到已知索引，再验证回答、引用、工具和性能。若业务必须临时上线，waiver 仅允许只读模式并在 24 小时后自动失效。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"alert: high_risk_recall \u003c baseline-0.05 for 3 windows\naction: freeze -> diagnose -> rollback(kb_snapshot) -> replay_regression\nwaiver_expires: 24h","expected":"回滚后核心切片恢复基线，版本账本和事故报告记录原因、受影响范围、恢复证据和新增回归样例；到期 waiver 自动阻断。"},{"title":"诊断失败，而不是把阈值调到通过","body":["把阈值放宽、静默更换 Judge、只回滚模型不回滚知识库，都会让问题继续存在。若多个组件同时变化，先恢复完整已知良好 manifest，再逐个前滚。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 AI 质量事故、Waiver 与回滚 Runbook 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 AI 质量事故、Waiver 与回滚 Runbook","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S07","S23","S24"],"evidenceBoundary":"NIST、ISTQB 与生产 ML 资料支持治理和回滚原则；告警窗口与处置级别是教学方案，尚未经过目标组织事故演练或生产验证。"},{"id":"TD-B01","moduleId":"TD-M06","order":45,"title":"Benchmark 不是一张榜单：先拆评分流水线","type":"概念","status":"outlined","duration":"40 分钟","summary":"把任务、数据、协议、运行环境、Scorer、聚合和报告拆开，理解一个分数到底代表什么。","why":"只看榜单名次会忽略数据和 harness 的限制，企业也无法直接复用公共分数作发布决策。","prerequisites":["TD-T21"],"outcomes":["画出 benchmark 评分流水线","区分任务能力与运行协议影响","审计分数的适用范围"],"artifact":"Benchmark 评分流水线与审计清单","blocks":[{"title":"先把真实问题说清楚","body":["同一模型在两个榜单分数不同，可能不是能力突然变化，而是 Prompt、工具权限、采样、超时、版本、Scorer 或聚合方式不同。测试开发要从报告追到原始样例。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Benchmark 评分流水线与审计清单 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["定义目标能力和任务单位","检查数据来源、切分和泄漏控制","记录 prompt、harness、工具、预算、环境与模型快照","追踪逐题结果、scorer、聚合和不确定性后再解释总分"]},{"title":"在最小业务场景里亲手做一次","body":["选择一个公开 benchmark 报告，逐项填写 dataset、task、protocol、model、scorer、aggregation 和 limitations；任一关键字段缺失就把结论标成不可复现或适用范围未知。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"# TD-B01 最小执行记录\ninput_version: v1\nsystem_version: candidate-a\nrisk_slice: high\nexpected_gate: FAIL_ON_SEEDED_REGRESSION\nevidence: artifact/td-b01-report.json","expected":"产物能把总分拆回逐任务和运行协议，明确哪些是事实、哪些是解释、哪些信息缺失；不会把公共榜单直接当企业发布门禁。"},{"title":"诊断失败，而不是把阈值调到通过","body":["只抄 leaderboard 或只读摘要无法审计。若模型快照、prompt、工具预算或 scorer 不公开，应保留 unknown，不用猜测补全。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Benchmark 评分流水线与审计清单 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Benchmark 评分流水线与审计清单","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S36","S37","S40"],"evidenceBoundary":"页面依据公开 harness、HELM 与第三方评测原则；课程没有复现所有榜单，也不对任何当前模型排名作时效性承诺。"},{"id":"TD-B02","moduleId":"TD-M06","order":46,"title":"Benchmark 数据怎么来：采样、标注、Split 与 Holdout","type":"跟做","status":"outlined","duration":"60 分钟","summary":"从真实任务抽样、定义标签和风险切片，构建带来源、去重、开发集与隐藏 Holdout 的最小数据集。","why":"数据代表什么决定分数能说明什么；重复、污染和针对测试集调参会制造虚高。","prerequisites":["TD-B01"],"outcomes":["定义抽样框和纳入排除规则","组织标注、冲突处理与数据卡","建立开发集、回归集和 Holdout 隔离"],"artifact":"Dataset Card、Split 清单与 Holdout Manifest","blocks":[{"title":"先把真实问题说清楚","body":["企业客服有大量简单 FAQ 和少量高风险退款。按自然频率随机采样会让 99% 准确率掩盖危险场景；只挑困难样例又无法描述真实流量。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Dataset Card、Split 清单与 Holdout Manifest 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["先声明目标人群、时间窗、业务分布与失败成本","分层抽样普通、高风险、边界、攻击和历史事故","双人标注并记录分歧、来源和政策版本","按实体与时间去重切分，封存 Holdout 并限制访问"]},{"title":"在最小业务场景里亲手做一次","body":["从 100 条脱敏候选中构建 30 条教学集：保持流量分布的 representative split，同时建立高风险 challenge split；同一用户或同一事件不能跨 split。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"python3 scripts/build_dataset.py --input cases.jsonl --group-by incident_id --stratify risk_slice --holdout 0.2\npython3 scripts/audit_split.py manifests/dataset.json","expected":"数据卡记录来源、时间、许可、风险切片、标注规则和限制；审计脚本发现跨 split 重复时失败，Holdout 样例不出现在调试输出。"},{"title":"诊断失败，而不是把阈值调到通过","body":["随机按行切分会让同一事件泄漏到多组；让开发者反复看 Holdout 会把它变成开发集。发现泄漏后应重建 split 并使历史结果失效。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Dataset Card、Split 清单与 Holdout Manifest 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Dataset Card、Split 清单与 Holdout Manifest","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S23","S37","S40"],"evidenceBoundary":"来源支持数据治理和可信评测；30 条教学集仅展示流程，不能估计真实业务质量、罕见风险或统计显著性。"},{"id":"TD-B03","moduleId":"TD-M06","order":47,"title":"Accuracy、Pass@k、Resolved Rate 和 Judge Score 怎么算","type":"跟做","status":"outlined","duration":"55 分钟","summary":"在小型 fixture 上亲手计算常见指标，理解分母、重复采样、聚合和置信区间如何改变结论。","why":"同名指标可能使用不同单位和聚合；不会核算就无法审计榜单或企业报告。","prerequisites":["TD-B02"],"outcomes":["从逐题结果计算四类指标","解释 pass@k 与单次成功率差异","同时报告切片、样本量和不确定性"],"artifact":"Metric Card、计算脚本与逐题报告","blocks":[{"title":"先把真实问题说清楚","body":["10 个任务中有 8 个至少一次成功，多次采样后 pass@5 很高，但单次成功和平均成本很差；Judge 平均分又掩盖一个安全 blocker。需要保留逐题与多指标。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Metric Card、计算脚本与逐题报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["定义样本单位、成功条件、k、重复次数和缺失处理","先手算小样例再运行脚本","同时计算总体、风险切片、blocker 和成本","用 bootstrap 或二项区间表达不确定性，不比较不可比小差异"]},{"title":"在最小业务场景里亲手做一次","body":["创建 10 个任务、每题 5 次尝试的 fixture。手算 accuracy、resolved rate 与 pass@k；把一次安全失败加入后，平均 Judge 分仍可上升，但 blocker 门禁必须失败。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"python3 scripts/metrics.py fixtures/runs.jsonl --metrics accuracy,pass_at_k,resolved_rate,judge --bootstrap 1000\npython3 scripts/check_blockers.py reports/metrics.json","expected":"脚本结果与手算一致；报告包含公式、分母、样本量、区间和风险切片，安全 blocker 独立于平均分。"},{"title":"诊断失败，而不是把阈值调到通过","body":["把尝试次数增加后的 pass@k 与单次结果比较、丢弃超时或只报均值都会误导。先审计原始逐题记录和分母，再解释差异。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Metric Card、计算脚本与逐题报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Metric Card、计算脚本与逐题报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S36","S38","S39"],"evidenceBoundary":"公开 benchmark 支持这些指标形态；计算示例为小型 fixture，区间宽且不代表任何模型或产品的真实性能。"},{"id":"TD-B04","moduleId":"TD-M06","order":48,"title":"Prompt、Harness、工具权限为什么会改变分数","type":"诊断","status":"outlined","duration":"50 分钟","summary":"固定模型与数据，一次只改变一个协议变量，定位 benchmark 分数对 harness 的敏感性。","why":"Benchmark 测到的是模型与运行系统的组合，不记录协议就无法复现也无法公平比较。","prerequisites":["TD-B03"],"outcomes":["识别主要 harness 变量","设计单变量敏感性实验","区分模型能力与系统工程贡献"],"artifact":"Benchmark Harness 敏感性与复现实验报告","blocks":[{"title":"先把真实问题说清楚","body":["代码修复模型在允许运行测试时 resolved rate 提升，在禁用网络和缩短超时后下降。这个差异可能合理，但不能被写成模型本身变聪明或退步。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Benchmark Harness 敏感性与复现实验报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["固定模型快照、数据、随机参数和 scorer","选择 prompt、工具、超时、上下文或重试中的一个变量","重复运行并保存环境、调用、失败类型和成本","将差异归因到协议敏感性，必要时发布多个受控配置的结果"]},{"title":"在最小业务场景里亲手做一次","body":["同一模型同一 20 题集先使用只读代码工具，再增加测试执行工具；比较哪些任务因工具可用而解决，哪些因额外调用超时，并记录总预算。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"# TD-B04 最小执行记录\ninput_version: v1\nsystem_version: candidate-a\nrisk_slice: high\nexpected_gate: FAIL_ON_SEEDED_REGRESSION\nevidence: artifact/td-b04-report.json","expected":"报告只对被改变变量作有限归因，列出逐题转变、成本与失败原因；无法复现的变化标为未知而非能力结论。"},{"title":"诊断失败，而不是把阈值调到通过","body":["同时改变系统 prompt、工具和重试，再用一个总分解释，会形成混杂实验。回到版本 manifest，重跑单变量对照。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Benchmark Harness 敏感性与复现实验报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Benchmark Harness 敏感性与复现实验报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S36","S38","S39"],"evidenceBoundary":"公开 harness 与 benchmark 说明协议会影响结果；课程未在完整公开数据集复跑，示例结论只适用于设计的教学实验。"},{"id":"TD-B05","moduleId":"TD-M06","order":49,"title":"不确定性、污染、隐藏测试和版本可比性","type":"诊断","status":"outlined","duration":"55 分钟","summary":"审计样本量、重复运行、置信区间、数据污染、隐藏测试保护和版本变化，判断分数是否可信。","why":"小样本波动、训练数据泄漏或测试公开后过拟合，都可能让榜单差异失去意义。","prerequisites":["TD-B04"],"outcomes":["识别统计与污染风险","设计 canary 和隐藏测试策略","判断跨版本报告能否比较"],"artifact":"Benchmark 可信度、污染与版本审计报告","blocks":[{"title":"先把真实问题说清楚","body":["候选分数比基线高 1.5%，但只运行一次、部分题目公开多年、harness 版本也更新。团队不能据此宣布显著提升。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Benchmark 可信度、污染与版本审计报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["检查样本量、重复次数、缺失与失败处理","报告区间和成对逐题变化","检查近重复、公开泄漏、调试访问与异常记忆迹象","冻结版本并用隐藏 canary 复核；版本变化时断开不合法趋势线"]},{"title":"在最小业务场景里亲手做一次","body":["在 fixture 中加入训练说明里可直接找到答案的污染题和 5 个隐藏 canary。候选只在污染题上大幅提高时，报告应标记污染风险并拒绝整体提升结论。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"# TD-B05 最小执行记录\ninput_version: v1\nsystem_version: candidate-a\nrisk_slice: high\nexpected_gate: FAIL_ON_SEEDED_REGRESSION\nevidence: artifact/td-b05-report.json","expected":"审计给出可信、存疑和不可比较三类结论及原因；分数变化同时展示区间、版本和污染信号，不输出虚假精确排名。"},{"title":"诊断失败，而不是把阈值调到通过","body":["没有污染检测证据不等于没有污染；隐藏测试也可能通过人工泄露。应记录访问、轮换 canary，并明确残余风险。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Benchmark 可信度、污染与版本审计报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Benchmark 可信度、污染与版本审计报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S37","S38","S40"],"evidenceBoundary":"来源讨论可信评测、公开 benchmark 和污染边界；课程只能演示审计方法，无法确认任何闭源模型的训练数据组成。"},{"id":"TD-B06","moduleId":"TD-M06","order":50,"title":"从 SWE-bench、AgentBench、HELM 到企业内部 Benchmark","type":"项目","status":"outlined","duration":"90 分钟","summary":"借鉴公共 benchmark 的任务、协议和报告思想，构建与真实业务风险、维护责任和发布决策相连的内部基准。","why":"公共 benchmark 帮助理解通用能力，但企业发布需要自己的 completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S37","S38","S39"],"evidenceBoundary":"公共 benchmark 提供可借鉴结构；内部仓库是教学项目，未连接真实企业任务、模型、人工标注或生产发布流程。"},{"id":"TD-T25","moduleId":"TD-M07","order":51,"title":"Capstone：完成一个 AI Quality Engineering 仓库","type":"项目","status":"outlined","duration":"180 分钟","summary":"把需求风险、传统测试、LLM/RAG/Agent 评测、CI、Trace、性能、Benchmark 和人工门禁组合成端到端交付。","why":"掌握零散工具不等于具备职业能力；Capstone 要证明你能让一个坏 AI 版本安全失败、定位并恢复。","prerequisites":["TD-T12","TD-T17","TD-T20","TD-T24","TD-B06"],"outcomes":["设计完整 AI 质量架构","交付可运行红绿回归和发布门禁","用证据解释质量、风险、成本和未知"],"artifact":"AI Quality Engineering Capstone 仓库与评审包","blocks":[{"title":"先把真实问题说清楚","body":["目标是一个退款知识助手：既有 RAG 回答，又有查询订单和转人工工具。候选版本可能引用过期政策、越权退款、在并发下变慢，或因 Judge 漂移假绿。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 AI Quality Engineering Capstone 仓库与评审包 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["从 PRD、架构、数据和历史事故建立风险与追踪矩阵","实现 API/契约/性能基线及 LLM、RAG、Agent 分层评测","接入版本 manifest、CI、Trace 回归、攻击集和 rollback runbook","执行 baseline→故障注入→修复，并由人工按证据清单评审"]},{"title":"在最小业务场景里亲手做一次","body":["仓库至少包含 12 条 eval、3 个高风险 blocker、1 个间接注入、1 个工具越权、1 个性能退化和 1 个生产 Trace 脱敏 fixture。先跑通过，再注入两类故障，最后修复并保留三阶段报告。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"# TD-T25 最小执行记录\ninput_version: v1\nsystem_version: candidate-a\nrisk_slice: high\nexpected_gate: FAIL_ON_SEEDED_REGRESSION\nevidence: artifact/td-t25-report.json","expected":"一条命令可复现 baseline、mutation 和 repair；坏版本退出非零并定位到风险、样例和组件；发布报告列明门禁、waiver、回滚、证据边界与未验证事项。"},{"title":"诊断失败，而不是把阈值调到通过","body":["只提交课程文档、模型聊天截图或最终绿色报告不算完成。缺少坏版本证据、版本 lineage、真实 Oracle 或人工责任时，Capstone 必须判为未通过。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 AI Quality Engineering Capstone 仓库与评审包 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 AI Quality Engineering Capstone 仓库与评审包","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S07","S23","S24","S27","S28"],"evidenceBoundary":"课程现有 RAG fixture 已验证最小红绿链路；完整 Capstone 是学员项目规范，尚未由目标测试团队、生产系统或真实学员完成现场验证。"},{"id":"TD-C01","moduleId":"TD-M10","title":"测试岗位不会只剩点点点：能力如何迁移","type":"参考","duration":"35 分钟","summary":"把传统 QA、测试开发和自动化能力迁移到 Quality Engineering、AI Eval、开发者生产力、平台与 SRE，而不是用“AI 会替代测试”制造焦虑。","why":"可自动化的是重复执行和候选生成，不会自动消失的是风险决策、Oracle、实验、系统性证据、生产可靠性和跨团队质量责任。","prerequisites":["TD-A06","TD-T12"],"outcomes":["区分被自动化与新增工作","绘制个人能力迁移路线","用可交付工件证明专业度"],"artifact":"12 个月测试 × AI 能力路线图","blocks":[{"title":"工作从执行转向质量信号工程","body":["AI 会加速需求摘要、候选用例、代码草稿、数据生成和失败聚类，但这些产物仍需来源、检测力、校准和责任边界。测试人员的重心转向风险建模、可测试性、评测数据、质量门禁和生产反馈。"]},{"title":"四条可组合路线","body":["Quality Engineer/SDET 深化测试架构、契约和平台；AI Quality/Eval Engineer 建设数据集、Scorer、Judge 校准和 AI 门禁；Developer Productivity 建设 CI、测试基础设施和反馈速度；Reliability/Platform 负责 SLO、容量、可观测、事故与成本。"],"bullets":["业务风险与测试设计","软件与数据工程","AI 系统与评测","性能可靠性与平台","沟通、治理和决策"]},{"title":"用作品而不是工具列表证明能力","body":["一个强作品应包含需求追踪、风险策略、自动化、故障注入、AI Eval、性能实验、Trace、CI 门禁、版本 Manifest、Waiver 和回滚。说明哪些是 desk research、fixture、真实在线运行和生产验证。"],"expected":"面试者能复现你的实验、看到坏版本被拒绝，并理解你为何选择这些指标和阈值。"},{"title":"12 个月学习顺序","body":["1–3 月补齐需求、接口、数据、自动化与 CI；4–6 月学习 LLM/RAG/Agent 和 Eval；7–9 月完成 AI 性能、可靠性和可观测；10–12 月建设端到端质量平台并参与真实发布。每阶段以工件和失败证据结业。"],"warning":"只收集 Prompt 和工具证书不会形成长期壁垒；职业价值来自可复用的质量系统和决策证据。"}],"practice":["把当前工作标成保留、辅助、自动化、转型和新增","选择两条路线组合并列出缺口","规划一个能让坏版本失败的公开作品"],"completion":["路线图基于工件而非岗位名称","每季度有可验证产出","能诚实区分实验、在线和生产证据"],"sourceIds":["S23","S60","S62","S64"],"evidenceBoundary":"行业方向来自标准、研究与岗位信号的综合，不构成对单个公司或个人岗位的保证；组织结构、地区与招聘周期会影响实际需求。","order":52,"status":"outlined"},{"id":"TD-AP01","moduleId":"TD-M11","order":53,"title":"为什么 Agent 压测不是把并发数调高","type":"概念","status":"desk-researched","duration":"45 分钟","summary":"先建立正确的被测系统模型：一次 Agent 任务可能包含多轮模型调用、检索、工具、状态读写、重试和人工交接，HTTP 成功不等于任务成功。","why":"普通接口通常把一次请求视为一个工作单元；Agent 的一个用户任务会动态展开成多步有状态工作流。如果仍只看 QPS 和接口 p95，你可能得到全绿的网关曲线，同时用户任务超时、重复扣费、成本失控或执行了错误副作用。","prerequisites":[],"outcomes":["画出 Agent 任务的完整关键路径","区分请求成功、步骤成功与业务任务成功","解释开环和闭环负载何时会掩盖问题"],"artifact":"Agent 压测对象与失败模型","blocks":[{"title":"先定义真正的工作单元：Task，而不是 HTTP Request","body":["假设用户让报销 Agent 完成“读取发票、核对政策、创建报销单”。入口 API 可能 200 返回一个 task_id，但后台还要完成 OCR、两次模型判断、政策检索、财务系统写入和最终确认。入口 200 只能证明受理成功，不能证明任务正确结束。","压测报告因此至少保留三层分母：收到多少用户任务、启动多少 Agent 运行、内部产生多少模型/工具调用。任何百分比都必须写明分母，否则 99.9% 的‘成功率’没有可比较含义。"],"table":{"headers":["观察层","工作单元","典型成功","典型假绿"],"rows":[["入口服务","HTTP 请求","2xx/受理","任务随后超时或进入死循环"],["Agent 运行","一次 task/run","终态正确且在时限内","最终文本正常但工具副作用错误"],["模型层","一次 generation","生成成功","多轮重试后才成功，成本被放大"],["工具层","一次 tool call","返回成功","重复调用、幂等失效或写错对象"]],"caption":"压测结论必须逐层汇总，不能用入口成功率代替业务成功率。"}},{"title":"Agent 的负载为什么会动态放大","body":["传统服务的扇出通常由代码路径决定；Agent 会受模型决策、上下文、工具失败和重试策略影响。同样 100 个用户任务，可能产生 200 次模型调用，也可能在异常时产生 900 次模型调用。这个比值就是调用放大系数。","排队会进一步形成反馈环：依赖变慢 → Agent 超时并重试 → 下游流量增加 → 排队更长。Google SRE 把重试和队列列为级联故障的重要放大器。Agent 系统还多了一层模型循环和工具循环，因此必须为步骤数、重试数、总时长和总成本设硬预算。"],"code":"call_amplification = (model_calls + tool_calls) / accepted_tasks\nretry_amplification = total_attempts / first_attempts\ngoodput = successful_tasks_meeting_latency_and_cost_slo / test_duration","expected":"你能说明吞吐不是完成量：只有正确、及时、成本合格的任务才进入 goodput。"},{"title":"选择负载模型：开环发现容量，闭环模拟受限用户","body":["闭环模型维持固定并发：一个虚拟用户完成后才发下一个请求。系统变慢时，发压端也会自动降速，可能掩盖过载。开环模型按到达率持续注入任务，更适合验证突发流量、排队和拒绝策略。","工程上通常两者都要：用闭环回答‘固定 50 个并发用户体验如何’，用开环回答‘每秒 20 个任务到来时系统是否保持 SLO’。再加入突发、长短任务混合、依赖变慢和限流场景，才能接近真实流量。"],"table":{"headers":["模型","控制量","适合回答","主要风险"],"rows":[["闭环","并发用户数","固定并发下的体验与资源占用","系统变慢时注入率下降，产生协调遗漏"],["开环","任务到达率","容量边界、排队、限流和突发","需控制队列，避免无限积压"],["回放","真实到达间隔与任务分布","已知业务形态下的回归","历史流量未必覆盖未来峰值"]]}},{"title":"本专题使用的业务场景","body":["后续七页统一使用“订单异常处置 Agent”：读取工单，调用模型分类，查询订单工具，必要时调用退款工具，并写入处理结果。这样指标、Trace、压测和告警可以在同一条业务链上串起来。","教学实验不调用真实模型和支付系统，而使用确定性夹具模拟模型、工具、限流和重试。它能验证测量方法与门禁逻辑，不能证明某家模型或你的生产容量。"],"warning":"不要直接对生产写接口做压测。退款、发信、建单等副作用必须使用沙箱、幂等键和清理脚本。"}],"practice":["画出一个真实 Agent 从入口到终态的所有步骤和依赖","分别写出入口成功、任务成功和业务正确的判定","为模型调用、工具调用、重试和总时长设置初始预算"],"completion":["图中包含队列、模型、工具、状态和外部依赖","所有成功率都注明分母","能解释为何闭环压测可能掩盖过载"],"sourceIds":["S47","S48","S68","S72","S75","S77"],"evidenceBoundary":"来源支持负载模型、级联故障与 Agent Trace 的通用机制；具体容量、调用放大和预算必须由目标系统实测。"},{"id":"TD-AP02","moduleId":"TD-M11","order":54,"title":"建立 Agent 性能指标树：系统、模型、轨迹、成本","type":"参考","status":"desk-researched","duration":"60 分钟","summary":"把传统 Golden Signals、生成式模型延迟、Agent 轨迹质量和单位成功成本连接成可计算的指标树。","why":"单一平均延迟无法解释首字等待、逐 Token 卡顿、工具等待、队列积压和重试放大。指标树必须同时回答：快不快、对不对、稳不稳、贵不贵，以及慢在哪里。","prerequisites":["TD-AP01"],"outcomes":["区分 TTFT、TTFO、TPOT/ITL 和 E2E","计算任务 Goodput 与单位成功成本","为每个指标指定维度、窗口和行动"],"artifact":"Agent 性能指标字典","blocks":[{"title":"第一层：服务是否承受住流量","body":["沿用 SRE 四类信号，但必须按成功/失败请求、任务类型和依赖拆维度。平均值只适合看总量，发布门禁使用分位数和错误预算。"],"table":{"headers":["指标","定义","它回答什么","异常时先看"],"rows":[["Traffic","tasks/s、requests/s、tokens/s","来了多少工作","任务类型与输入长度分布"],["Latency","queue、service、E2E 的 p50/p95/p99","用户等多久","成功与失败延迟分开"],["Errors","超时、限流、依赖、解析、业务错误率","哪里失败","错误码与失败步骤"],["Saturation","CPU/GPU、KV cache、连接池、队列深度","资源是否接近极限","等待任务与排队时间"]]}},{"title":"第二层：生成式模型的等待发生在哪里","body":["TTFT 是请求发出到第一个生成 Token 的时间，通常包含排队和 Prefill；TPOT 或 ITL 描述首 Token 后的生成节奏；E2E 是完整请求耗时。推理模型还可能先生成不可见的推理 Token，AIPerf 因此区分首 Token 与首可见输出（TTFO）。","测试时必须记录输入/输出 Token 长度，因为长上下文会增加 Prefill，长输出会增加生成时间。只比较总延迟而不控制长度，无法判断版本真的变慢还是工作负载变了。"],"table":{"headers":["指标","近似计算","用户感知","常见根因"],"rows":[["TTFT","first_token_at - request_at","等待开始响应","排队、长 Prompt、Prefill"],["TTFO","first_visible_output_at - request_at","推理模型首次可见内容","隐藏推理阶段过长"],["ITL/TPOT","相邻 Token 间隔/生成阶段每 Token 时间","流式是否卡顿","Decode 调度与资源争用"],["E2E","completed_at - request_at","完整完成时间","输出长度、重试、工具等待"]]}},{"title":"第三层：Agent 是否用合理路径完成任务","body":["性能不能以牺牲正确性换取。轨迹指标把最终结果与过程成本连接起来；LangSmith 的 Agent 评测也区分最终响应、轨迹和单步决策。"],"table":{"headers":["指标","计算","防止什么假绿"],"rows":[["Task success","正确到达允许终态 / 总任务","HTTP 200 但业务失败"],["Step count","每任务 span/tool/model 数","无意义循环"],["Tool precision","正确工具调用 / 全部工具调用","乱调工具但最终文本看似正常"],["Retry amplification","总尝试 / 首次尝试","靠重试掩盖不稳定"],["Goodput","成功且满足延迟、成本、轨迹预算的任务 / 秒","吞吐高但质量或成本不合格"]]}},{"title":"第四层：成本必须按成功任务归一化","body":["总 Token 与总费用只能回答账单规模。工程决策更关心每个成功任务成本，以及不同任务切片的成本尾部。失败重试同样消耗 Token，不能从分母中删除。","建议同时保存 model_input_tokens、model_output_tokens、model_calls、tool_calls、retry_count、estimated_cost 和 task_success，再计算 cost_per_success。价格属于外部配置，报告要记录价格表版本。"],"code":"cost_per_success = total_cost / successful_tasks\nquality_adjusted_cost = total_cost / tasks_meeting_quality_latency_budget\n# 不要用 total_cost / accepted_tasks 掩盖失败和超时"},{"title":"指标不是列表，而是触发行动的契约","body":["每个指标必须补齐单位、分母、聚合窗口、分位数、标签基数、数据源、阈值、负责人和超限动作。没有行动映射的指标只能做探索面板，不能做告警。"],"expected":"一条合格定义示例：checkout_agent/task_e2e_ms，成功任务 p95，5 分钟滚动，按 workflow_version 和 task_type 分组；连续 3 个窗口 > 12s 则停止放量并检查 queue/model/tool 三段耗时。"}],"practice":["为一个 Agent 写出不少于 15 个指标并归入四层","给每个百分比补充分母","选择 5 个指标写出阈值超限后的具体动作"],"completion":["同时覆盖正确性、延迟、容量、轨迹和成本","能从 E2E 下钻到 queue/model/tool","至少一个门禁使用 Goodput 而不是裸吞吐"],"sourceIds":["S47","S51","S67","S69","S73","S74"],"evidenceBoundary":"指标语义来自官方文档和 SRE 方法；阈值示例仅作教学，不能直接用于生产。"},{"id":"TD-AP03","moduleId":"TD-M11","order":55,"title":"设计工作负载：任务、上下文、工具与故障分布","type":"参考","status":"desk-researched","duration":"55 分钟","summary":"从真实流量构造可解释的 workload model，而不是用同一个 Prompt 循环一万次。","why":"Agent 性能高度依赖输入长度、任务复杂度、工具扇出、缓存命中和失败重试。如果测试分布与生产不同，容量数字即使精确也没有决策价值。","prerequisites":["TD-AP02"],"outcomes":["把生产流量切成任务类别","建立输入与路径联合分布","设计稳态、突发、浸泡和故障场景"],"artifact":"版本化工作负载模型","blocks":[{"title":"从业务任务切片，不从 Prompt 文案切片","body":["先按业务风险和执行路径分类，再统计每类任务的占比、上下文长度、预期工具链、允许终态和成本预算。相同 Prompt 长度可能走完全不同的工具路径。"],"table":{"headers":["切片","占比示例","路径","主要风险"],"rows":[["只读查询","55%","model → order_lookup → model","高频、缓存与限流"],["退款判断","25%","model → policy → order → refund","副作用与幂等"],["信息不足","15%","model → ask_user","长会话与状态"],["人工升级","5%","model → handoff","队列与终态正确"]]}},{"title":"控制四类决定性能的变量","body":["至少控制输入 Token 分布、输出 Token 上限、步骤/工具扇出、依赖延迟与错误率。还要记录缓存热度、模型版本、区域和限流配额。"],"bullets":["长度：短/中/长上下文，不要只测平均长度","复杂度：一步任务、三步任务、可能循环的任务","依赖：工具 p50/p95、超时、429、5xx 和空结果","状态：冷启动、热缓存、长会话、并发写冲突"]},{"title":"四种测试各回答一个问题","body":["容量测试逐级增加到 SLO 首次失败；突发测试观察队列与恢复；浸泡测试发现泄漏、缓存膨胀和漂移；故障测试验证限流、重试、熔断和降级。不要用一次十分钟的峰值测试替代全部。"],"table":{"headers":["场景","负载形状","停止条件","主要产物"],"rows":[["基线","低负载固定分布","指标稳定","无竞争时的服务时间"],["容量","阶梯/恒定到达率","SLO 或资源门限首次失败","最大可持续 goodput"],["突发","短时 3–10 倍","队列恢复或拒绝失控","恢复时间和降载行为"],["浸泡","60 分钟以上稳态","资源/成本持续漂移","泄漏和尾延迟趋势"],["故障","依赖慢/错/限流","安全降级失败","韧性与错误预算消耗"]]}},{"title":"给数据集加上可回放字段","body":["每条任务保存 task_type、risk_slice、input_token_bucket、expected_tools、allowed_terminal_states、latency_budget_ms、cost_budget 和 fixture_version。敏感生产输入必须脱敏或合成，并保留分布依据。"],"code":"{\n  \"task_id\": \"refund-long-007\",\n  \"task_type\": \"refund_decision\",\n  \"input_token_bucket\": \"8k-16k\",\n  \"expected_tools\": [\"policy_lookup\", \"order_lookup\", \"refund\"],\n  \"allowed_terminal_states\": [\"refunded\", \"handoff\"],\n  \"latency_budget_ms\": 12000,\n  \"cost_budget\": 0.08,\n  \"fixture_version\": \"workload-2026-08-v1\"\n}"}],"practice":["抽样至少 30 条脱敏 Trace 建立任务切片","生成一份不含生产 PII 的回放数据集","设计基线、容量、突发、浸泡和故障五个场景"],"completion":["工作负载包含联合分布而非单一平均值","每条任务有允许终态和预算","能解释样本与生产流量之间的偏差"],"sourceIds":["S68","S77","S47","S75"],"evidenceBoundary":"工作负载建模原则可迁移；示例比例是教学数据，真实比例必须来自脱敏生产 Trace 或业务预测。"},{"id":"TD-AP04","moduleId":"TD-M11","order":56,"title":"设计 Trace 与数据模型：让一次慢任务可下钻","type":"参考","status":"desk-researched","duration":"60 分钟","summary":"用一次 task 一个根 Trace、模型/工具/检索/队列为子 Span 的结构，把质量、性能和成本放在同一证据链。","why":"只有最终延迟和日志文本时，无法回答慢在排队、模型、工具还是重试。结构化 Trace 是压测诊断、线上监控和离线评测复用同一证据的基础。","prerequisites":["TD-AP03"],"outcomes":["设计 Agent Span 树","定义低基数指标与高维 Trace 的边界","写出可关联的结果表结构"],"artifact":"Agent 可观测性 Schema","blocks":[{"title":"一条任务 Trace 应该长什么样","body":["OpenTelemetry GenAI 约定正在快速演进，推荐采用通用 OTel 字段并把供应商字段放入命名空间。根 Span 表示 invoke_agent，子 Span 表示 generation、tool、retrieval、handoff 和状态读写。"],"code":"invoke_agent task_id=... workflow.version=v12\n├─ queue.wait duration_ms=...\n├─ gen_ai.chat model=... input_tokens=... output_tokens=...\n├─ execute_tool tool.name=order_lookup retry=0\n├─ gen_ai.chat model=...\n├─ execute_tool tool.name=refund idempotency_key=...\n└─ task.finalize terminal_state=refunded success=true"},{"title":"Span、Metric、Log 各自负责什么","body":["Metric 用于低成本聚合和告警；Trace 用于单任务因果下钻；Log 记录离散事件和调试上下文。不要把 user_id、prompt 全文或 task_id 作为 Prometheus 标签，否则会制造高基数与隐私风险。"],"table":{"headers":["信号","适合","不适合"],"rows":[["Metric","速率、分位数、错误预算、资源","高基数 task_id 与完整输入"],["Trace","跨模型/工具关键路径、重试和因果","无限期保存全部敏感正文"],["Log","错误事件、审计和调试","代替结构化耗时聚合"]]}},{"title":"最小字段集必须支持五类问题","body":["字段设计从问题反推：哪个版本、哪类任务、慢在哪一步、为什么重试、成本如何产生。输入正文默认不采集；需要调试时使用哈希、脱敏摘要或受控采样。"],"table":{"headers":["实体","关键字段"],"rows":[["task_run","task_id, trace_id, task_type, workflow_version, started_at, terminal_state, success"],["span","span_id, parent_span_id, kind, dependency, start/end, status, error_type"],["generation","model, prompt_version, input/output_tokens, ttft_ms, finish_reason"],["tool_call","tool_name, attempt, timeout_ms, idempotency_key_hash, side_effect"],["evaluation","quality_score, policy_pass, trajectory_pass, scorer_version"],["cost","price_version, estimated_cost, currency"]]}},{"title":"用关键路径而不是简单相加定位 E2E","body":["并行工具调用的耗时不能全部相加。先按 parent-child 和时间戳重建关键路径，再计算 queue、model、tool、orchestration overhead。若 E2E 大于关键路径各段之和，差额通常来自调度、序列化、网络或未埋点等待。"],"expected":"选一条 p99 慢 Trace，能指出关键路径、重试分支、最长依赖和未归因时间，而不是只说‘模型慢’。"},{"title":"隐私与采样是设计的一部分","body":["Prompt、检索文档和工具参数可能含 PII、密钥或业务机密。生产默认保存长度、哈希、版本和分类标签；错误或慢请求可提高 Trace 采样率，但正文访问需要权限、保留期和审计。"],"warning":"不要为了可观测性把 Authorization、原始用户输入或完整工具结果写入公开日志。"}],"practice":["为一条 Agent 任务画根 Span 与子 Span","将当前日志字段分配到 Metric/Trace/Log","从一条慢 Trace 计算未归因时间"],"completion":["Trace 能跨入口、模型、工具和终态关联","指标标签无 task_id 等高基数字段","敏感字段有默认关闭、采样和保留策略"],"sourceIds":["S49","S70","S71","S72","S80"],"evidenceBoundary":"OTel GenAI 语义约定仍在演进，落地前需锁定版本并做兼容层；Schema 示例不是法规合规意见。"},{"id":"TD-AP05","moduleId":"TD-M11","order":57,"title":"搭建压测架构：发压、夹具、观测、判定四层分离","type":"概念","status":"desk-researched","duration":"50 分钟","summary":"设计可替换真实模型或离线夹具的测试架构，并按测试对象选择 k6、AIPerf、Trace 平台和自定义校验器。","why":"没有分层架构时，团队常用一个 HTTP 发压工具承担任务生成、业务判定、模型指标和诊断，最后只能得到吞吐曲线，无法验证 Agent 是否正确完成任务。","prerequisites":["TD-AP04"],"outcomes":["设计四层压测架构","按对象选工具而不是找万能工具","隔离副作用并保存版本证据"],"artifact":"Agent 压测系统架构图","blocks":[{"title":"四层架构各自只有一个责任","body":["发压层控制到达模式；被测与夹具层提供真实/模拟依赖；观测层收集指标和 Trace；判定层把质量、延迟、成本和安全条件合成门禁。它们通过 run_id、task_id 和版本 Manifest 关联。"],"code":"workload driver ──task──> Agent gateway ──> queue/orchestrator\n      │                         ├─> model endpoint/fixture\n      │                         └─> tools/sandbox fixtures\n      └─ run manifest           └─> OTel collector ─> metrics/traces\n                                             └─> evaluator ─> gate report"},{"title":"工具按层组合","body":["k6 擅长 HTTP 场景、阈值和开闭环负载；AIPerf/GenAI-Perf 专注模型端点 Token 与延迟；vLLM 暴露服务内部调度指标；OpenTelemetry 贯通 Agent Trace；Phoenix、Langfuse 或 LangSmith 可承载追踪与评测。工具文档证明功能存在，不证明它适合你的规模。"],"table":{"headers":["任务","候选工具","必须补的能力"],"rows":[["入口/API 负载","k6/Locust/JMeter","任务终态轮询与业务 Oracle"],["模型端点","AIPerf/GenAI-Perf","Agent 工具链和终态"],["服务内部","vLLM metrics/Prometheus","端到端用户任务"],["跨步骤追踪","OpenTelemetry + Phoenix/Langfuse/LangSmith","负载生成和容量判定"],["质量判定","自定义 evaluator/Promptfoo/DeepEval","系统资源与排队"]]}},{"title":"测试环境必须保护真实副作用","body":["所有写工具先走沙箱；每个调用携带幂等键；夹具要模拟延迟、错误码、429 和超时，而不只是永远成功。对真实外部模型压测前确认额度、限流政策和费用上限。"],"bullets":["run_id 隔离测试数据和清理范围","工具权限最小化，禁止真实付款/群发","全局预算：最大任务数、Token、费用和运行时长","失败即停：错误放大、队列失控或预算接近上限"]},{"title":"每次运行都生成 Manifest","body":["没有版本记录的两次压测不可比较。Manifest 至少包含代码提交、workflow/prompt/model/tool schema、workload、价格、环境、资源规格、限流和阈值版本。"],"code":"run_id: ap-load-20260810-001\nworkflow_version: refund-agent-v12\nworkload_version: workload-v3\nmodel_endpoint: fixture-v1\ntool_schema_version: tools-v8\nthreshold_version: slo-v4\nprice_version: 2026-08-10\nseed: 42"}],"practice":["画出四层架构和数据流","为每层选择一个工具并写明缺口","列出所有有副作用的工具及隔离方案"],"completion":["架构能替换真实依赖与夹具","判定层同时检查质量、性能、成本和安全","每次运行可由 Manifest 回放"],"sourceIds":["S52","S67","S70","S77","S78","S79"],"evidenceBoundary":"工具能力来自官方文档或项目仓库；没有在目标企业网络、数据量和合规环境中完成对比基准。"},{"id":"TD-AP06","moduleId":"TD-M11","order":58,"title":"执行完整压测 SOP：基线、变坏、修复、容量","type":"跟做","status":"fixture-tested","duration":"75 分钟","summary":"运行离线 Agent 压测夹具，亲眼看到重试风暴如何让排队、p95、成本和 Goodput 同时恶化，再用预算与退避修复。","why":"看懂指标不等于能验证系统。这个实验强制经历绿色基线、故障注入红灯和修复复跑，证明门禁真的能发现问题。","prerequisites":["TD-AP05"],"outcomes":["执行三阶段压测","读取 JSONL Trace 和汇总报告","用证据解释门禁为何红/绿"],"artifact":"三阶段 Agent 压测证据包","blocks":[{"title":"实验测什么","body":["离线脚本模拟订单处置 Agent 的模型和工具步骤。retry-storm 场景提高工具失败率并允许激进重试；repaired 场景加入重试预算、退避和队列保护。随机种子固定，因此结果可复现。"],"bullets":["任务层：成功率、E2E p95、Goodput","链路层：queue p95、model/tool calls、重试放大","成本层：总成本、每成功任务成本","门禁：质量、延迟、成本和放大系数同时满足"]},{"title":"第一步：运行健康基线","body":["在发布包根目录执行："],"code":"python3 courses/td-ai-010-agent-load-stability/lab/agent_load_lab.py \\\n  --config courses/td-ai-010-agent-load-stability/lab/configs/baseline.json \\\n  --output courses/td-ai-010-agent-load-stability/evidence/baseline","expected":"退出码 0；gate_pass=true。报告包含 summary.json 和 traces.jsonl。"},{"title":"第二步：注入重试风暴","body":["坏版本应该稳定失败；非零退出码是预期证据。"],"code":"python3 courses/td-ai-010-agent-load-stability/lab/agent_load_lab.py \\\n  --config courses/td-ai-010-agent-load-stability/lab/configs/retry-storm.json \\\n  --output courses/td-ai-010-agent-load-stability/evidence/retry-storm","expected":"退出码 1；至少 retry_amplification、task_success_rate、e2e_p95_ms 或 cost_per_success 超限。"},{"title":"第三步：应用保护并复跑","body":["修复不是删除阈值，而是限制重试、加入退避并在队列压力下拒绝或降级。"],"code":"python3 courses/td-ai-010-agent-load-stability/lab/agent_load_lab.py \\\n  --config courses/td-ai-010-agent-load-stability/lab/configs/repaired.json \\\n  --output courses/td-ai-010-agent-load-stability/evidence/repaired","expected":"退出码 0；gate_pass=true。与坏版本相比，调用放大、排队和单位成功成本下降。"},{"title":"第四步：按固定顺序读报告","body":["先确认 workload 与版本相同，再看任务正确率和 Goodput，然后看 E2E/queue 分位数，再下钻 model/tool/retry，最后看资源和成本。不能先看到 CPU 不高就宣布系统健康。"],"warning":"故障场景失败是测试通过；如果坏版本也绿，说明阈值、负载或故障注入没有检测力。"}],"practice":["完成 baseline → retry-storm → repaired","从 traces.jsonl 找出一条重试最多的任务","修改一个阈值并解释它会防止哪类业务损失"],"completion":["三次运行退出码为 0/1/0","报告保留相同 seed 和 workload","能用 Trace 解释红灯而不是只引用总分"],"sourceIds":["S47","S48","S67","S68","S69","S70","S72","S75"],"evidenceBoundary":"已运行确定性离线模拟器，证明采集、聚合和门禁机制；不调用真实模型、真实工具，也不代表生产容量。"},{"id":"TD-AP07","moduleId":"TD-M11","order":59,"title":"诊断压测失败：从症状反推瓶颈与反馈环","type":"诊断","status":"desk-researched","duration":"60 分钟","summary":"用队列、TTFT、ITL、工具耗时、放大系数和资源信号区分容量不足、长上下文、工具慢、重试风暴与 Agent 循环。","why":"‘p95 变差’只是症状。错误归因会导致盲目加机器、降低阈值或增加重试，反而扩大成本和故障。","prerequisites":["TD-AP06"],"outcomes":["按症状树定位根因候选","识别协调遗漏和重试反馈环","设计一次只改一个变量的验证实验"],"artifact":"性能故障诊断记录","blocks":[{"title":"先做相关，再做因果验证","body":["把失败窗口与健康窗口按相同 workload 比较，定位从哪一层开始偏移。Trace 只能提供强线索；通过控制变量、依赖夹具或资源隔离复跑，才能提高因果置信度。"],"table":{"headers":["症状组合","优先假设","下一步验证"],"rows":[["queue↑, TTFT↑, GPU高","模型容量/调度饱和","固定长度，降低到达率或增加副本"],["TTFT↑, 输入Token↑, queue平","长上下文 Prefill","按长度桶比较并裁剪上下文"],["ITL↑, queue平, GPU高","Decode 竞争","固定输出长度与并发"],["tool p95↑, retries↑, model平","工具依赖慢并触发重试","夹具固定工具延迟/错误率"],["step count↑, tool/model均平","Agent 循环或路由退化","对比 workflow/prompt 与轨迹"],["入口RPS平, 内部calls↑","调用放大/重试风暴","限制 attempts 并观察恢复"]]}},{"title":"避免 Coordinated Omission","body":["固定并发压测中，系统越慢，客户端完成越少，实际到达率随之下降。这会漏记用户本应在等待期间继续到达的请求。用开环到达率、记录计划发送时间，并报告队列等待，才能看见真实过载。"],"expected":"同一系统用闭环和开环各跑一次；若闭环 p95 较好但吞吐下降，不能据此宣称容量更高。"},{"title":"重试必须有总预算","body":["单层 3 次重试看似合理；如果网关、Agent、SDK 和工具各重试 3 次，最坏尝试数会乘法增长。优先让最接近失败的一层重试，并遵守 Retry-After 或指数退避加抖动。失败请求也消耗限流额度和费用。"],"code":"retry_budget_per_task: 2\nmax_total_task_ms: 12000\nrespect_retry_after: true\nbackoff: exponential_with_jitter\nretryable: [429, 502, 503]\nnon_retryable: [400, 401, 403, policy_violation]"},{"title":"修复顺序：止血、定位、容量、长期预防","body":["先停止放量并限制反馈环；再用 Trace 定位；然后选择扩容、缓存、裁剪上下文、并行工具、超时预算或降级；最后把事故样例加入 workload 和回归门禁。"],"warning":"增加无限队列只会把错误变成更长等待；增加无限重试只会把局部失败变成全局过载。"}],"practice":["从 retry-storm 报告写出三条证据链","设计一个控制变量实验排除错误假设","画出网关、SDK、Agent、工具四层重试乘法"],"completion":["诊断区分症状、假设和验证","没有用平均延迟掩盖尾部","修复没有删除质量或成本门禁"],"sourceIds":["S48","S51","S57","S67","S68","S75"],"evidenceBoundary":"诊断树基于公开指标语义与 SRE 机制，是优先级启发式；真实根因仍需目标系统 Trace、资源和变更证据。"},{"id":"TD-AP08","moduleId":"TD-M11","order":60,"title":"把压测接入生产：SLO、告警、降级与 Runbook","type":"项目","status":"desk-researched","duration":"75 分钟","summary":"把一次性压测结果转成线上稳定性体系：多维 SLO、错误预算、分层告警、自动保护和可执行 Runbook。","why":"上线前压测只能证明某个环境、版本和工作负载下的表现。模型、Prompt、工具、流量和价格持续变化，生产必须持续监测质量、性能、成本与轨迹。","prerequisites":["TD-AP07"],"outcomes":["定义多维 Agent SLO","设计症状告警与原因面板","写出限流、熔断、降级和回滚 Runbook"],"artifact":"Agent 生产稳定性方案","blocks":[{"title":"SLO 以用户任务为中心","body":["建议把可用性定义为‘任务正确完成且满足时延、成本和安全预算’，并为高风险切片单独设 SLO。模型调用 99.9% 可用不能替代业务任务 SLO。"],"code":"Task SLI = good_tasks / eligible_tasks\ngood_task = correct_terminal_state\n         && e2e_ms \u003c= latency_budget(task_type)\n         && cost \u003c= cost_budget(task_type)\n         && policy_pass\n         && no_duplicate_side_effect"},{"title":"告警先报用户症状，再关联原因","body":["Page 级告警用于需要立即行动的用户症状或错误预算快速燃烧；资源、TTFT、队列和工具延迟进入原因面板，除非它们本身有明确处置。使用快慢两个窗口可兼顾突发和持续劣化。"],"table":{"headers":["级别","信号","触发示例","动作"],"rows":[["P1","高风险任务错误/重复副作用","任何确认事件或快速燃烧","停止写工具、回滚/切人工"],["P2","Task SLO/Goodput","5m 与 1h 窗口同时超预算","停止放量、启用降级"],["诊断","queue/TTFT/tool/retry/cost","与症状窗口关联","定位容量或依赖"],["趋势","成本、长度、步骤漂移","日/周趋势异常","容量和 Prompt/流程优化"]]}},{"title":"保护机制必须提前设计终态","body":["限流、队列上限、超时、熔断、负载削减和降级不是简单返回错误。对 Agent 要定义：哪些任务可拒绝、哪些改成只读、哪些切小模型、哪些进入人工队列，以及已执行副作用如何补偿。"],"bullets":["入口：token bucket/并发配额，返回可重试信息","Agent：最大步骤、最大模型调用、总时长和总费用","依赖：每工具 timeout、circuit breaker、bulkhead","降级：关闭非关键工具、缩短上下文、切只读或人工","恢复：逐级放量，不在依赖刚恢复时瞬间重放全部积压"]},{"title":"Runbook 必须能由当班人员执行","body":["每条告警链接到：影响判定、首查面板、三条安全止血动作、回滚条件、数据查询、负责人和复盘资产。把一条真实慢 Trace 的查找命令写进去，而不是只写‘联系研发排查’。"],"code":"alert: agent_goodput_burn_rate\ncheck:\n  - compare task_type/workflow_version/model_version\n  - inspect queue_p95, retry_amplification, dependency_p95\n  - open 3 slow/error trace_ids\nmitigate:\n  - freeze rollout\n  - cap retries and queue\n  - route risky write tasks to human\nrecover:\n  - verify 3 healthy windows\n  - canary 5% -> 25% -> 100%\npostmortem:\n  - add incident trace to workload and regression gate"},{"title":"形成发布前后闭环","body":["离线压测发现容量边界，预发布复跑候选版本，线上 SLO 发现分布漂移，事故 Trace 回流为新切片。四者共用指标字典、Trace Schema、workload 版本和门禁定义，才能避免压测与监控各说各话。"],"expected":"最终方案能从一条线上告警追溯到 Trace、版本、离线回归样例和负责人。"}],"practice":["定义一个高风险和一个普通任务 SLO","为重试风暴写告警与三步止血 Runbook","把实验中的坏 Trace 加入回归 workload"],"completion":["SLO 分母和 good task 条件明确","告警对应具体人和动作","降级不会扩大权限或重复副作用","事故能回流为可复现回归"],"sourceIds":["S47","S48","S70","S71","S75","S76"],"evidenceBoundary":"SLO 与 Runbook 模板来自通用 SRE 和 GenAI 可观测性实践；业务影响等级、阈值、值班责任和合规要求必须由组织确认。"}],"sourceNotes":{"S01":{"title":"Playwright Test Agents","url":"https://playwright.dev/docs/test-agents"},"S02":{"title":"Playwright Release Notes","url":"https://playwright.dev/docs/release-notes"},"S03":{"title":"Promptfoo Introduction","url":"https://www.promptfoo.dev/docs/intro/"},"S04":{"title":"DeepEval Introduction","url":"https://deepeval.com/docs/introduction"},"S05":{"title":"OpenAI Evals","url":"https://github.com/openai/evals"},"S06":{"title":"Inspect AI","url":"https://inspect.aisi.org.uk/"},"S07":{"title":"NIST AI RMF Core","url":"https://airc.nist.gov/airmf-resources/airmf/5-sec-core/"},"S08":{"title":"OWASP Top 10 l":"https://owasp.org/www-project-application-security-verification-standard/"},"S51":{"title":"vLLM Production Metrics","url":"https://docs.vllm.ai/en/latest/design/metrics/"},"S52":{"title":"NVIDIA GenAI-Perf","url":"https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/perf_benchmark/genai-perf-README.html"},"S53":{"title":"Triton Inference Server Metrics","url":"https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/user_guide/metrics.html"},"S54":{"title":"Prometheus Histograms and Summaries","url":"https://prometheus.io/docs/practices/histograms/"},"S55":{"title":"OpenAI Latency Optimization","url":"https://developers.openai.com/api/docs/guides/latency-optimization"},"S56":{"title":"OpenAI Streaming Responses","url":"https://developers.openai.com/api/docs/guides/streaming-responses"},"S57":{"title":"OpenAI Rate Limits","url":"https://developers.openai.com/api/docs/guides/rate-limits"},"S58":{"title":"2025 DORA Report","url":"https://dora.dev/research/2025/dora-report/"},"S59":{"title":"How Google SRE uses agentic AI","url":"https://cloud.google.com/blog/products/devops-sre/how-google-sre-is-using-agentic-ai-to-improve-operations/"},"S60":{"title":"Principles of Chaos Engineering","url":"https://principlesofchaos.org/"},"S61":{"title":"HTTP Semantics RFC 9110","url":"https://www.rfc-editor.org/rfc/rfc9110.html"},"S62":{"title":"WCAG 2.2","url":"https://www.w3.org/TR/WCAG22/"},"S63":{"title":"TMMi Model","url":"https://www.tmmi.org/tmmi-model/"},"S64":{"title":"ISO/IEC 42001 AI management systems","url":"https://www.iso.org/standard/42001"},"S65":{"title":"NIST Generative AI Profile","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"},"S66":{"title":"OpenAI Structured Outputs","url":"https://developers.openai.com/api/docs/guides/structured-outputs"},"S67":{"title":"NVIDIA AIPerf Metrics Reference","url":"https://docs.nvidia.com/aiperf/reference/ai-perf-metrics-reference"},"S68":{"title":"NVIDIA AIPerf Arrival Patterns","url":"https://docs.nvidia.com/aiperf/dev/tutorials/load-patterns-scheduling/arrival-patterns-simulating-realistic-traffic"},"S69":{"title":"vLLM Per-request Metrics","url":"https://docs.vllm.ai/en/latest/features/per_request_metrics/"},"S70":{"title":"OpenTelemetry GenAI Semantic Conventions","url":"https://opentelemetry.io/docs/specs/semconv/gen-ai/"},"S71":{"title":"OpenTelemetry GenAI Observability","url":"https://opentelemetry.io/blog/2026/genai-observability/"},"S72":{"title":"OpenAI Agents SDK Tracing","url":"https://openai.github.io/openai-agents-python/tracing/"},"S73":{"title":"OpenAI Agents SDK Usage","url":"https://openai.github.io/openai-agents-python/usage/"},"S74":{"title":"LangSmith Trajectory Evaluations","url":"https://docs.langchain.com/langsmith/trajectory-evals"},"S75":{"title":"Google SRE: Handling Overload","url":"https://sre.google/sre-book/handling-overload/"},"S76":{"title":"Google SRE: Service Best Practices","url":"https://sre.google/sre-book/service-best-practices/"},"S77":{"title":"k6 Scenarios","url":"https://grafana.com/docs/k6/latest/using-k6/scenarios/"},"S78":{"title":"Arize Phoenix","url":"https://github.com/arize-ai/phoenix"},"S79":{"title":"Langfuse Open Source","url":"https://langfuse.com/handbook/chapters/open-source"},"S80":{"title":"OpenTelemetry GenAI Attribute Registry","url":"https://opentelemetry.io/docs/specs/semconv/registry/attributes/gen-ai/"}}};const DATA=COURSE_DATA;
const statusLabel={planned:"待开发","desk-researched":"资料已审","fixture-tested":"实验已跑"};
const esc=(v)=>String(v??"").replace(/[&<>\"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#39;"}[c]));
const completed=()=>JSON.parse(localStorage.getItem("career-ai-completed")||"[]");
const currentId=()=>{const id=location.hash.slice(1);return DATA.pages.some(p=>p.id===id)?id:"TD-F01"};
function go(id){location.hash=id;window.scrollTo({top:0,behavior:"smooth"});document.getElementById("side").classList.remove("open")}
function updateProgress(){const done=completed();const count=done.filter(id=>DATA.firstUsablePath.includes(id)).length;document.getElementById("progressText").textContent="专业主路径已完成 "+count+"/"+DATA.firstUsablePath.length;document.getElementById("progress-bar").style.width=(count/DATA.firstUsablePath.length*100)+"%"}
function renderNav(){const q=document.getElementById("tutorial-search").value.trim().toLowerCase();const current=currentId();const done=completed();let out="";for(const m of DATA.modules){const group=DATA.pages.filter(p=>p.moduleId===m.id&&(!q||(p.id+" "+p.title+" "+p.summary+" "+p.artifact).toLowerCase().includes(q)));if(!group.length)continue;out+="<section><h3>"+esc(m.title)+"</h3><p>"+esc(m.subtitle)+"</p>"+group.map(p=>"<button data-id=\""+esc(p.id)+"\" class=\""+(p.id===current?"active":"")+"\"><span class=num>"+String(p.order).padStart(2,"0")+"</span><span><b>"+esc(p.title)+"</b><small>"+esc(p.type)+" · "+statusLabel[p.status]+"</small></span><i class=\"dot "+(done.includes(p.id)?"done":p.status)+"\"></i></button>").join("")+"</section>"}document.getElementById("course-nav").innerHTML=out;document.querySelectorAll("#course-nav button").forEach(b=>b.onclick=()=>go(b.dataset.id))}
function render(){const p=DATA.pages.find(x=>x.id===currentId())||DATA.pages[0];const m=DATA.modules.find(x=>x.id===p.moduleId);const idx=DATA.pages.findIndex(x=>x.id===p.id);let body="<div class=crumb>"+esc(m.title)+" › "+esc(p.id)+"</div><div class=meta><span>"+statusLabel[p.status]+"</span><span>"+esc(p.type)+"</span><span>"+esc(p.duration)+"</span><span>更新于 2026-08-10</span></div><h1>"+esc(p.title)+"</h1><p class=lead>"+esc(p.summary)+"</p>";
if(p.status==="planned"){body+="<section class=planned><div class=eyebrow>没有冒充完成</div><h2>知识位置已确定，正文尚未达到交付门禁</h2><p>"+esc(p.why)+"</p><p><b>学完应当能够：</b>"+esc(p.outcomes[0])+"</p><p><b>目标产物：</b>"+esc(p.artifact)+"</p><p><b>证据边界：</b>"+esc(p.evidenceBoundary)+"</p></section>"}else{body+="<section class=outcomes><div><b>本页完成后</b><ul>"+p.outcomes.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div><div><b>你会带走</b><br><strong>"+esc(p.artifact)+"</strong></div></section><section class=why><b>为什么需要这一页</b><p>"+esc(p.why)+"</p></section>";
if(p.prerequisites.length)body+="<section class=prereq><b>前置页面</b><div>"+p.prerequisites.map(id=>"<button data-go=\""+esc(id)+"\">"+esc(id)+"</button>").join("")+"</div></section>";
body+=p.blocks.map((b,i)=>"<section class=block><div class=idx>"+String(i+1).padStart(2,"0")+"</div><div><h2>"+esc(b.title)+"</h2>"+b.body.map(x=>"<p>"+esc(x)+"</p>").join("")+(b.bullets?"<ul>"+b.bullets.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":"")+(b.code?"<pre class=code><button data-copy=\""+i+"\">复制</button>"+esc(b.code)+"</pre>":"")+(b.expected?"<div class=expected><b>你应该看到 / 得出</b><p>"+esc(b.expected)+"</p></div>":"")+(b.warning?"<div class=warning><b>别踩这个坑</b><p>"+esc(b.warning)+"</p></div>":"")+"</div></section>").join("");
body+="<section class=practice><div class=eyebrow>轮到你动手</div><h2>练习与迁移</h2><ol>"+p.practice.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol></section><section class=complete><h2>满足这些条件才算学完</h2>"+p.completion.map(x=>"<label><input type=checkbox> "+esc(x)+"</label>").join("")+"<button id=complete>"+(completed().includes(p.id)?"✓ 已标记完成":"标记本页完成")+"</button></section><section class=evidence><h2>证据与边界</h2><p>"+esc(p.evidenceBoundary)+"</p><div class=sources>"+p.sourceIds.filter(id=>DATA.sourceNotes[id]).map(id=>"<a target=_blank rel=noreferrer href=\""+esc(DATA.sourceNotes[id].url)+"\"><b>"+id+"</b>"+esc(DATA.sourceNotes[id].title)+"</a>").join("")+"</div></section>"}
body+="<nav class=pager>"+(idx>0?"<button data-go=\""+DATA.pages[idx-1].id+"\">← 上一页<br><b>"+esc(DATA.pages[idx-1].title)+"</b></button>":"<span></span>")+(idx<DATA.pages.length-1?"<button data-go=\""+DATA.pages[idx+1].id+"\">下一页 →<br><b>"+esc(DATA.pages[idx+1].title)+"</b></button>":"")+"</nav>";document.getElementById("tutorial-content").innerHTML=body;
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(p.blocks[Number(b.dataset.copy)].code));const cb=document.getElementById("complete");if(cb)cb.onclick=()=>{let d=completed();d=d.includes(p.id)?d.filter(x=>x!==p.id):d.concat(p.id);localStorage.setItem("career-ai-completed",JSON.stringify(d));renderAll()}}
function renderAll(){const delivered=DATA.pages.filter(p=>p.status!=="planned").length;document.getElementById("stats").innerHTML="<span><b>"+delivered+"</b> 已交付</span><span><b>"+(DATA.pages.length-delivered)+"</b> 待开发</span>";updateProgress();renderNav();render()}
document.getElementById("tutorial-search").oninput=renderNav;document.getElementById("menu").onclick=()=>document.getElementById("side").classList.toggle("open");window.addEventListener("hashchange",renderAll);renderAll();
</script></body></html>
