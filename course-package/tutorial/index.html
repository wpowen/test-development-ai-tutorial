<script>const COURSE_DATA={"firstUsablePath":["TD-AP01","TD-AP02","TD-AP03","TD-AP04","TD-AP05","TD-AP06","TD-AP07","TD-AP08"],"modules":[{"id":"TD-M00","title":"完整测试生命周期","subtitle":"从需求、策略、设计、执行到发布与生产反馈，先建立专业测试骨架"},{"id":"TD-M08","title":"传统测试专项","subtitle":"接口、集成、UI、数据、性能、稳定性、安全、可观测性和混沌工程"},{"id":"TD-M01","title":"大模型与 AI 系统基础","subtitle":"理解模型如何运行，以及 Token、Context、RAG、Tool 和 Agent 为什么会失败"},{"id":"TD-M02","title":"AI 帮你做传统测试","subtitle":"用 AI 提效，但必须证明生成结果有检测力"},{"id":"TD-M09","title":"AI 接口、性能与可靠性","subtitle":"测试流式协议、结构化输出、TTFT、TPOT、Goodput、容量、限流、重试和降级"},{"id":"TD-M03","title":"测试 LLM 和 RAG","subtitle":"把概率性回答变成可重复、可审计的质量证据"},{"id":"TD-M04","title":"测试 Agent、Worker 与 Workflow","subtitle":"检查轨迹、状态、工具、权限、Handoff、副作用和自愈风险"},{"id":"TD-M05","title":"建设 AI 质量系统","subtitle":"把评测接入 CI、生产反馈、版本与回滚体系"},{"id":"TD-M06","title":"Benchmark 与分数工程","subtitle":"弄清数据、协议、Scorer、聚合、污染和榜单分数如何产生"},{"id":"TD-M07","title":"专业专题与 Capstone","subtitle":"按岗位路线组合工件，交付端到端 AI Quality Engineering 系统"},{"id":"TD-M10","title":"职业演进","subtitle":"从测试执行转向质量信号、评测工程、平台工程与生产可靠性"},{"id":"TD-M11","title":"Agent 性能与稳定性工程","subtitle":"从工作负载、指标、Trace、容量压测到生产 SLO、告警与故障处置"}],"pages":[{"id":"TD-F01","moduleId":"TD-M00","order":1,"title":"先把传统测试开发这份工作拆开","type":"概念","status":"outlined","duration":"30 分钟","summary":"从研发测试流程、测试方法、自动化工具链、工件和发布责任出发，建立进入 AI 时代之前的职业基线。","why":"如果不先知道测试开发原本负责什么，就无法判断 AI 真正在改变哪一步，也无法分辨“效率提高”与“质量责任被偷偷丢掉”。","prerequisites":[],"outcomes":["画出需求到生产反馈的测试生命周期","区分方法、工具、工件和质量决策","找出自己进入 AI 课程前需要补齐的传统能力"],"artifact":"传统测试开发能力与工件地图","blocks":[{"title":"测试开发不是写用例，而是把风险变成证据","body":["测试开发的核心工作链路通常是：理解需求和系统 → 识别风险 → 选择测试策略 → 设计 Oracle 和数据 → 实现并执行检查 → 诊断失败 → 支持发布 → 把线上问题变成回归资产。自动化只是其中一段，不是全部职业价值。","AI 时代仍然保留这条主线。变化的是被测对象增加了模型、Prompt、知识库、检索器、工具、Agent 状态和评测器；如果原有风险、Oracle 和发布责任不清楚，增加 AI 只会放大不确定性。"]},{"title":"把工作拆成五类，不要按工具品牌拆","body":["用五类对象检查自己的职业基线。工具会更新，但这些对象长期稳定。"],"bullets":["流程：需求评审、设计、开发、测试、发布、监控和复盘如何衔接","方法：风险驱动、等价类、边界、状态、组合、属性、探索式和 Mutation","工件：测试策略、追踪矩阵、用例、Fixture、自动化代码、Trace、缺陷和发布报告","系统：API、UI、数据库、消息、第三方依赖、CI、日志与可观测性平台","决策：谁定义质量、谁批准放行、谁接受 Waiver、谁决定回滚"]},{"title":"AI 进入后，传统能力怎样迁移","body":["不是每项旧能力都会被替代。更常见的是原则保留，但输入、失败和证据扩展。"],"bullets":["固定断言 → 组合 Oracle：确定性规则、语义评分、模型 Judge 和人工审核","测试数据 → Eval dataset：增加风险切片、来源、版本、Holdout、污染和漂移","UI/API 自动化 → Agent/Workflow：增加工具、参数、状态、权限、重试、Handoff 和副作用","CI Pass/Fail → AI Quality Gate：增加模型、Prompt、数据、Scorer、统计波动、成本和 Waiver","日志诊断 → AI Trace：增加检索文档、Tool call、Token、Judge、延迟和完整轨迹"],"warning":"如果课程只教你使用一个 AI 工具，却不说明它改变了哪项职业责任，就不是完整的测试开发能力迁移。"},{"title":"做一次入场能力检查","body":["选择一个你熟悉的普通业务流程，例如登录、下单或退款。写出三条业务风险、对应测试数据、主要 Oracle、自动化入口和发布结论。再说明如何注入一个产品缺陷，使测试稳定变红。","如果只能写出测试步骤，却写不出风险、Oracle、证据和失败注入，先补传统测试基础；可以免听概念，但不能免交这个工件。"],"expected":"你应得到一张可审计地图：每条风险都连接到输入、测试、Oracle、证据和责任人。"}],"practice":["选一个真实但可脱敏的业务流程，画出需求到生产反馈的生命周期","列出至少五种当前测试工具，并把它们归回流程、方法或工件","设计一个 Mutation，证明现有测试真的有检测力"],"completion":["能解释测试开发的价值为什么不等于写用例","已经提交一张传统能力与工件地图","至少一个预埋缺陷能让测试稳定失败"],"sourceIds":["S23","S24","S32"],"evidenceBoundary":"本页重建职业与方法基线；O*NET、ISTQB 和生产 ML 质量研究只能支持通用结构，不能替代目标企业自己的流程、岗位分工和发布政策。"},{"id":"TD-P01","moduleId":"TD-M00","title":"需求文档解析：从自然语言变成可追踪的质量条件","type":"跟做","duration":"45 分钟","summary":"把 PRD、原型、接口契约和业务规则拆成实体、规则、状态、异常、非功能约束与待确认问题，并建立需求到测试证据的追踪关系。","why":"AI 可以快速摘要和生成候选用例，但若输入缺少版本、规则冲突和验收口径，它只会更快地产生看似完整的错误。需求测试的专业价值是发现歧义、遗漏和不可验证条件。","prerequisites":["TD-F01"],"outcomes":["识别需求中的规则、状态、角色和异常","建立需求—风险—测试—证据追踪","用 AI 辅助解析但保留人工决策与引用"],"artifact":"需求解析表、问题清单与双向追踪矩阵","blocks":[{"title":"先固定输入，再调用 AI","body":["保存 PRD 版本、原型链接、OpenAPI/事件 Schema、历史缺陷和业务术语表。把每段需求赋予稳定编号，AI 的每条结论必须引用输入段落，不能只给一份无出处摘要。","测试人员先定义输出结构：业务实体、角色权限、前置条件、状态转换、主流程、异常、边界、非功能要求和待确认项。"],"bullets":["版本与生效时间","规则来源和责任人","显式需求与推断分开","冲突、缺失、不可测试表述单独列出"]},{"title":"让 AI 生成候选，不让它替你批准","body":["可让模型按固定 Schema 提取规则并生成澄清问题，但每一条必须回链到需求 ID。没有证据的内容标记 inference，不得进入已确认验收标准。"],"code":"任务：解析以下需求片段。\n输出：requirement_id、rule、precondition、state_change、exception、nfr、source_quote、confidence、question。\n约束：不得补写原文没有的政策；冲突项单独输出。","expected":"结果中每条规则都有 requirement_id 和来源；无来源建议被标为推断或问题，而不是事实。"},{"title":"从规则形成追踪矩阵","body":["每个需求连接业务风险、测试层级、测试 ID、Oracle、数据、自动化位置和执行证据。正向追踪防止需求未测试，反向追踪防止无依据用例和重复资产。"],"bullets":["功能正确性与状态不变量","权限、审计与敏感数据","性能、容量和可用性","依赖失败、补偿与回滚"]},{"title":"用变更做影响分析","body":["需求更新时，不要重写所有用例。让 AI 对比版本并提出受影响规则、测试和数据，再由测试人员依据追踪矩阵确认。高风险变化必须生成新增或修改后的证据计划。"],"warning":"AI 解析结果没有 source ID、版本和待确认项时，不得直接生成发布用例。"}],"practice":["选一页真实脱敏 PRD，生成至少 10 条结构化规则","找出 3 个歧义或冲突并形成澄清问题","完成 5 条需求到证据的双向追踪"],"completion":["所有结论能回到输入版本和段落","推断没有冒充已确认需求","至少一个变更能定位受影响测试与证据"],"sourceIds":["S41","S42","S43"],"evidenceBoundary":"本页流程依据标准测试过程与契约规范综合；AI 解析效果尚未在用户企业的真实 PRD 分布上测量，因此结论必须由需求、研发和测试共同确认。","order":2,"status":"outlined"},{"id":"TD-P02","moduleId":"TD-M00","title":"风险策略、测试层级与用例设计","type":"概念","duration":"40 分钟","summary":"把需求风险分配到静态检查、单元、组件、契约、集成、系统、验收和生产验证，避免所有问题都堆给端到端自动化。","why":"专业测试不是用例越多越好，而是在最便宜、最接近根因的位置获得足够证据。AI 生成大量用例很容易掩盖覆盖空洞和维护成本。","prerequisites":["TD-P01"],"outcomes":["按影响与可能性排列风险","为风险选择测试层级和设计技术","定义进入、退出和发布门禁"],"artifact":"风险测试策略与分层覆盖表","blocks":[{"title":"风险决定投入，不是页面数量决定投入","body":["先写失败后果、暴露人群、可发现性、可恢复性和合规影响，再决定深度。高影响且难恢复的支付、权限、数据破坏和 AI 工具副作用，应采用多层 Oracle 与人工批准。"],"bullets":["影响程度","发生可能性","发现难度","恢复成本","合规和声誉"]},{"title":"把问题放在正确层级","body":["规则和状态尽量在单元/组件层证明；消费者—提供者兼容性放在契约层；网络、数据库、消息和第三方协作放在集成层；关键用户旅程保留少量端到端；生产验证关注真实配置、流量和回滚。","每个风险要说明为什么选择该层、由谁维护、失败时能否快速定位。重复覆盖可以存在，但必须服务于不同风险，而不是多个 UI 用例重复证明同一个字段。"]},{"title":"设计技术仍然是 AI 时代的底座","body":["等价类、边界值、决策表、状态转换、组合、属性测试、模型测试和探索式测试不会因为 AI 消失。AI 可根据规则生成候选，但测试人员要检查覆盖模型，并用 mutation 或预埋缺陷证明检测力。"],"expected":"一组高质量测试应能说明覆盖了哪些风险和规则，并能让已知坏版本稳定失败，而不是只展示生成数量。"},{"title":"门禁必须绑定决策","body":["进入条件说明环境、数据和依赖是否就绪；退出条件说明关键风险、缺陷、性能预算和证据完整度；Waiver 要有负责人、期限和补偿；发布后要有监控、回滚和复盘入口。","每个门禁都说明触发后停止什么、谁能批准例外、需要补充哪类证据，避免只有红黄绿颜色却没有行动。"],"warning":"总通过率不能抵消关键权限、数据破坏或安全 blocker。"}],"practice":["为退款流程列出 8 个风险并排序","把每个风险分配到最早可验证层级","设计一个 mutation 证明关键用例有检测力"],"completion":["风险与测试层级一一关联","高风险项有独立 blocker","退出条件能支持真实放行或拒绝决策"],"sourceIds":["S41","S42","S50"],"evidenceBoundary":"风险排序和阈值必须结合目标业务事故成本校准；标准只提供过程框架，不提供可直接复制到所有组织的统一门槛。","order":3,"status":"outlined"},{"id":"TD-P03","moduleId":"TD-M00","title":"测试数据、环境、执行、结果收集与发布闭环","type":"跟做","duration":"50 分钟","summary":"建立从可重放数据和环境 Manifest，到执行证据、失败归因、缺陷、放行、线上反馈和回归沉淀的完整闭环。","why":"用例生成只是中间环节。真正能支撑决策的是同一版本、数据和环境下可重复执行的证据，以及失败能回到日志、Trace、变更和负责人。","prerequisites":["TD-P02"],"outcomes":["构建数据与环境清单","区分测试失败、产品缺陷和基础设施噪声","输出可审计发布报告"],"artifact":"一次可重放执行包与发布结论","blocks":[{"title":"数据和环境都要版本化","body":["记录数据集、随机种子、脱敏策略、账户状态、依赖 Stub、数据库迁移、服务版本、Feature Flag、模型/Prompt/知识库版本和区域。无法固定的外部依赖要声明并通过录制回放或隔离实验处理。"],"code":"run_id: release-2026-08-10-01\ncommit: abc123\ndataset: refund-v7\nenvironment: staging-cn-v12\nflags: refund_agent=true\nmodel: provider/model-snapshot\nknowledge: policy-index-42","expected":"任何失败都能找到本次运行使用的代码、配置、数据、依赖和 AI 版本。"},{"title":"执行不是点开始，而是控制实验","body":["先做 smoke 和环境探针，再按风险并行执行；采集请求、响应、日志、指标、Trace、截图和副作用状态。重试必须标记原始失败，不能把 flaky 隐藏为绿色。"]},{"title":"结果收集要保留原始证据","body":["报告同时展示测试覆盖、关键门禁、失败列表、历史对比、变更范围、环境健康、已知问题和证据链接。聚类和 AI 归因只能作为候选解释，必须能回到原始 Trace、Log 和 Diff。"],"bullets":["产品失败","测试脚本失败","数据/环境失败","第三方依赖失败","非确定性或待复现"]},{"title":"发布结论与生产反馈闭环","body":["明确 Go、No-Go 或有期限 Waiver；记录谁批准、剩余风险、监控指标、灰度范围和回滚触发器。线上事故脱敏后进入回归集，先复现再修复，并验证旧版本失败、新版本通过。"],"warning":"没有运行清单和原始证据的 PASS，不足以支持发布。"}],"practice":["为一次回归创建环境与数据 Manifest","把 5 个失败分成产品、测试、环境、依赖和未知","写一份包含回滚触发器的发布结论"],"completion":["执行包可由另一人重放","每个失败都有原始证据链接","发布结论包含剩余风险、责任人和回滚条件"],"sourceIds":["S41","S42","S48"],"evidenceBoundary":"页面定义审计型执行闭环；不同 CI、可观测平台和组织审批流程需适配，当前站点未连接用户的生产环境。","order":4,"status":"outlined"},{"id":"TD-S01","moduleId":"TD-M08","title":"接口、契约、集成与事件测试","type":"跟做","duration":"45 分钟","summary":"从 HTTP 行为和 OpenAPI Schema，深入到消费者契约、鉴权、幂等、超时、消息顺序、重复投递与分布式一致性。","why":"接口返回 200 只证明一次传输成功。专业接口测试还要验证业务不变量、兼容性、依赖失败和最终状态。AI 接口同样建立在这些基础上。","prerequisites":["TD-P03"],"outcomes":["验证协议与业务契约","设计依赖故障和幂等测试","追踪跨服务与事件终态"],"artifact":"接口与集成风险矩阵","blocks":[{"title":"四层接口检查","body":["传输层检查方法、状态码、Header、超时和编码；Schema 层检查字段、类型、枚举和兼容性；业务层检查权限、状态机、余额和不变量；依赖层检查数据库、缓存、消息和第三方失败。"],"code":"request -> gateway -> service -> db/event -> downstream\nassert: protocol + schema + invariant + side_effect + trace","expected":"一次接口测试既保存请求响应，也能验证数据库、事件或下游产生的真实副作用。"},{"title":"契约测试保护协作边界","body":["OpenAPI 描述提供者契约，消费者驱动契约表达调用方真实依赖。兼容性门禁关注删除字段、收紧类型、改变枚举语义、默认值和错误结构；契约通过仍不能替代业务集成测试。"]},{"title":"分布式失败是专项核心","body":["注入超时、部分成功、重复请求、乱序消息、重复投递、网络分区和依赖降级，检查幂等键、重试边界、补偿、死信和最终一致性。"],"bullets":["at-least-once 重复","超时后服务端已成功","消费者落后和积压","Schema 演进","跨服务 Trace 断裂"]},{"title":"AI 可以生成变体，但 Oracle 来自契约","body":["模型适合从 Schema 生成边界和负向输入、解释变更影响、补充消费者场景；不得自行发明状态语义。生成测试要绑定 OpenAPI/契约版本，并通过预埋破坏性变更验证。"],"warning":"只对 Mock 做断言会验证 Mock 自己，不会证明真实提供者和消费者兼容。"}],"practice":["为一个接口列出协议、Schema、业务和依赖检查","注入一次超时后成功并验证幂等","制造一个破坏性契约变更让门禁失败"],"completion":["不再用 200 代表业务成功","至少覆盖一种重复或乱序","契约版本与测试证据可追踪"],"sourceIds":["S43","S44","S58"],"evidenceBoundary":"OpenAPI、HTTP 和 Pact 支持契约与协议方法；真实一致性、消息语义和补偿策略必须按目标架构实测。","order":5,"status":"outlined"},{"id":"TD-S02","moduleId":"TD-M08","title":"UI、兼容性、可访问性与数据质量","type":"概念","duration":"35 分钟","summary":"把用户界面、浏览器/设备组合、无障碍、数据迁移和分析口径纳入质量体系，而不是只测主路径按钮。","why":"用户体验失败、辅助技术不可用和数据口径错误，经常不会被 API 自动化发现。AI 生成 UI 或自动探索也需要稳定的语义和数据 Oracle。","prerequisites":["TD-S01"],"outcomes":["建立兼容矩阵","设计可访问性人工与自动检查","验证数据契约和迁移不变量"],"artifact":"体验与数据专项检查表","blocks":[{"title":"UI 自动化只保留关键旅程","body":["组件层验证状态和交互，视觉回归检查布局差异，端到端保留关键业务旅程。选择器优先使用角色、标签和稳定测试 ID，避免绑定实现细节。"],"bullets":["键盘与焦点","加载、空、错误和恢复状态","响应式和多语言","视觉差异与动态区域"]},{"title":"兼容性矩阵按用户与风险裁剪","body":["基于流量、客户承诺、OS/浏览器生命周期、设备能力和监管要求选择组合。不要追求所有组合；对关键组合做完整回归，对长尾做 smoke、监控和支持政策。","矩阵要标明浏览器内核、输入方式、屏幕尺寸、网络、语言和账户类型。每次线上兼容事故都应回流，调整代表性组合和支持边界。"]},{"title":"可访问性不能只靠扫描器","body":["自动检查可发现语义、对比度和 ARIA 等问题，但键盘流程、焦点顺序、屏幕阅读器表达和认知负担仍需人工验证。生成式 UI 必须在变化后重复检查。","缺陷报告要描述受影响用户、操作路径、预期语义和辅助技术环境，而不是只贴一个规则编号。"],"warning":"自动无障碍扫描通过不等于符合全部用户体验。"},{"title":"数据质量检查业务不变量","body":["验证 Schema、唯一性、完整性、及时性、一致性、血缘、权限、迁移前后数量和聚合口径。AI 可帮助生成 SQL 和异常解释，但最终 Oracle 来自数据合同和业务定义。","对训练集、知识库和评测集还要增加来源许可、重复、泄漏、代表性、切片平衡和版本漂移。异常修复不能直接覆盖原始数据，需保留变换记录。"],"expected":"报表数字能回到源表、变换版本和业务口径，迁移前后关键不变量可复核。"}],"practice":["为目标产品建立最小浏览器/设备矩阵","仅用键盘完成一条关键旅程并记录问题","为一张核心表写 5 个数据不变量"],"completion":["矩阵有用户和风险依据","自动与人工可访问性检查都有位置","数据结论可回到血缘和业务定义"],"sourceIds":["S50","S59","S61"],"evidenceBoundary":"页面给出跨产品专项结构；设备占比、辅助技术组合、数据口径和法规要求须按目标市场更新。","order":6,"status":"outlined"},{"id":"TD-S03","moduleId":"TD-M08","title":"性能、负载、容量与长稳测试","type":"跟做","duration":"50 分钟","summary":"从用户目标和服务预算定义工作负载，区分响应时间、吞吐、并发、饱和、错误与资源，完成基线、负载、压力、突发、容量和 soak 实验。","why":"压测不是把并发调高。没有流量模型、阈值、资源和瓶颈证据，测试无法回答系统能服务多少用户、何时退化以及扩容是否有效。","prerequisites":["TD-S01"],"outcomes":["设计开放与封闭负载模型","设置分位数阈值与错误预算","从指标和 Trace 定位瓶颈"],"artifact":"性能测试计划、结果与容量结论","blocks":[{"title":"先定义 SLO 和工作负载","body":["写清业务动作比例、到达率、并发、数据规模、缓存热度、地区、峰值持续时间和增长假设。延迟使用 p50/p95/p99，不用平均值遮蔽尾部。"],"code":"thresholds:\n  http_req_failed: rate \u003c 0.01\n  http_req_duration: p(95) \u003c 800ms\nworkload:\n  browse: 70%\n  create_order: 20%\n  refund: 10%","expected":"测试计划同时包含业务负载、服务阈值和资源观测，不只是虚拟用户数。"},{"title":"六类实验回答不同问题","body":["基线验证单请求；负载验证预期峰值；压力寻找拐点；突发验证瞬时流量；容量估计可承载量；soak 暴露泄漏、积压和性能衰减。恢复阶段同样要测。","每类实验都要固定环境、预热、稳态时长、停止条件和数据清理策略。否则版本对比可能只是缓存、后台任务或数据规模不同。"]},{"title":"关联四类信号","body":["同时查看延迟、流量、错误、饱和，以及 CPU、内存、连接池、线程、队列、数据库、缓存、GC 和下游。用 Trace 连接慢请求到具体组件，用 Profile 验证热点。"],"bullets":["到达率是否被系统真实接收","排队是否增长","错误是否来自限流或超时","扩容后瓶颈是否转移"]},{"title":"报告要给容量决策","body":["给出在目标 SLO 下的最大稳定吞吐、资源配置、拐点、瓶颈、恢复时间、单请求成本和安全余量。对比版本时固定工作负载与环境。"],"warning":"压测工具显示高 RPS，不代表业务完成率高；失败请求、排队和下游副作用都必须计入。"}],"practice":["为一个接口写流量模型和 p95 阈值","设计峰值与 soak 两个实验","画出延迟、错误、饱和与资源的关联图"],"completion":["负载模型来自业务假设","阈值能触发 PASS/FAIL","报告给出容量、瓶颈和安全余量"],"sourceIds":["S45","S47","S51"],"evidenceBoundary":"k6、SRE 和可观测文档支持方法与指标；任何容量数字都必须在目标部署、数据和流量下实测，本页不提供通用容量承诺。","order":7,"status":"outlined"},{"id":"TD-S04","moduleId":"TD-M08","title":"可靠性、安全、可观测性、容灾与混沌","type":"诊断","duration":"45 分钟","summary":"用 SLO、错误预算、威胁模型、Telemetry、故障注入、恢复和演练验证系统在真实失败下是否可控。","why":"功能测试回答正常时能不能用；深度质量工程还要回答依赖坏了会怎样、攻击者能做什么、能否发现、多久恢复、数据会不会损坏。","prerequisites":["TD-S03"],"outcomes":["定义黄金信号和 SLO","从威胁模型生成安全测试","设计可停止的故障与恢复演练"],"artifact":"可靠性与安全验证计划","blocks":[{"title":"可靠性从用户 SLO 开始","body":["定义可用性、正确性、延迟和新鲜度 SLI，再设置 SLO 与错误预算。监控延迟、流量、错误、饱和；告警针对用户影响和预算消耗，不针对每个波动。","按用户旅程和风险切片观察，避免整体可用率掩盖某个地区、租户或关键动作持续失败。"]},{"title":"安全测试从资产与边界开始","body":["识别身份、权限、敏感数据、管理接口、供应链、租户隔离和审计；检查认证、授权、输入处理、会话、加密、密钥、日志和滥用防护。AI 系统还要加入 Prompt injection、数据泄露和工具越权。"],"bullets":["谁可以做什么","数据在哪些边界流动","失败是否默认安全","审计是否不可抵赖"]},{"title":"Telemetry 是可测试的产品能力","body":["日志、指标和 Trace 要共享 request/trace ID，保存版本和关键业务状态，避免泄露敏感内容。测试告警、Dashboard、采样、保留期和 Trace 断链，而不是默认“上线后能看见”。","为关键告警建立合成探针和故障演练，检查告警是否及时、是否包含处置上下文、是否重复轰炸，以及值班人员能否从信号走到可执行 Runbook。"],"expected":"一次注入故障可以从告警定位到 Trace、服务、依赖和业务影响，并保留恢复证据。"},{"title":"混沌和容灾必须有假设与停止条件","body":["先在小范围验证实例终止、网络延迟、依赖超时、区域故障、数据恢复和降级。声明稳态指标、爆炸半径、自动停止、回滚和负责人。备份成功不等于恢复成功，必须做恢复演练。"],"warning":"没有可观测性、回滚和授权的故障注入，不是专业混沌实验。"}],"practice":["为关键旅程定义 3 个 SLI 与一个 SLO","画出资产、信任边界和两条攻击路径","设计一个有停止条件的依赖超时实验"],"completion":["告警能连接用户影响","安全测试来自威胁模型","故障实验验证恢复而非只制造中断"],"sourceIds":["S48","S49","S50","S60"],"evidenceBoundary":"SRE、OpenTelemetry、OWASP 与混沌原则支持通用框架；安全与容灾结论必须由有授权的目标环境测试和组织政策确认。","order":8,"status":"outlined"},{"id":"TD-F02","moduleId":"TD-M01","order":9,"title":"大模型从数据、训练到一次推理发生了什么","type":"概念","status":"outlined","duration":"35 分钟","summary":"用测试工程师需要的深度理解模型生命周期，知道一次错误回答可能来自训练、对齐、推理配置还是应用层。","why":"不了解模型行为从哪里来，就会把所有问题都归因于 Prompt，也无法设计正确的版本、数据和回归策略。","prerequisites":["TD-F01"],"outcomes":["解释数据、预训练、后训练、评测、部署、推理和监控的关系","区分模型本体问题与应用编排问题","为每个生命周期阶段写出可观察风险"],"artifact":"大模型生命周期与测试责任图","blocks":[{"title":"先区分模型是怎么来的，和模型这次怎么运行","body":["预训练让模型从大量数据中学习统计规律；后训练或对齐让模型更能遵循指令、偏好和安全要求。部署后，一次推理会接收当前 Prompt、上下文和参数，再生成输出。测试人员通常不能重新训练基础模型，但必须记录它的版本，并控制本次推理的输入和配置。","模型可能没有学到某项知识，也可能学过但当前上下文诱导错误；还可能模型回答正确，却被检索、解析器或工具执行层破坏。生命周期图的作用是阻止所有问题都被模糊地叫作“模型不稳定”。"]},{"title":"测试视角的七个阶段","body":["每个阶段对应不同证据和责任边界。"],"bullets":["数据：来源、许可、质量、偏差、重复、敏感信息和污染","预训练：知识覆盖和基础能力；多数应用团队只能把模型版本视为外部依赖","后训练与对齐：指令遵循、偏好、安全和拒答边界可能变化","离线评测：Benchmark 和内部 Eval 是否代表真实任务，是否泄漏","部署：模型端点、量化、区域、限流、超时和回退策略","推理：Prompt、上下文、采样、工具、重试和解析器共同决定结果","监控：线上 Trace、漂移、成本、延迟、反馈和新失败回流"]},{"title":"一次回答错了，先问四个问题","body":["不要第一时间修改 Prompt。先定位变化来自哪里。"],"bullets":["模型是否换了版本或部署配置？","Prompt、系统指令、上下文或检索材料是否变化？","Temperature、Top-p、最大输出、重试或结构化解析是否变化？","工具、权限、数据源或后处理是否把正确意图变成错误结果？"],"expected":"同一错误症状可能有多个根因，因此测试报告要保存版本和 Trace，而不是只贴最终回答。"},{"title":"把模型当成版本化依赖，而不是神秘大脑","body":["建立最小 Manifest：模型与提供方版本、Prompt 版本、推理参数、知识库/索引版本、工具 Schema、Scorer/Judge 版本、运行时间和环境。每个 Eval 报告都引用它。","如果提供方只给动态别名，至少记录调用日期、端点、可见配置和原始 Trace。无法固定的依赖要进入限制说明，并通过重复运行或更保守阈值处理。"],"code":"model_version: vendor/model-snapshot\nprompt_version: refund-assistant-v7\ndataset_version: refund-eval-2026-08\nknowledge_version: policy-index-42\ntemperature: 0\nmax_output_tokens: 600\nscorer_version: refund-rubric-v3"}],"practice":["为一个聊天或 RAG 功能画出七阶段生命周期","拿一条失败分别写出模型层、推理层和应用层三种可能根因","创建一份最小版本 Manifest"],"completion":["能区分训练阶段与本次推理配置","能指出至少四类被测依赖","版本 Manifest 足以支持下一次回归比较"],"sourceIds":["S23","S24","S33"],"evidenceBoundary":"本页解释测试所需的通用模型生命周期，不代表所有模型供应商公开相同训练细节；未公开的训练数据和对齐方法只能作为未知项处理。"},{"id":"TD-F03","moduleId":"TD-M01","order":10,"title":"Token、Attention、Context 和概率生成为什么影响测试","type":"概念","status":"outlined","duration":"40 分钟","summary":"理解一次生成最关键的运行变量，并把它们转成可以控制、记录和做边界测试的条件。","why":"同一业务问题换语言、格式、上下文顺序或采样参数后可能表现不同；这些不是玄学，而是必须进入测试设计的输入维度。","prerequisites":["TD-F02"],"outcomes":["用通俗语言解释 Token、Attention、Context、Logits 和解码","设计上下文与采样的对照实验","识别确定性回归与统计稳定性测试的边界"],"artifact":"推理变量到测试设计映射表","blocks":[{"title":"模型不是一次写完整句话，而是逐步选择下一个 Token","body":["输入会先被切成 Token。模型根据已有 Token 和上下文，为下一步可能出现的 Token 产生分数，再经过解码策略选择一个结果，重复直到结束。因此，中文、英文、标点、JSON、长文本和特殊符号会消耗不同上下文预算。","测试意义：不要只按“字符数”设计边界；记录输入和输出 Token，测试长短输入、多语言、结构化格式、截断位置和超限后的系统行为。"]},{"title":"Attention 和 Context 决定模型这次能看到什么、重视什么","body":["Attention 让模型在当前上下文中建立不同位置之间的关系，但它不保证所有材料被等量、正确地使用。重要规则放在不同位置、加入无关文档、给出冲突指令或超过上下文窗口，都可能改变输出。","测试意义：构造位置变化、无关噪声、冲突上下文、过期政策和长上下文截断样例；保存最终送入模型的完整上下文，而不是只保存用户问题。"]},{"title":"Logits 和解码让输出具有概率性","body":["模型为候选 Token 产生相对分数，解码策略再决定选哪个。Temperature、Top-p、随机种子和推理策略会改变多样性与重复性。Temperature 为 0 往往更稳定，但不等于数学上的完全确定，也不能消除服务端或并行计算差异。","测试意义：Schema、工具参数和禁止声明优先做确定性检查；语义质量需要重复运行、风险切片、分布统计和人工校准。不要把一次 PASS 当成稳定性证据。"],"warning":"不能为了让回归稳定，就把所有质量问题都改成字符串精确匹配；那会把合理表达差异误判为失败。"},{"title":"设计一个最小对照实验","body":["保持模型和业务问题不变，只改变一个变量，运行并记录结果。示例选择上下文顺序。"],"code":"A: [退款政策, 促销文案] -> 运行 5 次\nB: [促销文案, 退款政策] -> 运行 5 次\n固定: model, prompt, temperature, tools\n记录: answer, citations, forbidden_claim, latency, tokens","expected":"你得到的不是“哪个回答更好看”，而是一张变量、运行次数、质量检查和差异说明表。"}],"practice":["比较短中文、长中文和同义英文问题的 Token/长度表现","构造一条重要政策位于上下文开头与结尾的对照","为随机输出定义重复次数和稳定性指标"],"completion":["能说明输出为什么不是固定字符串","实验每次只改变一个主要变量","知道哪些检查确定性执行、哪些需要统计或人工"],"sourceIds":["S23","S33","S40"],"evidenceBoundary":"Transformer 原始论文支持 Attention 架构基础；不同现代模型的 Tokenizer、位置机制、推理策略和服务端确定性可能不同，具体行为必须查看当前模型文档并实测。"},{"id":"TD-F04","moduleId":"TD-M01","order":11,"title":"从 LLM 到 RAG、Agent 和 Workflow：测试对象怎样扩张","type":"概念","status":"outlined","duration":"35 分钟","summary":"建立直接 LLM、RAG、Agent、Worker 和固定 Workflow 的统一结构，知道新增一层就增加哪些失败和证据。","why":"很多团队把所有智能系统都叫 Agent，导致测试范围模糊。先区分系统结构，才能决定测回答、检索、工具、状态、Handoff 还是业务终态。","prerequisites":["TD-F03"],"outcomes":["区分 LLM、RAG、Agent、Worker 和 Workflow","为每种结构列出新增失败模式","画出一条带工具和人工确认的可测试流程"],"artifact":"AI 应用结构、失败与证据分层图","blocks":[{"title":"五种对象不要混成一个词","body":["它们都可能调用大模型，但控制方式和测试重点不同。"],"bullets":["LLM：输入上下文，生成输出；重点是格式、正确性、拒答、稳定性和成本","RAG：先检索再生成；增加召回、排序、污染、上下文、引用和忠实性","Agent：模型动态决定下一步和工具；增加轨迹、权限、循环、终止和副作用","Worker：在系统中承担一个边界明确的任务单元；增加输入输出契约、超时、重试和 Handoff","Workflow：代码预先规定路径和分支，可包含模型或 Worker；增加状态转换、并发、补偿和端到端业务不变量"]},{"title":"每增加一层，都要增加可观察证据","body":["LLM 至少保存输入、Prompt、模型、参数和输出；RAG 还要保存 Query、文档 ID、排序和上下文；Agent 还要保存每个 Tool call、参数、返回、权限与状态；Workflow 还要保存节点、分支、重试、Handoff、补偿和终态。","只保存最终回答，会让“答案对但过程危险”“答案错但检索正确”“最终成功但中途重复扣款”等关键问题无法重放。"]},{"title":"测试维度从输出扩展到业务过程","body":["同一个退款助手，可以按下面层级设计测试。"],"bullets":["输出：是否正确说明政策，是否应该拒答或转人工","检索：是否找到正确政策，是否混入过期促销文档","工具：是否选择 refund_order，参数是否正确，是否先取得确认","轨迹：是否循环、跳过验证、错误重试或在失败后继续执行","Workflow：Worker Handoff 是否完整，终态数据库是否正确，补偿是否执行","运行：延迟、Token、成本、失败率和 Trace 是否在预算内"],"warning":"最终回复写着“没有退款”并不能证明工具没有真的执行退款。副作用必须直接检查。"},{"title":"画一条可测试的 Worker Workflow","body":["示例：分类 Worker → 政策检索 Worker → 风险判断 → 人工确认 → 执行 Worker → 独立 Verifier。"],"code":"request\n  -> classify\n  -> retrieve_policy\n  -> risk_check\n  -> human_approval?\n  -> execute_or_refuse\n  -> independent_verify\n  -> final_state","expected":"图中每个节点都有输入、输出、状态、超时、失败路径和责任人；不可逆动作前存在明确人工或策略 Gate。"}],"practice":["把一个普通聊天功能分别扩展成 RAG、Agent 和 Workflow","为每次扩展增加至少三种失败和三类 Trace 字段","为不可逆工具动作设计权限、确认和补偿测试"],"completion":["不再把 Workflow、Worker 和 Agent 当作同义词","能解释为什么最终结果不足以测试 Agent","已经完成一张结构、失败和证据分层图"],"sourceIds":["S08","S23","S34","S35","S39"],"evidenceBoundary":"页面提供跨框架结构模型；不同产品对 Agent、Worker、Memory 和 Workflow 的命名不一致，课程以控制权、状态和证据，而不是品牌术语作为判定依据。"},{"id":"TD-A01","moduleId":"TD-M09","title":"AI 接口服务和普通接口到底哪里不同","type":"概念","duration":"35 分钟","summary":"在普通 API 契约之上，加入模型版本、采样、上下文、Token、流式事件、结构化输出、工具调用、内容安全、限流和成本。","why":"只测状态码和最终 JSON 会漏掉首 Token 卡顿、流中断、Schema 修复、工具副作用、模型漂移和昂贵重试。AI 接口是协议、概率模型和算力服务的组合。","prerequisites":["TD-F04","TD-S01"],"outcomes":["画出 AI API 四层被测面","识别同步、流式、工具和批处理契约","保存可复现实验 Manifest"],"artifact":"AI API 测试面与版本 Manifest","blocks":[{"title":"四层被测面","body":["协议层：HTTP、鉴权、幂等、SSE、错误和限流；模型行为层：正确性、拒答、稳定性和安全；服务性能层：排队、prefill、decode、Token 吞吐和成本；生产可靠性层：重试、回退、降级、区域和可观测。"]},{"title":"同一个请求有更多版本变量","body":["记录模型快照/别名、系统 Prompt、用户输入、上下文、采样参数、最大输出、结构化 Schema、工具定义、知识库、供应商、区域和调用时间。动态别名不能被当成固定依赖。","还要保存 request ID、输入输出 Token、重试次数、缓存状态和内容安全结果。托管服务无法公开的内部版本应明确标为未知，而不是伪造一个可复现版本号。"],"code":"model + prompt + context + sampling + schema + tools + knowledge + region + time","expected":"两次结果差异可以先对比 Manifest，而不是直接归因于“模型随机”。"},{"title":"测试矩阵覆盖交互模式","body":["同步响应检查超时和完整体；流式响应检查事件顺序、首 Token、断连和取消；结构化输出检查 Schema 与语义；工具调用检查名称、参数、权限和副作用；批处理检查异步状态、重复提交和部分失败。"]},{"title":"错误响应也是产品契约","body":["区分认证、配额、速率限制、输入超限、安全拒绝、模型不可用、超时、解析失败和工具失败；验证 Retry-After、request ID、是否可重试和用户可理解降级。"],"warning":"重试不区分错误类型会制造放大流量、重复工具动作和更高成本。"}],"practice":["把一个模型调用拆成四层测试面","为流式、结构化和工具调用各写 3 个异常","创建可比较的请求 Manifest"],"completion":["AI API 契约不只含最终文本","模型与应用版本均可追踪","每类错误有明确重试或不重试策略"],"sourceIds":["S56","S57","S58","S59"],"evidenceBoundary":"页面综合官方接口指南和协议规范；具体事件字段、模型别名、限额与行为可能更新，执行前必须重新核对当前供应商文档。","order":12,"status":"outlined"},{"id":"TD-A02","moduleId":"TD-M09","title":"流式、结构化输出、工具调用与异步任务怎么测","type":"跟做","duration":"50 分钟","summary":"为 AI API 的四种关键交互建立协议状态机、故障注入和业务终态 Oracle。","why":"最终内容正确不代表流式过程、工具动作和异步状态正确。断流后重复扣款、JSON 可解析但语义错误、工具参数越权都可能被终态文本掩盖。","prerequisites":["TD-A01"],"outcomes":["验证流式事件状态机","区分 Schema 合法与业务正确","检查工具副作用和异步幂等"],"artifact":"AI API 协议状态机与自动化检查表","blocks":[{"title":"流式响应按事件序列测试","body":["检查 Content-Type、事件类型、顺序、增量拼接、usage、结束标志和错误事件。注入首字节超时、中途断连、客户端取消、代理缓冲和重连；确认服务是否继续计费或执行工具。"],"code":"connect -> response.created -> output.delta* -> output.completed|error\nassert order, no duplicate, valid UTF-8, final usage, cancellation","expected":"断流和取消后状态可解释；不会默默重复动作，最终 usage 与完成状态可追踪。"},{"title":"结构化输出有两层 Oracle","body":["第一层验证 JSON 和 Schema；第二层验证字段间业务不变量、枚举语义、引用真实性和拒答边界。测试超长、缺字段、额外字段、递归结构、Unicode、Schema 版本和解析失败降级。"]},{"title":"工具调用直接检查动作","body":["验证工具选择、参数类型与范围、身份权限、用户确认、幂等键、超时、重试、补偿和最终副作用。最终回复不能替代数据库、账本或外部系统状态检查。"],"warning":"高风险工具执行前缺少权限或人工 Gate 时，即使回答质量很高也必须阻断。"},{"title":"异步与批处理按状态机和集合检查","body":["验证 submitted、running、partial、completed、failed、cancelled；检查重复提交、断点续传、部分失败、顺序、结果集合完整性、过期和重放。回调要验证签名、去重和乱序。"],"expected":"每个任务 ID 只有一个可解释终态；部分失败不会被汇总成功掩盖。"}],"practice":["为 SSE 写事件顺序和断流测试","为一个 JSON Schema 增加 5 个语义不变量","模拟工具超时后成功并验证幂等"],"completion":["流式过程可重放","Schema 和业务 Oracle 分开","工具与异步任务的真实终态被直接验证"],"sourceIds":["S56","S57","S58"],"evidenceBoundary":"示例使用通用事件状态机表达；不同供应商的事件名称与取消语义不同，需要按当前 SDK、API 与代理链实测。","order":13,"status":"outlined"},{"id":"TD-A03","moduleId":"TD-M09","title":"AI 性能指标：TTFT、TPOT、ITL、Goodput 与成本","type":"概念","duration":"45 分钟","summary":"把用户等待、生成速度、Token 吞吐、满足 SLO 的有效吞吐和单位成功成本连接起来，避免只看总延迟或 GPU 利用率。","why":"生成式服务有排队、prefill 和逐 Token decode。两个总延迟相同的请求，用户体感和资源瓶颈可能完全不同。","prerequisites":["TD-A02","TD-S03"],"outcomes":["计算并解释核心生成指标","为不同业务设置 SLO","识别吞吐、质量和成本的权衡"],"artifact":"AI 性能指标卡与门禁","blocks":[{"title":"一次生成分成三段","body":["排队等待进入服务；prefill 处理输入上下文并产生首 Token；decode 逐个生成后续 Token。长输入常压高 prefill，长输出常压 decode，批处理和调度会改变两者。"]},{"title":"核心指标和公式","body":["TTFT 是请求到首 Token；TPOT 是首 Token 后平均每个输出 Token 时间；ITL 是相邻 Token 间隔分布；E2E 是总时长；请求吞吐与输入/输出 Token 吞吐描述系统处理量。"],"code":"TTFT = first_token_time - request_start\nTPOT = (last_token_time - first_token_time) / (output_tokens - 1)\nGoodput = requests_meeting_all_SLOs / second\ncost_per_success = total_cost / successful_quality_passes","expected":"指标卡同时给 p50/p95/p99、输入输出长度切片、并发/到达率和质量通过条件。"},{"title":"Goodput 比裸吞吐更接近业务价值","body":["吞吐高但 TTFT、TPOT、错误或质量超限的请求不是有效产出。定义 Goodput 时同时绑定延迟、错误、输出完整和最低质量，避免通过截短回答换取漂亮性能。"]},{"title":"按场景设 SLO","body":["交互聊天更关注 TTFT 和 ITL；代码/报告生成更关注 E2E、输出 Token 速度和完整性；批任务更关注总吞吐、截止时间和成本；工具 Agent 还要拆每步模型、工具和排队。"],"warning":"GPU 利用率高不等于用户体验好，平均延迟低也不能证明尾部和高风险切片达标。"}],"practice":["从一条 Trace 计算 TTFT 和 TPOT","为聊天和批任务分别定义指标卡","写一个包含质量条件的 Goodput 定义"],"completion":["能区分 TTFT、TPOT、ITL 和 E2E","指标按输入输出长度切片","性能门禁没有牺牲质量和成本"],"sourceIds":["S51","S52","S53","S54"],"evidenceBoundary":"vLLM、NVIDIA 和 Triton 文档支持指标定义；阈值必须从目标产品 SLO、模型、硬件和成本预算校准，不能照抄教学数字。","order":14,"status":"outlined"},{"id":"TD-A04","moduleId":"TD-M09","title":"AI 负载、容量与瓶颈实验","type":"跟做","duration":"55 分钟","summary":"按输入/输出 Token、上下文分布、到达模型、并发和质量条件设计生成式负载，找到服务拐点和可承诺容量。","why":"固定短 Prompt 的高并发压测无法代表真实生成负载。长上下文、长输出、缓存命中、工具等待和批调度都会改变算力与排队。","prerequisites":["TD-A03"],"outcomes":["构建 Token 工作负载分布","比较开放和封闭负载","给出 Goodput 容量与安全余量"],"artifact":"AI 容量实验计划与结果表","blocks":[{"title":"工作负载至少有五个维度","body":["输入 Token 分布、输出 Token 分布、请求到达率/并发、模型/量化/硬件、场景和质量切片。还要记录缓存、流式、结构化、工具和多轮上下文。"],"code":"scenario,input_tokens,output_tokens,arrival_rps,concurrency,quality_gate\nchat-short,p50=400,p50=120,8,32,pass\nreport-long,p50=8000,p50=1800,0.5,8,pass","expected":"测试数据反映线上长度和场景分布，而不是所有请求使用同一个 Hello Prompt。"},{"title":"开放与封闭模型回答不同问题","body":["封闭模型固定并发，用户完成后再发请求，容易在系统变慢时自动降低到达率；开放模型按外部到达率持续发送，更容易暴露排队和过载。容量评估通常需要二者结合。"]},{"title":"逐级加压寻找拐点","body":["预热后逐级提高到达率，保持足够稳态；记录 TTFT、TPOT、Goodput、队列、错误、Token 吞吐、GPU、KV Cache 和成本。达到 SLO 破坏点后停止，再验证恢复和降级。","每一级保留原始请求切片与服务指标，确认客户端实际发送速率没有被本地 CPU、连接数或压测工具自身限制。"]},{"title":"容量结论使用 Goodput","body":["报告最大稳定 Goodput、资源配置、长度切片、拐点、瓶颈、安全余量和扩容策略。比较动态批处理、并行、量化或缓存时只改变一个主要变量。"],"warning":"继续压到系统完全崩溃并不能自动增加价值；有停止条件、恢复验证和业务容量结论才是实验。"}],"practice":["从真实或模拟 Trace 构建 Token 长度分布","分别运行开放/封闭模型思维实验","为过载定义停止、降级和恢复条件"],"completion":["负载包含 Token 与场景分布","找到 SLO 拐点而非只记录最大 RPS","容量结论绑定 Goodput、资源和安全余量"],"sourceIds":["S51","S52","S53"],"evidenceBoundary":"本页是可执行实验设计，不包含用户硬件上的实测容量；需使用 GenAI-Perf、vLLM benchmark 或目标压测工具在真实部署验证。","order":15,"status":"outlined"},{"id":"TD-A05","moduleId":"TD-M09","title":"发现 AI 性能问题：从用户慢到 Queue、GPU 与 KV Cache","type":"诊断","duration":"50 分钟","summary":"用症状—指标—Trace—资源—对照实验链路定位排队、prefill、decode、调度、缓存、网络、工具和下游瓶颈。","why":"“模型慢”不是根因。没有分阶段指标和资源关联，扩 GPU、缩 Prompt 或换模型都可能只把瓶颈移动到别处。","prerequisites":["TD-A04"],"outcomes":["按症状选择首查指标","关联请求 Trace 与服务资源","设计单变量验证实验"],"artifact":"AI 性能诊断树与实验记录","blocks":[{"title":"先按症状分流","body":["TTFT 高而 TPOT 正常：查队列、prefill、长上下文和调度；TTFT 正常而 TPOT 高：查 decode、GPU 饱和、批处理和输出长度；两者都高：查过载、资源争用或网络；只在 Agent 慢：拆模型、检索、工具和重试。"]},{"title":"服务端关键观测","body":["监控运行/等待请求、队列时间、prefill/decode 时间、输入输出 Token、KV Cache 使用、缓存命中、批大小、GPU 计算/显存、错误与抢占。Prometheus histogram 要使用正确 bucket 并按场景切片。"],"bullets":["queue_time","time_to_first_token","time_per_output_token","requests_running/waiting","kv_cache_usage","gpu_utilization/memory"]},{"title":"Trace 连接用户与资源","body":["为请求保存模型、长度、场景、批次、重试、检索和工具 span。先找到慢请求切片，再对比正常请求的 Queue、prefill、decode 与下游，避免只看全局平均 Dashboard。"],"expected":"诊断结论能指出哪个阶段、哪些请求、什么资源或依赖导致 SLO 破坏。"},{"title":"用单变量实验证伪","body":["分别缩短输入、限制输出、降低到达率、关闭缓存、调整批处理或替换工具延迟，每次只改变一个主要变量。记录假设、变化、结果和是否推翻。"],"warning":"相关性不是根因；GPU 高和延迟高同时出现，仍需受控实验或更细 Trace 验证。"}],"practice":["为 TTFT 高、TPOT 高、Agent 慢各画一条诊断路径","设计一个缩短上下文的单变量实验","说明如何证明队列而非模型计算是瓶颈"],"completion":["症状映射到生成阶段","请求指标与资源指标可关联","根因结论有对照实验支持"],"sourceIds":["S51","S53","S54","S55"],"evidenceBoundary":"指标名称与可见程度依赖 serving stack；托管 API 可能不暴露 GPU/KV 指标，此时只能结合客户端阶段指标、供应商遥测与受控负载推断并标记未知。","order":16,"status":"outlined"},{"id":"TD-A06","moduleId":"TD-M09","title":"限流、超时、重试、回退与降级","type":"诊断","duration":"45 分钟","summary":"验证 AI 服务在配额、过载、长尾、模型故障和工具失败下不会形成重试风暴、重复副作用或无声质量下降。","why":"生成请求昂贵且长尾明显。盲目重试会增加排队与成本，模型回退会改变质量和安全边界，工具调用还可能重复执行。","prerequisites":["TD-A05"],"outcomes":["按错误分类重试","验证退避、抖动与预算","把回退质量纳入发布门禁"],"artifact":"AI 服务韧性状态机与故障矩阵","blocks":[{"title":"错误先分类再处理","body":["认证、无效输入和策略拒绝通常不应重试；速率限制按 Retry-After 与指数退避；瞬时 5xx/网络故障在总预算内重试；上下文超限要调整输入；工具副作用必须依赖幂等与状态查询。"]},{"title":"重试有四个预算","body":["限制最大次数、总时间、总 Token/费用和业务副作用。使用指数退避与随机抖动，避免大量客户端同步重试；服务端要观测 retry amplification。"],"code":"attempt_budget=3\ntime_budget_ms=12000\ncost_budget_usd=0.08\nidempotency_key=request_id\nbackoff=exponential+jitter","expected":"故障期间总请求量、费用和重复动作受控，原始错误与每次尝试均可追踪。"},{"title":"回退不是天然安全","body":["切换更小模型、旧 Prompt、缓存回答或规则模板会改变正确性、拒答、安全和格式。每条回退路径都有独立评测切片、SLO 和明确用户提示；无法满足关键质量时应安全失败或转人工。","回退时记录实际模型、原因和持续时间，禁止把降级输出混进主模型质量统计。恢复主路径后先小流量验证，避免在依赖尚未稳定时来回抖动。"]},{"title":"故障矩阵覆盖恢复","body":["注入 429、5xx、超时、断流、模型不可用、工具部分成功、区域故障和知识库不可用；检查告警、退避、熔断、降级、幂等、用户消息、恢复时间和恢复后队列。","每次实验保存原始请求和恢复证据。"],"warning":"把所有失败隐藏成一个友好回答，会丢失真实状态并让错误业务继续执行。"}],"practice":["为 400/401/429/500/超时写处理策略","模拟重试风暴并定义放大率门禁","为小模型回退建立质量切片"],"completion":["不可重试错误不会循环","重试受次数、时间、成本和副作用约束","回退路径经过质量与安全验证"],"sourceIds":["S46","S57","S59"],"evidenceBoundary":"官方限流和 SRE 资料支持策略；具体配额、Retry-After、错误码和回退能力依供应商与账户动态变化，发布前需在线验证。","order":17,"status":"outlined"},{"id":"TD-T01","moduleId":"TD-M01","order":18,"title":"测试开发遇到 AI 后，测试对象发生了什么变化","type":"概念","status":"outlined","duration":"18 分钟","summary":"区分确定性软件检查与概率性 AI 质量判断，知道哪些旧方法仍然有效、哪些地方必须换思路。","why":"如果仍把 AI 当作普通接口，只断言状态码和固定字符串，就会漏掉幻觉、拒答失守、引用错误、工具越权和质量漂移。","prerequisites":["TD-F04"],"outcomes":["说清普通软件与 AI 系统在输出、依赖和失败模式上的三个差异","把一条 AI 失败归类为结构、行为、语义、安全或运行质量问题","为同一个输出选择确定性检查、语义评测或人工审核"],"artifact":"AI 测试对象五层检查表","blocks":[{"title":"先看一个真实工作差异","body":["普通退款接口收到合法请求后，通常返回一个确定结构：状态码、订单状态和退款编号。测试开发可以对字段做精确断言。","客服 AI 面对“会员已经激活，还能自动退款吗？”时，可能用不同句子表达同一正确答案，也可能语言很流畅却错误承诺退款。此时只检查 JSON 合法或回答非空远远不够。"],"bullets":["结构正确不等于业务正确","一次回答正确不等于版本稳定","最终答案正确也不等于 Agent 的工具调用安全"]},{"title":"AI 测试对象的五层模型","body":["把一次 AI 请求拆成五层，测试时从下往上看，定位会比只盯最终文本更清楚。"],"bullets":["输入层：用户问题、上下文、语言、身份和攻击载荷是否被正确处理","检索层：应该取到的知识是否取到，是否混入无关或过期材料","生成层：回答是否正确、忠实、相关、引用充分，是否应该拒答","行动层：Agent 是否选择正确工具、参数和权限，是否需要人工确认","运行层：延迟、成本、失败率、版本和 Trace 是否可观测"]},{"title":"旧测试方法哪些还能用","body":["Schema、权限、工具参数、引用 ID、PII、延迟和成本依然可以做确定性断言；这些检查便宜、稳定，应当优先使用。","自然语言正确性、忠实性和帮助程度通常需要规则、语义模型和人工样本组合。不要因为引入了大模型，就把所有判断都交给另一个大模型。"],"warning":"最危险的误区是“回答看着挺好”。测试开发需要的是可重复证据，而不是一次对话印象。"},{"title":"最小例子：这条失败属于哪一层","body":["用户只询问订单状态，Agent 却调用了 refund_order，并传入订单号。最终回复说“正在查询”，表面上没有错误。"],"bullets":["最终文本：看似正常","行动层：错误工具，属于高风险失败","权限层：若工具实际执行，可能产生不可逆业务影响","正确 oracle：工具名、参数、权限策略和人工确认状态的确定性检查"],"expected":"你应该得出结论：不能只测试最终答案，还必须保存并检查 Agent 轨迹。"}],"practice":["把“答案引用了不存在的政策文档”归类到检索层和生成层，并分别写出可观察信号。","把“回答正确但耗时 12 秒”归类到运行层，写出至少一个门禁指标。","从你自己的项目选一个 AI 功能，按五层模型列出每层至少一个检查。"],"completion":["能解释为什么 JSON Schema 通过不代表 AI 质量通过","能为至少三类失败选择不同 oracle","已经完成一份五层检查表，而不是只阅读概念"],"sourceIds":["S23","S24","S32"],"evidenceBoundary":"本页是基于职业标准、AI 测试体系和生产就绪研究的概念综合；没有证明某个企业应采用统一指标或阈值。"},{"id":"TD-T02","moduleId":"TD-M01","order":19,"title":"LLM、RAG、Agent 的最小结构","type":"概念","status":"outlined","duration":"22 分钟","summary":"画出模型、检索、工具和轨迹的最小结构，并知道每个部件应该留下什么测试证据。","why":"系统结构决定故障位置。分不清检索、生成和工具执行，就只能看到“AI 回答错了”，无法定位谁错、怎么复现。","prerequisites":["TD-T01"],"outcomes":["画出 LLM、RAG 和 Agent 三种最小流程","为每个节点标出输入、输出、版本和可观察证据","根据症状选择先查哪一层"],"artifact":"AI 系统结构与证据图","blocks":[{"title":"三个系统，一句话讲懂","body":["LLM：根据输入和上下文生成下一个最合适的内容。","RAG：先从外部知识中找材料，再让 LLM 基于材料回答。","Agent：让模型在多步过程中选择工具、读取结果、继续判断，直到完成任务或交给人工。"],"code":"LLM:    user -> prompt -> model -> answer\nRAG:    user -> retriever -> context -> model -> answer + citation\nAgent:  goal -> model -> tool call -> tool result -> ... -> final answer"},{"title":"测试开发要保存的最小证据","body":["每次运行只保存最终文本，会让大量故障无法复现。最小 Trace 至少包含下面这些字段。"],"bullets":["request_id、样例 ID、时间和环境","Prompt、模型、参数、知识库与工具版本","检索文档 ID、排序和得分","每次工具调用的名称、参数、返回值和权限判定","最终答案、引用、拒答标志、延迟、token 和成本"],"code":"{\n  \"case_id\": \"refund-out-window\",\n  \"retrieved_ids\": [\"policy-refund-001\"],\n  \"answer\": \"超过 7 日且已激活的订阅不能自动退款，需要人工复核。\",\n  \"citations\": [\"policy-refund-001\"],\n  \"tool_call\": null,\n  \"latency_ms\": 820\n}"},{"title":"用症状倒推检查顺序","body":["同一句错误回答可能来自不同根因，因此不能只修改 Prompt。"],"bullets":["正确文档没检索到：先查数据切片、召回、过滤和索引版本","文档正确但回答捏造：查忠实性、Prompt、上下文截断和模型版本","答案正确但引用错：查 citation 映射与后处理","调用了危险工具：查工具选择、参数、权限和人工确认策略"],"warning":"“调一下 Prompt”不是通用修复。没有结构证据时，它只是碰运气。"},{"title":"自己画一张证据图","body":["选一个你熟悉的 AI 功能，用箭头画出数据流；在每个箭头旁写下可以保存的输入和输出。"],"expected":"图中至少包含用户输入、版本、检索或工具证据、最终输出和业务决策人。"}],"practice":["分别画出纯 LLM、RAG、可调用退款工具的 Agent","在图中圈出一个不可逆动作","写明不可逆动作由谁批准"],"completion":["能在不提框架品牌的情况下解释三种结构","结构图包含版本与 Trace","能根据四种常见症状选择首查节点"],"sourceIds":["S09","S10","S23"],"evidenceBoundary":"结构图是跨框架最小模型；不同供应商的实际字段、工具协议和 Trace 格式需要按当前版本适配。"},{"id":"TD-T03","moduleId":"TD-M01","order":20,"title":"概率性输出为什么不能只用传统断言","type":"概念","status":"outlined","duration":"25 分钟","summary":"学会按风险选择确定性断言、规则评分、语义 Judge 和人工评审，而不是寻找一个万能分数。","why":"同一正确答案可以有很多表达，同一流畅回答也可能严重错误。Oracle 选错，比阈值调错更根本。","prerequisites":["TD-T02"],"outcomes":["识别四类 oracle 的适用边界","为高风险 slice 设计组合 oracle","解释 LLM-as-judge 为什么也要测试和校准"],"artifact":"风险到 Oracle 决策表","blocks":[{"title":"不要把“不能精确匹配”理解成“无法测试”","body":["AI 输出不是完全随机，而是存在可观察约束。订单号格式、工具名、引用 ID、拒答标志和 PII 都可以精确检查。","只有当问题涉及语义正确、帮助程度或表达质量时，才需要规则、embedding、LLM Judge 或人工。"]},{"title":"四类 Oracle","body":["按稳定性和风险从左到右组合，而不是从一开始就使用最昂贵的方法。"],"bullets":["确定性：schema、正则、集合、工具/参数、引用白名单、延迟和成本","规则评分：必须包含、禁止声明、关键词组、业务状态机","语义评测：正确性、相关性、忠实性、风格，必须固定 rubric 与 judge 版本","人工评审：高风险、分歧样例、新失败和抽样校准"]},{"title":"一个高风险退款样例如何组合","body":["问题：已激活数字商品是否可以自动退款？"],"bullets":["确定性：不得调用 refund_order；引用必须来自 policy-refund-001","规则：不得出现“已自动退款”“保证退款”等禁止声明","语义：回答是否忠实表达“需要人工复核”","人工：法务或业务负责人确认政策解释和例外情形"],"expected":"任何高风险确定性 gate 失败都应先阻断，不应被平均语义分数抵消。"},{"title":"LLM-as-judge 也属于被测依赖","body":["Judge 会受到 Prompt、模型、温度、上下文顺序和 rubric 的影响。同一批样例换模型后，分数可能变化。","最低要求是准备人工标注的小校准集，检查 judge 与人工的一致率，并保存分歧样例。"],"warning":"不要用一个未校准的模型分数，替代业务负责人对高风险行为的决策。"}],"practice":["为“泄露手机号”“回答不够礼貌”“调用错误工具”各选一种主 oracle","设计一个不能被平均分掩盖的 blocker","写出三条 judge 校准样例"],"completion":["每种 oracle 都能举出适用例子","能说明高风险为何使用组合检查","知道 judge 的版本与 rubric 必须进入测试依赖"],"sourceIds":["S04","S10","S13","S23"],"evidenceBoundary":"本页给出选择方法，不声称任何 Judge 或通用指标在所有业务上可靠；真实一致性必须用本业务人工样本测量。"},{"id":"TD-T04","moduleId":"TD-M01","order":21,"title":"从测试用例到评测样例、黄金集和风险切片","type":"跟做","status":"outlined","duration":"35 分钟","summary":"把业务风险写成可重复执行的评测样例，并形成一个能扩展的小型黄金集。","why":"没有版本化评测数据，模型、Prompt 或知识库变更只能靠人随机试问，无法比较和回归。","prerequisites":["TD-T03"],"outcomes":["写出包含输入、期望和证据的 eval case","用 slice 表达业务风险而不是只分正负例","避免黄金集污染和不一致"],"artifact":"最小黄金集与数据卡","blocks":[{"title":"评测样例比普通测试用例多什么","body":["除了输入和预期，它还要记录允许的多种结果、证据来源、风险 slice、oracle、版本和人工争议。"],"code":"{\n  \"id\": \"refund-out-window\",\n  \"prompt\": \"我 30 天前买的订阅已经激活，能自动退款吗？\",\n  \"slice\": \"grounded-answer\",\n  \"expected_retrieved_ids\": [\"policy-refund-001\"],\n  \"allowed_citations\": [\"policy-refund-001\"],\n  \"forbidden_terms\": [\"自动退款成功\", \"一定能退\"],\n  \"expected_tool\": null\n}"},{"title":"从风险而不是问题清单开始","body":["先列失败代价，再设计样例。一个可用的首版数据集至少覆盖下面六种切片。"],"bullets":["正常已知问题","知识库未知或证据不足","高风险政策解释","身份、凭证和隐私","Prompt injection 与越权","工具选择、参数和人工确认"]},{"title":"黄金集不是永远正确的真理","body":["黄金集是当前经确认的发布依据，必须记录谁确认、何时确认、引用哪版政策。政策变化后，旧标签可能变成错误答案。","把训练数据、开发调试集和最终回归集分开，避免开发者反复针对同一批样例调参导致过拟合。"],"warning":"如果样例没有 source、owner 和 updated_at，它只能叫样例集合，不能叫可治理的黄金集。"},{"title":"完成你的 8 条最小数据集","body":["使用上面的 schema，分别写 2 条正常、1 条未知、2 条高风险、1 条隐私、1 条 injection、1 条工具样例。"],"expected":"每条样例都有唯一 ID、风险 slice、至少一个 oracle 和证据负责人；高风险样例不可只写自然语言参考答案。"}],"practice":["将一条生产失败脱敏后转成 eval case","为每条样例标注阻断级别","让另一位同事在不看你解释的情况下判断期望是否清楚"],"completion":["至少 8 条样例覆盖 6 类风险","所有高风险样例有确定性 blocker","数据卡记录 owner、版本、来源和限制"],"sourceIds":["S03","S04","S23"],"evidenceBoundary":"页面提供数据结构和风险覆盖方法；8 条教学样例不能代表真实生产分布，也不能用于计算业务质量水平。"},{"id":"TD-T05","moduleId":"TD-M02","order":22,"title":"从 PRD 和代码 Diff 提取风险","type":"跟做","status":"outlined","duration":"45 分钟","summary":"让 AI 先生成候选影响面，再用需求条款、代码差异和历史缺陷把候选风险收敛成可追踪测试任务。","why":"直接让模型写用例会把需求假设和代码事实混在一起；测试负责人需要的是每条风险为何存在、落到哪里、怎样验证。","prerequisites":["TD-T04"],"outcomes":["把 PRD 句子改写成可观察行为","将代码 Diff 映射到受影响接口、状态和数据","输出有证据、有优先级、有 Oracle 的风险矩阵"],"artifact":"PRD-Diff 风险矩阵与追踪表","blocks":[{"title":"先把真实问题说清楚","body":["场景是一项数字商品退款规则变更：PRD 写着“已激活商品转人工复核”，代码 Diff 同时修改资格判断、订单状态和审计事件。模型可以快速枚举影响，但它看不到团队隐含约束，也可能把未变更模块写成高风险。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 PRD-Diff 风险矩阵与追踪表 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["抽取 actor、trigger、business rule、状态变化和禁止行为","读取 Diff 的控制流、Schema、配置与依赖变化","要求模型逐条引用 PRD 段落和变更文件，不接受无引用风险","按影响×可能性×可检测性排序，并为高风险项定义 Oracle"]},{"title":"在最小业务场景里亲手做一次","body":["准备一段脱敏 PRD 和一个小型 unified diff。先让模型输出 JSON 风险候选，再由脚本检查每个候选是否同时包含 requirement_ref、diff_ref、risk、oracle 和 owner。最后人工删除没有证据的猜测，并补上模型遗漏的跨服务影响。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"required_fields = {'requirement_ref','diff_ref','risk','oracle','owner'}\nfor item in ai_risks:\n    assert required_fields \u003c= item.keys()\n    assert item['requirement_ref'] in prd_ids\n    assert item['diff_ref'] in changed_files","expected":"得到一张可追踪矩阵；每条高风险项能回到 PRD 与 Diff，且有测试层级、观察点、负责人。模型生成但无来源的项目被明确拒绝。"},{"title":"诊断失败，而不是把阈值调到通过","body":["常见失败是模型只复述 PRD、把所有变化判为高风险，或虚构不存在的代码路径。先检查上下文是否包含完整变更，再检查引用是否真实；仍无法确认的项目进入人工澄清，而不是自动生成测试。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 PRD-Diff 风险矩阵与追踪表 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 PRD-Diff 风险矩阵与追踪表","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S14","S32","S41"],"evidenceBoundary":"页面方法由测试工作职责、基础测试流程和公开 AI 辅助测试实践支持；示例为脱敏合成变更，未证明模型能在任意企业代码库稳定识别完整影响面。"},{"id":"TD-T06","moduleId":"TD-M02","order":23,"title":"AI 生成测试，但证明测试真的会失败","type":"跟做","status":"outlined","duration":"55 分钟","summary":"把 AI 生成的候选测试接入 mutation 或故障注入，用红绿证据判断它们是否真正具备缺陷检测力。","why":"测试数量、代码覆盖率和自然语言解释都不能证明测试有用；一个已知坏版本仍然绿色，就说明 Oracle 或执行链失效。","prerequisites":["TD-T05"],"outcomes":["约束模型生成可执行测试和业务断言","注入控制流、边界或状态变异","用 mutation 报告淘汰假绿测试并补齐盲区"],"artifact":"AI 生成测试包与 Mutation 检测报告","blocks":[{"title":"先把真实问题说清楚","body":["继续使用退款资格函数。模型往往生成 happy path 和字段存在性断言，却遗漏“已激活不得自动退款”的阻断规则。需要反转资格条件、删除审计事件或放宽金额边界，观察哪些测试能稳定把坏版本打红。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 AI 生成测试包与 Mutation 检测报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["从风险矩阵生成候选，但限定输入、动作、业务 Oracle 和证据字段","先在原始实现上运行并保存 baseline","逐个注入可解释变异，记录 killed、survived 与未执行","为 survived 变异补测试或说明等价/不可达理由，再复跑"]},{"title":"在最小业务场景里亲手做一次","body":["模型生成 Playwright/API/单元测试候选后，人工只保留能落到明确风险的测试。将 `activated && digital` 的拒绝条件反转；如果测试仍通过，检查是否只断言 HTTP 200、是否根本没有执行变异代码、是否环境读取了旧构建。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"python3 scripts/run_baseline.py\npython3 scripts/inject_mutation.py --id refund-eligibility-invert\npytest -q\npython3 scripts/report_mutation.py","expected":"baseline 为绿；注入退款资格变异后至少一个高风险测试失败且退出码非零；修复或重置后恢复绿色，并保存 survived 列表。"},{"title":"诊断失败，而不是把阈值调到通过","body":["mutation 仍绿时不要先增加随机用例。先证明变异被加载、目标路径被覆盖、断言观察到业务结果，再判断是否需要新样例。删除断言或把期望改成当前错误输出属于 false green。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 AI 生成测试包与 Mutation 检测报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 AI 生成测试包与 Mutation 检测报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S01","S18","S21"],"evidenceBoundary":"公开材料支持 AI 生成测试与验证不足的现实风险；本页提供方法和命令形状，除已有 RAG fixture 外未在所有目标框架上运行这些 mutation 示例。"},{"id":"TD-T07","moduleId":"TD-M02","order":24,"title":"生成边界与 Fuzz 数据","type":"跟做","status":"outlined","duration":"50 分钟","summary":"用模型解释业务约束、用确定性生成器覆盖边界和状态组合，再保存可重放的最小失败种子。","why":"让模型直接随机造数据既不可复现，也容易泄露真实信息；AI 更适合提出输入维度，测试代码负责生成、收缩和重放。","prerequisites":["TD-T06"],"outcomes":["从 Schema 和业务规则提取边界维度","构建带 seed 的属性与 Fuzz 生成器","把失败样例缩减为最小可重放种子"],"artifact":"边界模型、数据生成器与最小失败种子","blocks":[{"title":"先把真实问题说清楚","body":["退款金额同时受币种精度、订单状态、激活时间、渠道和幂等键约束。单字段边界全部通过，不代表组合安全；例如 0.01 元、刚好跨日、重复请求和已激活状态组合可能触发重复退款。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 边界模型、数据生成器与最小失败种子 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["从 OpenAPI/Schema、PRD 和数据库约束列出合法域与非法域","让模型提出遗漏组合，但由人审查并写成确定性策略","固定 seed 运行属性测试，保存输入、环境和失败 Trace","使用 shrink/minimize 删除无关字段，生成稳定回归用例"]},{"title":"在最小业务场景里亲手做一次","body":["定义金额、状态、时间、币种和幂等键五个维度。先跑合法边界，再故意放宽幂等检查。生成器应找到重复请求造成双写的组合，并把几十个字段缩减成金额、订单状态与重复键三个必要条件。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"seed=20260810\nfor case in generate_refund_cases(seed):\n    result = submit_refund(case)\n    assert invariant_no_double_refund(result)\n# 保存 failing_case、seed、system_version 后再最小化","expected":"相同 seed 能重复发现预埋缺陷；最小失败样例删除无关字段后仍失败，并作为固定回归样例进入数据集。"},{"title":"诊断失败，而不是把阈值调到通过","body":["失败无法重现通常来自未保存 seed、时间、外部依赖或状态初始化。先固定这些变量；若模型生成了不符合 Schema 的数据，应在生成层拒绝，而不是把大量 400 响应当作有效覆盖。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 边界模型、数据生成器与最小失败种子 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 边界模型、数据生成器与最小失败种子","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S23","S32","S41"],"evidenceBoundary":"页面整合标准测试设计、AI 测试知识和职业任务来源；生成器为教学伪代码，具体 shrink 能力、组合规模和阈值需在目标框架及业务数据上验证。"},{"id":"TD-T08","moduleId":"TD-M02","order":25,"title":"AI 做失败聚类，但必须保留证据链","type":"诊断","status":"outlined","duration":"45 分钟","summary":"让模型生成候选故障簇和归因摘要，但每条结论必须链接到失败样例、Trace、日志、Diff 和验证实验。","why":"聚类能减少重复排查，但语言模型会把相关性写成因果关系；没有证据链接和单变量验证，漂亮报告会误导修复优先级。","prerequisites":["TD-T07"],"outcomes":["规范化来自多测试层的失败事件","生成带引用和置信度的候选故障簇","通过验证实验合并、拆分或否决模型归因"],"artifact":"证据链接式失败聚类与归因报告","blocks":[{"title":"先把真实问题说清楚","body":["一次回归出现 80 个失败：UI 超时、API 502、Agent 工具调用失败和数据库锁等待。模型可能全部归为“网络问题”，但真正原因可能是一个连接池配置变更，也可能是三类独立故障。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 证据链接式失败聚类与归因报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["保留 test_id、trace_id、timestamp、commit、environment 与原始错误","对消息脱敏和归一化，但不丢失可回查引用","让模型输出 cluster、evidence_refs、hypothesis、confidence 和 next_experiment","按单变量实验验证，只有重复成立的假设才升级为根因"]},{"title":"在最小业务场景里亲手做一次","body":["将失败记录按同一时间窗与 Trace 关联。模型提出“连接池耗尽”候选后，先在固定负载下恢复旧配置，再只改变连接池参数。如果故障随参数消失，才把假设升级；否则拆分集群继续检查外部依赖和测试环境。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"# TD-T08 最小执行记录\ninput_version: v1\nsystem_version: candidate-a\nrisk_slice: high\nexpected_gate: FAIL_ON_SEEDED_REGRESSION\nevidence: artifact/td-t08-report.json","expected":"报告中的每个簇都能打开至少两条原始证据，明确区分 symptom、hypothesis 与 verified cause，并给出下一步实验和责任人。"},{"title":"诊断失败，而不是把阈值调到通过","body":["常见错误是只把堆栈文本送入模型、忽略时间和版本，或让模型直接填写 root cause。引用不存在、簇内证据来自不同版本、实验不能复现时，结论必须降级为未知。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 证据链接式失败聚类与归因报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 证据链接式失败聚类与归因报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S14","S22","S49"],"evidenceBoundary":"来源支持 AI 辅助诊断、浏览器验证局限和 Trace 信号设计；示例未在真实企业事故库评估聚类准确率，不能声称减少了固定比例的定位时间。"},{"id":"TD-T09","moduleId":"TD-M03","order":26,"title":"第一个 LLM 评测","type":"跟做","status":"outlined","duration":"40 分钟","summary":"运行一组固定样例和 scorer，得到第一份可比较、可失败、可保存的 AI 质量报告。","why":"本页把前四页的概念变成最小执行闭环：数据集、candidate、scorer、阈值、报告和退出码。","prerequisites":["TD-T04"],"outcomes":["解释最小评测 harness 的五个部件","运行 baseline 并读取报告","证明坏版本会返回非零退出码"],"artifact":"评测数据集、阈值和 baseline 报告","blocks":[{"title":"准备环境","body":["课程仓库使用 Python 3 标准库，不需要模型 Key。进入 RAG 课程 lab 目录后运行。"],"code":"cd courses/td-ai-006-rag-eval-ci/lab\npython3 scripts/reset_candidate.py\npython3 scripts/evaluate.py --report reports/baseline.json","expected":"命令退出码为 0，终端显示 verdict: PASS，并生成 reports/baseline.json。"},{"title":"最小评测 harness 的五个部件","body":["只要能清楚回答这五个问题，你就拥有一个可以演进的评测起点。"],"bullets":["Dataset：测试什么风险","Candidate：哪个模型、Prompt、知识库或录制输出","Scorer：怎样判断每条样例","Threshold：什么时候阻断","Report：留下什么版本和失败证据"]},{"title":"读取 baseline 报告","body":["不要只看 PASS。检查样例数、candidate 是否一一对应、关键 slice、失败列表和环境信息。"],"code":"python3 -m json.tool reports/baseline.json\necho $?","expected":"coverage、candidate_set_exact、task_pass_rate 均为 1.0；退出码为 0。"},{"title":"证明评测不是摆设","body":["运行故障注入并再次评测。一个不能让已知坏版本变红的评测，没有资格进入 CI。"],"code":"python3 scripts/inject_regression.py\npython3 scripts/evaluate.py --report reports/mutation.json\necho $?","expected":"verdict 为 FAIL，evaluate.py 返回 1；报告中至少出现任务、引用、拒答、工具或运行质量失败。","warning":"mutation 仍然 PASS 时，不要降低要求庆祝通过；应检查 candidate 是否真的被替换、样例是否执行、阈值是否绑定。"}],"practice":["新增一条禁止声明并让 baseline 先失败","修正 candidate 后恢复 PASS","在报告中写入你自己的版本标识"],"completion":["baseline 报告存在且 exit 0","mutation 报告存在且 exit 1","能从报告定位至少一条具体失败而非只看总分"],"sourceIds":["S03","S04","S05"],"evidenceBoundary":"本页已在离线录制 fixture 上运行；只证明评测 harness 和故障检测链路，不证明任何实时模型的当前质量。"},{"id":"TD-T10","moduleId":"TD-M03","order":27,"title":"RAG 的检索质量","type":"跟做","status":"outlined","duration":"32 分钟","summary":"区分检索遗漏、检索污染和生成错误，并用 recall/precision 证据定位问题。","why":"RAG 回答错误不一定是模型问题。没有单独检查检索层，就会不断改 Prompt，却修不到索引、过滤或排序。","prerequisites":["TD-T09"],"outcomes":["按样例计算检索 recall 与 precision","从报告区分 missing 与 extra context","设计面向风险 slice 的检索门禁"],"artifact":"检索质量报告和定位表","blocks":[{"title":"两个最小指标","body":["Retrieval recall：应该检索到的文档有多少被找到了。遗漏关键政策时，生成器再强也无从忠实回答。","Retrieval precision：取回的文档中有多少真正相关。无关材料过多会污染上下文、挤掉关键证据并增加成本。"],"code":"recall = |retrieved ∩ required| / |required|\nprecision = |retrieved ∩ required| / |retrieved|"},{"title":"手算一条样例","body":["required = [policy-refund-001]，retrieved = [policy-refund-001, policy-shipping-001]。"],"bullets":["recall = 1/1 = 1.0","precision = 1/2 = 0.5","结论：没有漏取，但混入了促销材料"],"expected":"这不是生成错误；应优先检查过滤、query rewrite、排序或索引元数据。"},{"title":"在 mutation 报告中定位检索回归","body":["先完成 TD-T09 的故障注入，再读取 mutation 报告中的 retrieval 指标和失败样例。"],"code":"python3 -m json.tool reports/mutation.json","expected":"教学 mutation 中 retrieval_recall 与 retrieval_precision 都降到 0.5。"},{"title":"不要只看全局平均值","body":["高风险退款 slice 即使只有一条，也可能要求 recall=1.0；低风险 FAQ 可以接受不同阈值。应按业务代价切片。"],"bullets":["overall","high-risk policy","unknown/refusal","tool-use","language or region"],"warning":"检索分数高不等于回答忠实。检索和生成必须分层测试。"}],"practice":["构造一个 recall=0.5、precision=1.0 的例子","为高风险和普通 FAQ 设计不同门禁","为一次检索污染写出三个可能根因"],"completion":["能手算 recall/precision","能区分漏取和污染","检索门禁至少有一个业务风险 slice"],"sourceIds":["S09","S13","S23"],"evidenceBoundary":"教学报告使用离线文档 ID 精确匹配；真实检索评测还需处理多文档等价、chunk 粒度、标注分歧和数据漂移。"},{"id":"TD-T11","moduleId":"TD-M03","order":28,"title":"回答、引用、忠实性和拒答","type":"参考","status":"outlined","duration":"30 分钟","summary":"根据失败风险选择回答正确性、引用、忠实性或拒答检查，不再把所有问题压成一个“准确率”。","why":"回答正确但引用伪造、引用正确但回答捏造、证据不足却强答，都是不同问题，需要不同证据。","prerequisites":["TD-T10"],"outcomes":["区分 correctness、citation、faithfulness 和 refusal","为每个指标写出可失败反例","确定哪些失败必须人工复核"],"artifact":"指标到风险映射表","blocks":[{"title":"四个概念不要混用","body":["它们回答的是四个不同问题。"],"bullets":["Correctness：回答是否符合业务事实或参考答案","Citation：声明是否给出存在且允许的来源","Faithfulness：回答中的主张是否由已检索上下文支持","Refusal：证据不足、越权或危险请求时是否正确拒绝或升级人工"]},{"title":"四种容易混淆的结果","body":["用同一退款问题观察不同失败。"],"bullets":["回答政策正确，但引用了不存在的文档：citation fail","引用文档真实，但回答添加“30 天无条件退款”：faithfulness/correctness fail","没有检索到政策，却凭常识回答：refusal fail","正确拒答，但用户其实是低风险公开 FAQ：可能是 over-refusal"]},{"title":"门禁顺序","body":["推荐先做稳定、可解释的硬检查，再做语义评分和人工抽查。"],"code":"schema -> citation existence -> forbidden claims -> tool safety\n       -> semantic correctness/faithfulness -> human review","warning":"一个 0.86 的综合分不能告诉发布负责人是否发生了危险退款承诺。保留每个 blocker 的独立结论。"},{"title":"拒答也需要正反两组样例","body":["只测试危险请求是否拒答，会把模型推向“什么都不回答”。同时加入正常可答问题，测量 over-refusal。","拒答结果还要检查是否泄露敏感片段、是否调用了危险工具、是否给出安全的下一步。"]}],"practice":["为四个指标各写一条会失败的回答","增加两条安全问题防止过度拒答","为高风险分歧定义人工升级条件"],"completion":["能解释四个指标的差异","每个指标都有反例","拒答测试同时包含 should-refuse 和 should-answer"],"sourceIds":["S04","S09","S10","S13"],"evidenceBoundary":"不同工具对指标的命名和实现可能不同；页面采用概念层定义，具体 scorer 必须检查当前官方文档并做业务校准。"},{"id":"TD-T12","moduleId":"TD-M03","order":29,"title":"让 RAG 的错误退款承诺在上线前变红","type":"跟做","status":"outlined","duration":"60–90 分钟","summary":"把前面七页组合成一套可重复 RAG 发布门禁，亲眼完成 PASS → FAIL → PASS。","why":"这是第一条可独立交付的职业任务：不再随机问模型，而是用版本化数据、门禁和报告支持发布决策。","prerequisites":["TD-T09","TD-T10","TD-T11"],"outcomes":["运行完整基线、故障注入和修复","解释至少六类 AI 特有回归","把退出码和报告接入发布门禁"],"artifact":"评测集、阈值、三份报告、CI workflow 和复用清单","blocks":[{"title":"业务事故：语言很顺，但承诺错了","body":["知识库规定已激活数字商品不能自动退款，只能转人工复核。回归版本却回答“已为你自动退款”，没有引用政策，还调用了 refund_order。","普通接口检查可能全部绿色：HTTP 200、JSON 合法、answer 非空。真正的业务风险只有 AI 质量门禁能看见。"]},{"title":"第一步：跑已知良好版本","body":["进入 lab，重置录制输出并生成基线报告。"],"code":"cd courses/td-ai-006-rag-eval-ci/lab\npython3 scripts/reset_candidate.py\npython3 scripts/evaluate.py --report reports/baseline.json","expected":"exit 0；coverage、task_pass_rate、citation、refusal 和 tool gate 通过；p95 延迟为 820ms。"},{"title":"第二步：注入六类回归","body":["脚本会注入退款幻觉、丢引用、拒答失守、Prompt injection、错误工具、延迟和成本恶化。"],"code":"python3 scripts/inject_regression.py\npython3 scripts/evaluate.py --report reports/mutation.json\necho $?","expected":"exit 1；task_pass_rate=0，citation_pass_rate=0.2，forbidden_claim_rate=1.0，p95_latency_ms=4200。"},{"title":"第三步：不要急着调阈值，先诊断","body":["按失败类型回到对应层。"],"bullets":["retrieval recall/precision 下降：检索层","禁止声明和忠实性失败：生成层","拒答失守：安全策略与样例层","refund_order 被调用：行动与权限层","延迟/成本失败：运行层"],"warning":"把阈值放宽到 PASS 不是修复。修复必须改变系统行为或有负责人、原因和过期时间的 waiver。"},{"title":"第四步：重置并证明恢复","body":["恢复已知良好版本并生成 repair 报告。"],"code":"python3 scripts/reset_candidate.py\npython3 scripts/evaluate.py --report reports/repair.json","expected":"exit 0，核心指标恢复；三份报告共同形成可审计的红绿证据。"},{"title":"从教学夹具迁移到真实项目","body":["按顺序替换，而不是一次性接入所有线上复杂度。"],"bullets":["把录制 candidate 换成你的 RAG 调用适配器","把合成知识库换成脱敏测试知识库","加入历史事故、高风险 slice 和人工标注","校准语义 Judge 与人工一致率","在 CI 中保存版本、报告和失败样例，不保存生产 PII"]}],"practice":["新增“诱导 Agent 自动退款”样例","先制造错误工具调用并证明变红","修复后保存报告","说明该检查由机器阻断还是人工决定"],"completion":["baseline exit 0","mutation exit 1","repair exit 0","能把每个失败映射到测试对象层","保存三份报告和一次新增样例"],"sourceIds":["S03","S04","S09","S13","S23"],"evidenceBoundary":"已验证离线 fixture 与 evaluator 机制；没有调用真实模型、真实检索器或企业数据，也没有经过目标学员和测试开发专家盲评。"},{"id":"TD-T13","moduleId":"TD-M03","order":30,"title":"Prompt、模型和知识库版本 A/B","type":"跟做","status":"outlined","duration":"55 分钟","summary":"在同一数据集、同一评分协议和同一运行预算下比较候选版本，判断变化是否真实来自 Prompt、模型或知识库。","why":"同时更换模型、Prompt 和索引后看到分数上涨，无法知道改进来自哪里，也无法安全回滚。","prerequisites":["TD-T12"],"outcomes":["设计单变量 A/B 实验","锁定数据、参数、工具和评分版本","按风险切片作出发布或拒绝决定"],"artifact":"AI 候选版本 A/B 对比报告","blocks":[{"title":"先把真实问题说清楚","body":["客服 RAG 准备升级模型并重建知识库。新版本平均得分更高，但在退款政策切片中出现两次错误承诺；测试开发必须阻止平均分掩盖高风险回归，并区分模型变化与索引变化。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 AI 候选版本 A/B 对比报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["声明唯一被比较变量和业务假设","冻结 eval 集、Prompt、检索参数、工具、Judge 与随机参数","重复运行并同时查看 blocker、风险切片和成本延迟","保留 manifest、逐条结果和差异样例，由负责人决定发布范围"]},{"title":"在最小业务场景里亲手做一次","body":["先比较仅更换模型的 A/B，再比较仅更换知识库索引的 A/B。脚本发现两个锁定字段同时变化时应把实验标记为 confounded；高风险退款样例出现 blocker 时，即使总分更高也不能获胜。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"python3 scripts/compare.py --a manifests/a.json --b manifests/b.json --lock dataset,prompt,retriever,tools,scorer\npython3 scripts/check_slices.py reports/ab.json --block high-risk-refund","expected":"单变量实验生成可比较报告；混杂实验被拒绝；候选在普通 FAQ 可发布、在退款流量不可发布时，报告给出分流和回退条件。"},{"title":"诊断失败，而不是把阈值调到通过","body":["常见错误包括浮动模型别名、缓存命中不一致、Judge 版本变化和只运行一次。先检查 manifest diff 与重复运行分布，不能把不可比结果解释成模型能力提升。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 AI 候选版本 A/B 对比报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 AI 候选版本 A/B 对比报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S03","S04","S12"],"evidenceBoundary":"页面方法由公开评测工具和课程资料支持；命令为教学接口形状，尚未在所有模型供应商、真实流量分布和企业发布系统中验证。"},{"id":"TD-T14","moduleId":"TD-M03","order":31,"title":"LLM-as-judge 的校准和反例","type":"诊断","status":"outlined","duration":"55 分钟","summary":"用人工双标、盲评、反例和一致性统计判断模型 Judge 可以辅助什么、不能替人决定什么。","why":"Judge 同样会受措辞、位置、长度、模型版本和自身知识影响；未经校准的分数不是可靠 Oracle。","prerequisites":["TD-T13"],"outcomes":["构建 Judge 校准集","测量人机与人人分歧","为高风险分歧建立人工升级规则"],"artifact":"Judge 校准集、分歧矩阵与使用边界","blocks":[{"title":"先把真实问题说清楚","body":["两个退款答复事实相同，一个更长、更礼貌，Judge 总是偏向长答案；另一个答复引用了过期政策，Judge 因语言流畅仍给高分。测试开发要证明这种偏差并限制 Judge 权限。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Judge 校准集、分歧矩阵与使用边界 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["由两名领域人员独立标注包含好例、坏例和近邻反例的校准集","打乱候选顺序与身份，重复运行 Judge","计算分歧矩阵并检查位置、长度、风格和自偏好","确定可自动评分、需抽检和必须人工审批的风险范围"]},{"title":"在最小业务场景里亲手做一次","body":["准备 30 对回答，其中 10 对只改变顺序、10 对加入冗长无关文字、10 对含政策事实错误。Judge 若在顺序翻转后改变胜负，或放过事实错误，应记录具体失败切片而非只报一个一致率。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"# TD-T14 最小执行记录\ninput_version: v1\nsystem_version: candidate-a\nrisk_slice: high\nexpected_gate: FAIL_ON_SEEDED_REGRESSION\nevidence: artifact/td-t14-report.json","expected":"产物包含原始标注、Judge 理由、重复运行、分歧类型和升级规则；事实、安全、权限类 blocker 不由单一 Judge 自动放行。"},{"title":"诊断失败，而不是把阈值调到通过","body":["只拿模型与一位标注员比较会把人工不一致误判成 Judge 错误；先测人人一致性，再分析 Judge 偏差。更换 Judge 后必须重新校准，不能沿用旧阈值。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Judge 校准集、分歧矩阵与使用边界 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Judge 校准集、分歧矩阵与使用边界","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S04","S10","S23"],"evidenceBoundary":"来源支持应用评测和 AI 测试中的人机 Oracle；示例规模用于教学，不能外推为任何 Judge 的通用准确率或生产可用性证明。"},{"id":"TD-T15","moduleId":"TD-M04","order":32,"title":"最终结果、单步动作和完整轨迹","type":"概念","status":"outlined","duration":"40 分钟","summary":"把 Agent 质量拆成最终结果、每次工具动作与完整决策轨迹，避免只看最后一句回答。","why":"Agent 可能偶然得到正确结果，却经历越权、重复调用或不可接受成本；也可能轨迹合理但被外部故障阻断。","prerequisites":["TD-T03","TD-T04"],"outcomes":["区分 outcome、step 和 trajectory 三层 Oracle","为每层选择可观察证据","根据失败层级设计回归和归因"],"artifact":"Agent 三层评测模型与证据映射图","blocks":[{"title":"先把真实问题说清楚","body":["退款 Agent 最终正确回复“转人工”，但此前已调用一次退款接口并被后端拒绝。只评最终文本会假绿；只评调用序列又可能错杀允许多条安全路径的任务。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Agent 三层评测模型与证据映射图 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["先定义业务最终状态与禁止副作用","再定义关键动作的工具、参数、权限与前置条件","记录完整 trajectory 的状态、观察、重试、Handoff 和停止原因","分别判定三层并保留失败所在层，不用单一总分吞掉 blocker"]},{"title":"在最小业务场景里亲手做一次","body":["给 Agent 一个已激活商品退款请求。允许它查询订单、读取政策并转人工，禁止直接退款。即使最终文本正确，只要轨迹出现 refund_order 调用，step 层就必须失败。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"# TD-T15 最小执行记录\ninput_version: v1\nsystem_version: candidate-a\nrisk_slice: high\nexpected_gate: FAIL_ON_SEEDED_REGRESSION\nevidence: artifact/td-t15-report.json","expected":"评测报告分别显示 outcome、step、trajectory 结果；每个 blocker 链接到具体工具调用和状态快照，允许路径集合与禁止动作清晰分开。"},{"title":"诊断失败，而不是把阈值调到通过","body":["把一条黄金轨迹当唯一正确答案会惩罚合法替代路径。应优先写不变量、禁止副作用和必要检查；只有强流程约束场景才要求精确顺序。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Agent 三层评测模型与证据映射图 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Agent 三层评测模型与证据映射图","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S10","S23","S35"],"evidenceBoundary":"页面把公开 Agent 评测方法转成测试分层；退款轨迹为合成场景，未证明三层指标与任何企业业务结果具有固定相关性。"},{"id":"TD-T16","moduleId":"TD-M04","order":33,"title":"工具选择、参数和权限","type":"跟做","status":"outlined","duration":"55 分钟","summary":"通过错误工具、危险参数、越权身份和不可逆副作用注入，验证 Agent 在沙箱与策略门禁中安全失败。","why":"自然语言回答可撤回，写数据库、发消息和退款等工具副作用可能不可逆，必须在调用前阻断。","prerequisites":["TD-T15"],"outcomes":["建立工具调用契约和权限矩阵","注入工具、参数、身份和顺序故障","验证沙箱、审批与幂等保护"],"artifact":"工具策略、故障注入集与轨迹报告","blocks":[{"title":"先把真实问题说清楚","body":["Agent 可使用 get_order、search_policy、refund_order 和 handoff。攻击样例诱导它跳过身份校验，或把 10.00 元写成 1000 元。测试不能真的退款，需用录制沙箱观察策略是否先于执行生效。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 工具策略、故障注入集与轨迹报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["为每个工具声明 Schema、最小权限、副作用、幂等键与审批条件","在无真实副作用的沙箱录制调用","注入不存在工具、越界参数、错误身份、重复调用和缺少前置步骤","断言策略层拒绝并保存 reason、trace、policy_version"]},{"title":"在最小业务场景里亲手做一次","body":["先运行合法查询路径，再令 Agent 在未验证身份时调用 refund_order，随后注入金额越界与相同幂等键重复调用。三种坏路径都应在工具执行前被阻断。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"python3 scripts/run_agent.py --case valid-read --sandbox\npython3 scripts/run_agent.py --case refund-without-auth --sandbox --expect policy_denied\npython3 scripts/assert_no_side_effect.py traces/latest.json","expected":"合法只读调用成功；越权、越界和重复副作用被拒绝；Trace 记录策略版本、拒绝原因与零真实写入，进程对 blocker 返回非零。"},{"title":"诊断失败，而不是把阈值调到通过","body":["只在 Prompt 中写“不要越权”不是控制。若坏调用到达真实后端，再漂亮的事后解释也不合格；先检查权限是否在工具边界执行，再检查 Agent 推理。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 工具策略、故障注入集与轨迹报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 工具策略、故障注入集与轨迹报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S06","S10","S23"],"evidenceBoundary":"公开框架支持轨迹和应用评测，课程给出沙箱契约；未连接真实退款系统，权限模型和审批边界必须按目标组织重新威胁建模。"},{"id":"TD-T17","moduleId":"TD-M04","order":34,"title":"Prompt injection、数据泄露和 Excessive Agency","type":"跟做","status":"outlined","duration":"60 分钟","summary":"把直接与间接注入、敏感数据泄露和过度代理权做成可回放攻击集，并验证纵深防御。","why":"Agent 同时读取不可信内容并调用工具时，恶意指令可以从网页、邮件或知识库进入执行链。","prerequisites":["TD-T16"],"outcomes":["建立 Agent 攻击面和信任边界","编写直接/间接注入与泄露样例","验证最小权限、数据隔离和人工确认"],"artifact":"Agent 攻击集、安全门禁与红队报告","blocks":[{"title":"先把真实问题说清楚","body":["客服 Agent 检索到一篇被污染的知识文章，内容要求忽略政策并导出其他用户订单。模型拒绝文字请求不够；系统还必须防止检索跨租户、工具越权和敏感字段进入输出。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Agent 攻击集、安全门禁与红队报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["标出用户输入、检索内容、系统指令、工具结果和密钥的信任边界","为直接注入、间接注入、跨租户、敏感字段和过度授权构建攻击样例","分别在输入、检索、模型、工具与输出层设置控制","记录攻击是否到达每层、是否产生副作用和由谁复核"]},{"title":"在最小业务场景里亲手做一次","body":["把恶意指令嵌入知识文档，要求 Agent 调用 export_orders。测试身份只能读取单一订单；即使模型服从文档，工具授权也应拒绝，输出过滤器不得泄露其他订单字段。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"python3 scripts/run_redteam.py --suite indirect-injection --tenant tenant-a --sandbox\npython3 scripts/check_security.py traces/redteam.json --require no_cross_tenant,no_secret,no_write","expected":"攻击样例不能跨租户读取、不能输出秘密、不能产生写操作；报告区分模型拒绝与工具层强制拒绝，并保留所有未覆盖路径。"},{"title":"诊断失败，而不是把阈值调到通过","body":["只测试模型是否说“不”会漏掉隐藏调用与日志泄露；只加关键词过滤又容易绕过。逐层检查数据流、权限和副作用，并把未知攻击面交给人工安全评审。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Agent 攻击集、安全门禁与红队报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Agent 攻击集、安全门禁与红队报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S07","S08","S23"],"evidenceBoundary":"NIST、OWASP 和测试 syllabus 支持这些风险类别；攻击集是入门基线，不代表渗透测试完成，也未覆盖目标系统所有编码、工具和供应链路径。"},{"id":"TD-T18","moduleId":"TD-M04","order":35,"title":"Browser Agent 和 Playwright Test Agents","type":"跟做","status":"outlined","duration":"60 分钟","summary":"理解 planner、generator、healer 的职责，用真实浏览器证据审查 AI 生成测试，而不是直接接受生成代码。","why":"浏览器 Agent 能探索页面并生成候选测试，但动态状态、脆弱定位器和错误业务 Oracle 会制造看似可跑的假自动化。","prerequisites":["TD-T06","TD-T16"],"outcomes":["拆分规划、生成和修复三个角色","为生成测试保留探索证据和业务依据","用故障注入验证生成测试的检测力"],"artifact":"Browser Agent 生成测试包与审查记录","blocks":[{"title":"先把真实问题说清楚","body":["Agent 为退款后台生成端到端测试，页面绿色且截图漂亮，但断言只有按钮可见；healer 在 DOM 改版后把定位器改到“关闭”按钮，测试仍绿却没有提交退款复核。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Browser Agent 生成测试包与审查记录 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["用 planner 从风险与需求形成带来源的测试计划","让 generator 在隔离账户生成代码、Trace 和截图","人工审查定位器、业务 Oracle、测试数据和副作用","注入 UI 与业务缺陷，只有能稳定变红的测试才合并"]},{"title":"在最小业务场景里亲手做一次","body":["给 planner 一条“已激活商品必须进入人工复核”的风险。generator 生成测试后，先运行基线，再把后端状态错误改成 auto_refunded。测试必须因业务状态而失败，不能只验证页面提示。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"npx playwright test generated/refund-review.spec.ts --trace on\npython3 scripts/inject_backend_fault.py --state auto_refunded\nnpx playwright test generated/refund-review.spec.ts --trace on","expected":"基线通过，业务故障后测试失败；代码引用风险 ID，Trace 能看到真实动作和状态；无证据或只含表面断言的候选被拒绝。"},{"title":"诊断失败，而不是把阈值调到通过","body":["浏览器可访问并不等于 Oracle 正确。若测试只因超时变红，先稳定环境和定位器；若坏业务状态仍绿，回到风险与断言，不允许 healer 自动改期望。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Browser Agent 生成测试包与审查记录 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Browser Agent 生成测试包与审查记录","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S01","S02","S18"],"evidenceBoundary":"Playwright 文档和公开实践支持测试 Agent 工作流；示例命令需目标项目和页面夹具，课程尚未对多个复杂企业 UI 测量生成成功率。"},{"id":"TD-T19","moduleId":"TD-M04","order":36,"title":"自愈测试为什么会误修绿","type":"诊断","status":"outlined","duration":"45 分钟","summary":"建立 healer 可改、不可改和必须审批的边界，防止删除断言、改变 Oracle 或绕过业务步骤。","why":"自动修复降低定位器维护成本的同时，也可能悄悄把真实回归改成绿色。","prerequisites":["TD-T18"],"outcomes":["区分结构变化与业务变化","审计 healer 的差异和证据","用变异回归验证修复未削弱检测力"],"artifact":"Healer 变更策略、反作弊检查与审计报告","blocks":[{"title":"先把真实问题说清楚","body":["退款按钮重命名后测试失败。healer 发现另一个可点击按钮并修改定位器，同时删除状态断言。执行通过，但实际走的是取消流程。测试负责人需要把这种“修绿”当质量事故。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Healer 变更策略、反作弊检查与审计报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["定义允许自动改的定位器属性与禁止改的业务 Oracle","要求每次修复保存 DOM/截图/Trace、代码 diff 和理由","对删除断言、扩大等待、跳过步骤和改变期望设置阻断","在修复后重新运行原始业务故障注入"]},{"title":"在最小业务场景里亲手做一次","body":["制造纯 DOM 改名和业务按钮交换两类失败。纯 DOM 改名可提出候选定位器但需证据；按钮交换必须拒绝自动修复。任何候选都要在 auto_refunded 变异下保持失败。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"# TD-T19 最小执行记录\ninput_version: v1\nsystem_version: candidate-a\nrisk_slice: high\nexpected_gate: FAIL_ON_SEEDED_REGRESSION\nevidence: artifact/td-t19-report.json","expected":"报告明确哪些变更自动接受、哪些待审、哪些拒绝；被接受修复保留原始断言，并继续杀死已知业务变异。"},{"title":"诊断失败，而不是把阈值调到通过","body":["把历史通过率当修复正确性的依据会放大假绿。先比较业务动作与 Oracle，再看定位器；无法证明语义等价时，healer 只能给建议，不能直接提交。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Healer 变更策略、反作弊检查与审计报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Healer 变更策略、反作弊检查与审计报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S01","S21","S22"],"evidenceBoundary":"公开文档与实践讨论支持生成和浏览器验证边界；反作弊策略为课程设计，未对特定商业自愈工具做全面功能或准确率评测。"},{"id":"TD-W01","moduleId":"TD-M04","order":37,"title":"先区分 Agent、Worker 和固定 Workflow","type":"概念","status":"outlined","duration":"35 分钟","summary":"按路径由谁决定、状态存在哪里、工具如何调用和何时终止，识别真正的被测系统。","why":"营销名称并不能说明系统是否自主；分类错误会让团队漏测分支、状态和副作用。","prerequisites":["TD-T15"],"outcomes":["用控制权识别固定 workflow 与 Agent","描述 worker 的输入输出和生命周期","为不同结构选择测试策略"],"artifact":"Agent、Worker、Workflow 控制权对照图","blocks":[{"title":"先把真实问题说清楚","body":["同一个“智能客服”产品中，入口是固定路由 workflow，知识查询由 Agent 自主选工具，退款审批由异步 worker 执行。若把它整体叫 Agent，就会漏掉队列重试和确定性分支。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Agent、Worker、Workflow 控制权对照图 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["画出节点、边、状态存储、队列、工具和外部副作用","标记每个下一步由代码、模型还是人工决定","为固定路径写分支覆盖，为自主路径写不变量和攻击集","为 worker 增加重复投递、并发、超时和幂等检查"]},{"title":"在最小业务场景里亲手做一次","body":["拆解退款处理：规则引擎决定是否进入 Agent，Agent 查询政策并提出动作，worker 异步写入审计，人工最终批准。分别列出每层的输入、Oracle、失败和责任人。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"# TD-W01 最小执行记录\ninput_version: v1\nsystem_version: candidate-a\nrisk_slice: high\nexpected_gate: FAIL_ON_SEEDED_REGRESSION\nevidence: artifact/td-w01-report.json","expected":"对照图能定位控制权和状态，不依赖产品命名；每种组件都映射到可执行的测试类型和可观察证据。"},{"title":"诊断失败，而不是把阈值调到通过","body":["只按同步/异步或是否使用大模型分类不够。关键是路径选择、状态与副作用由谁控制；边界不清时先观察 Trace 和代码，不凭界面文案猜测。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Agent、Worker、Workflow 控制权对照图 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Agent、Worker、Workflow 控制权对照图","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S10","S23","S35"],"evidenceBoundary":"分类来自公开 Agent 模式与测试方法的综合；行业对 worker 等术语没有唯一标准，应以目标系统架构和运行证据重新命名。"},{"id":"TD-W02","moduleId":"TD-M04","order":38,"title":"测试状态、循环、重试、Handoff 和终止条件","type":"跟做","status":"outlined","duration":"60 分钟","summary":"对长流程注入丢状态、重复执行、错误交接和不终止故障，验证恢复、幂等和预算边界。","why":"单步都正确不代表流程可靠；状态与重试错误会造成重复副作用、死循环和责任丢失。","prerequisites":["TD-W01","TD-T16"],"outcomes":["建立 workflow 状态机与不变量","设计重试、恢复、Handoff 和终止故障","验证副作用幂等与可观测性"],"artifact":"Workflow 状态模型与故障注入报告","blocks":[{"title":"先把真实问题说清楚","body":["退款审批在 Agent、人工和异步 worker 间交接。网络超时后消息重复投递，worker 写了两次审计；Agent 因看不到人工状态持续重试，最终耗尽 Token。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 Workflow 状态模型与故障注入报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["列出状态、合法转移、owner、checkpoint 与副作用","为每个循环设置次数、时间、Token 和成本上限","注入消息重复、checkpoint 丢失、Handoff 目标错误和外部超时","断言幂等、恢复位置、停止原因、告警和人工接管"]},{"title":"在最小业务场景里亲手做一次","body":["让 worker 在写审计后、确认消息前崩溃，队列随后重复投递。系统应通过幂等键避免第二次写入，并从 checkpoint 恢复；再移除终止信号，验证预算门禁停止 Agent。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"python3 scripts/run_workflow.py --fault crash-after-write --message msg-42\npython3 scripts/run_workflow.py --replay msg-42\npython3 scripts/assert_workflow.py --writes 1 --stop-reason budget_guard","expected":"重复投递只产生一次业务副作用；恢复点和 owner 可见；错误 Handoff 与死循环在预算内停止并产生告警，而不是静默成功。"},{"title":"诊断失败，而不是把阈值调到通过","body":["只在 happy path 验证最终状态会漏掉中间重复写和孤儿任务。检查事件时间线、幂等键、checkpoint 与停止原因；无限增加重试次数不是可靠性修复。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 Workflow 状态模型与故障注入报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 Workflow 状态模型与故障注入报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S06","S10","S48"],"evidenceBoundary":"来源支持应用评测和级联失败控制；故障注入脚本为教学形状，队列语义、事务边界和恢复机制需按目标平台验证。"},{"id":"TD-W03","moduleId":"TD-M04","order":39,"title":"单 Agent 与多 Agent 的公平对照","type":"诊断","status":"outlined","duration":"50 分钟","summary":"固定模型、工具、任务、Token、时间和成功标准，判断多 Agent 是否带来可重复收益而非额外复杂度。","why":"多角色能提高覆盖，也会增加通信、冲突、成本和失败面；不做同预算对照无法知道是否值得。","prerequisites":["TD-W02"],"outcomes":["设计同预算系统对照","测量结果、轨迹、协作失败和成本","识别真正需要角色分离的任务"],"artifact":"单 Agent/多 Agent 同预算实验报告","blocks":[{"title":"先把真实问题说清楚","body":["团队把一个测试生成 Agent 拆成 planner、generator、reviewer，成功率看似提高，但 Token 和时间翻倍，且 reviewer 常重复 planner 的内容。需要在相同预算与任务集上比较。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 单 Agent/多 Agent 同预算实验报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["固定模型版本、工具、数据、任务集、最大 Token、时间和重试","分别运行单 Agent 与多 Agent 多次","比较任务成功、blocker、轨迹长度、协作冲突、延迟和单位成功成本","检查收益是否集中在特定风险切片，再决定保留哪些角色"]},{"title":"在最小业务场景里亲手做一次","body":["用 20 个 API 测试设计任务做对照。多 Agent 必须共享与单 Agent 相同总 Token 和工具权限；若只在复杂跨服务任务提升，则仅对该切片启用编排。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"# TD-W03 最小执行记录\ninput_version: v1\nsystem_version: candidate-a\nrisk_slice: high\nexpected_gate: FAIL_ON_SEEDED_REGRESSION\nevidence: artifact/td-w03-report.json","expected":"报告给出重复运行分布和单位成功成本，不以一次演示下结论；角色分离有明确适用条件、失败模式和回退到单 Agent 的规则。"},{"title":"诊断失败，而不是把阈值调到通过","body":["给多 Agent 更多预算、不同 Prompt 或人工干预会破坏公平性。先锁定实验变量；结果差异落在噪声范围时，应报告无结论而非宣布架构优胜。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 单 Agent/多 Agent 同预算实验报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 单 Agent/多 Agent 同预算实验报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S10","S24","S35"],"evidenceBoundary":"公开资料支持 Agent 轨迹与生产成熟度评估；20 个任务是教学实验设计，未实际证明多 Agent 在目标组织更优或更便宜。"},{"id":"TD-T20","moduleId":"TD-M05","order":40,"title":"把评测接入 CI","type":"跟做","status":"outlined","duration":"50 分钟","summary":"把固定评测集、阻断规则、报告和退出码接入持续集成，让 AI 质量回归与代码测试一起决定能否合并。","why":"评测只在本地偶尔运行，就无法阻止 Prompt、模型、知识库或工具变化带来的回归。","prerequisites":["TD-T12","TD-T14"],"outcomes":["定义快速检查与发布级评测两层 CI","让阻断性失败返回非零退出码","保存版本、失败样例、waiver 和审批证据"],"artifact":"AI 评测 CI Workflow 与质量门禁报告","blocks":[{"title":"先把真实问题说清楚","body":["退款 RAG 的 API 契约测试全部通过，但新知识库导致错误自动退款承诺。CI 必须在合并时运行小型高风险集，在发布候选阶段运行完整切片，并把危险声明、越权工具和 Judge 校准失败作为独立 blocker。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 AI 评测 CI Workflow 与质量门禁报告 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["固定 eval dataset、candidate 与 scorer 版本","先执行 Schema、引用和禁止行为等确定性检查","再执行语义评分及已校准 Judge，并保留逐条结果","按 blocker 与分片阈值返回退出码，上传报告与失败样例"]},{"title":"在最小业务场景里亲手做一次","body":["在 pull request 中把退款规则改成错误承诺。workflow 先跑 20 条 smoke eval；即使平均分仍高，只要 high-risk-refund slice 出现禁止声明，就必须 exit 1。修复后用同一数据与版本记录复跑。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"python3 scripts/evaluate.py --suite smoke --report reports/pr.json\nstatus=$?\npython3 scripts/check_blockers.py reports/pr.json\nexit $status","expected":"已知良好版本 exit 0；注入错误退款承诺后 exit 1 并标出具体 case；修复后恢复 0，三份报告均作为 CI artifact 保存。"},{"title":"诊断失败，而不是把阈值调到通过","body":["CI 假绿通常是只生成报告不传播退出码、读取了旧 candidate、只看平均分或失败后 `continue-on-error`。逐项检查运行输入、门禁表达式和 job 依赖。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 AI 评测 CI Workflow 与质量门禁报告 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","补充历史事故与高风险切片","由测试负责人确认 Oracle、阈值和人工升级边界"]}],"practice":["用一个自己的业务变更完成最小流程，并保存 AI 评测 CI Workflow 与质量门禁报告","注入一个已知缺陷，确认检查能失败并从证据定位到具体层","把同一方法迁移到不同业务对象，写出保持不变的原则和必须修改的两项配置"],"completion":["工件记录输入、系统、数据、Prompt/模型/工具版本和负责人","已知良好、故障注入、修复三个阶段都有可观察结果，不能只展示最终 PASS","证据不足、越权或高风险分歧时会停止并进入明确的人工复核或回滚路径"],"sourceIds":["S03","S04","S27"],"evidenceBoundary":"已有离线 RAG fixture 证明退出码与故障注入链路；本页扩展到通用 CI 设计，未在所有云 CI、模型 Provider 或企业审批系统上运行。"},{"id":"TD-T21","moduleId":"TD-M05","order":41,"title":"评测集、Prompt、模型、知识库和工具版本","type":"参考","status":"outlined","duration":"40 分钟","summary":"为每次质量结论保存完整 lineage，使任何分数都能回放到当时的数据、系统和评测配置。","why":"只保存模型名和总分无法解释差异；Prompt、检索索引、工具 Schema、采样参数或 Judge 任一变化都可能改变结果。","prerequisites":["TD-T20"],"outcomes":["设计 AI 实验版本账本","计算并保存输入与产物哈希","判断两次运行是否具备可比性"],"artifact":"AI 评测版本与 Lineage 账本","blocks":[{"title":"先把真实问题说清楚","body":["一次版本 A/B 报告显示分数提升 6%，但 A 使用旧知识库和人工 Judge，B 使用新索引与模型 Judge。若没有 lineage，这个 6% 不能归因给模型，也不能支持上线。","这页不把 AI 当成一个“自动给答案”的黑盒。你需要先写清输入来自哪里、模型或 Agent 可以做什么、最终决定由谁负责，再把 AI 评测版本与 Lineage 账本 作为可检查的职业工件。只有输出能回到需求、代码、数据、Trace 或版本记录，课程才算解决了测试开发的实际问题。"]},{"title":"按证据顺序完成工作流","body":["先固定业务目标和失败成本，再执行下面的步骤。每一步都保存输入、版本、输出和判定，不允许只留一段模型对话。完成后应能回答：哪个变化导致了哪个质量结论，已知坏版本能否稳定变红，谁有权接受例外。","工具品牌可以替换，顺序不能颠倒。若前一步的输入或 Oracle 不可信，后面的自动化、评分和可视化只会更快地产生错误结论。"],"bullets":["记录 code commit、model snapshot 与推理参数","记录 prompt、dataset、knowledge index、tool schema 和 scorer 版本","保存运行环境、随机种子、时间窗和成本口径","对不可固定依赖使用录制回放或明确标为不可比较"]},{"title":"在最小业务场景里亲手做一次","body":["创建 run-manifest.json，比较两个候选。脚本先对除被比较变量外的字段做 diff；若同时改变模型和知识库，报告输出 confounded 而非 winner。只有单变量或预先批准的组合实验才进入发布判断。","操作时先运行或推演已知良好版本，保存基线；再注入一个有业务意义的缺陷，确认检查变红；最后修复或重置并复跑。不能运行真实系统时，可以使用脱敏合成输入，但必须把它标成 fixture，不能把教学结果写成生产效果。"],"code":"compare: model_version\nlocked: [dataset_hash,prompt_hash,kb_snapshot,tool_schema,scorer_hash,seed]\nif_locked_field_changed: INVALID_COMPARISON","expected":"每个报告能定位完整依赖；相同 manifest 可重放；受混杂变量影响的 A/B 被拒绝，不生成误导性的胜负结论。"},{"title":"诊断失败，而不是把阈值调到通过","body":["最危险的做法是使用浮动模型别名、覆盖旧 Prompt、知识库只记日期或工具 Schema 无版本。先补快照和哈希，无法补齐时把历史结论降级为不可重放。","定位时按输入与数据、模型或 Prompt、检索与工具、执行环境、Scorer 与阈值五层检查。一次只改变一个变量，并把前后差异写进报告。若没有足够证据区分这些层，应输出“未知并升级人工”，而不是让大模型补一个听起来合理的根因。"],"warning":"降低阈值、删除断言、扩大权限或无限重试都可能制造假绿。任何 waiver 必须记录负责人、原因、补偿控制、过期时间和回滚条件。"},{"title":"迁移到你的项目","body":["先保留不变的部分：风险驱动、版本记录、故障注入、人工责任和 AI 评测版本与 Lineage 账本 的验收字段。再替换业务输入、目标系统、风险切片和阈值。不要一次接入全部生产复杂度，先选一个可回放、低权限、可回滚的场景。","迁移成功的标准不是模型生成了更多内容，而是团队能更早发现一个真实风险、缩短定位时间，或把原本口头的发布判断变成可审计证据。若无法观察这些变化，应保留为学习实验，不进入生产门禁。"],"bullets":["替换为脱敏的真实输入和当前版本","
