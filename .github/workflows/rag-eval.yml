name: rag-eval-gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  course-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile factory scripts
        run: python3 -m py_compile skill/career-ai-course-factory/scripts/*.py
      - name: Run fail-closed factory regressions
        run: |
          python3 -m unittest discover -s skill/career-ai-course-factory/scripts -p 'test_*.py'
      - name: Validate the honest fixture-preview release
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "skill/career-ai-course-factory/scripts")
          from validate_public_release import validate_release

          receipt = json.loads(Path("CANDIDATE-VALIDATION.json").read_text(encoding="utf-8"))
          if receipt.get("candidate_structure_valid") is not True or receipt.get("unexpected_errors") != []:
              raise SystemExit(f"candidate validation receipt is not clean: {receipt}")

          errors = validate_release(Path("."))
          allowed = [
              error for error in errors
              if error == "release manifest validation_verdict must be PASS"
              or error.endswith("must be pilot or public")
          ]
          unexpected = [error for error in errors if error not in allowed]
          solution_blockers = [error for error in allowed if error.endswith("must be pilot or public")]
          if unexpected or len(solution_blockers) != 6 or "release manifest validation_verdict must be PASS" not in allowed:
              raise SystemExit(f"unexpected public-preview validation state: unexpected={unexpected}, allowed={allowed}")
          PY
      - name: Execute every downloadable red-green lab
        run: python3 tools/validate-material-archives.py site/materials --skip-source

  offline-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: courses/td-ai-006-rag-eval-ci/lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Adversarial evaluator tests
        run: python3 -m unittest discover -s tests -v
      - name: Evaluate candidate under review
        run: python3 scripts/evaluate.py --candidate data/candidate-current.jsonl --report reports/ci-current.json
      - name: Prove known regression is rejected
        run: |
          if python3 scripts/evaluate.py --candidate data/candidate-regressed.jsonl --report reports/ci-mutation.json; then
            echo "ERROR: known regression unexpectedly passed"
            exit 1
          fi

  agent-load-stability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: courses/td-ai-010-agent-load-stability
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Healthy baseline must pass
        run: python3 lab/agent_load_lab.py --config lab/configs/baseline.json --output evidence/baseline
      - name: Retry storm must fail
        run: |
          if python3 lab/agent_load_lab.py --config lab/configs/retry-storm.json --output evidence/retry-storm; then
            echo "ERROR: retry storm unexpectedly passed"
            exit 1
          fi
      - name: Repaired configuration must pass
        run: python3 lab/agent_load_lab.py --config lab/configs/repaired.json --output evidence/repaired
