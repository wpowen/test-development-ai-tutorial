name: rag-eval-gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  course-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile factory scripts
        run: python3 -m py_compile skill/career-ai-course-factory/scripts/*.py
      - name: Run fail-closed factory regressions
        run: python3 skill/career-ai-course-factory/scripts/test_validator.py
      - name: Validate the published profession package
        run: python3 skill/career-ai-course-factory/scripts/validate_career_package.py course-package

  tutorial-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate content and build tutorial
        run: npm test

  offline-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: courses/td-ai-006-rag-eval-ci/lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Adversarial evaluator tests
        run: python3 -m unittest discover -s tests -v
      - name: Evaluate candidate under review
        run: python3 scripts/evaluate.py --candidate data/candidate-current.jsonl --report reports/ci-current.json
      - name: Prove known regression is rejected
        run: |
          if python3 scripts/evaluate.py --candidate data/candidate-regressed.jsonl --report reports/ci-mutation.json; then
            echo "ERROR: known regression unexpectedly passed"
            exit 1
          fi
